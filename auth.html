<!DOCTYPE html>
<html lang="en">
<body>
  <h2>Account System</h2>
  
  <div id="auth-container">
    <input type="email" id="email" placeholder="Email" required><br>
    <input type="password" id="password" placeholder="Password" required><br>
    <button onclick="handleAuth('register')">Sign Up</button>
    <button onclick="handleAuth('login')">Login</button>
  </div>

  <p id="message"></p>

  <script>
    async function handleAuth(type) {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const messageEl = document.getElementById('message');

      messageEl.innerText = "Processing...";

      try {
        // This calls the files in your /functions/api/ folder
        const response = await fetch(`/api/${type}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          messageEl.style.color = "green";
          messageEl.innerText = type === 'login' ? "Success! Logged in." : "Account created! Now login.";
          
          if(type === 'login') {
            // Store a simple 'logged in' flag for now
            localStorage.setItem('isLoggedIn', 'true');
          }
        } else {
          messageEl.style.color = "red";
          messageEl.innerText = data.error || "Something went wrong.";
        }
      } catch (err) {
        messageEl.innerText = "Connection error.";
      }
    }
  </script>
</body>
</html>
