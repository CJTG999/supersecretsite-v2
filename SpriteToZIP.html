<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sprite3 Extractor</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root { --primary: #4d97ff; --success: #2ecc71; --bg: #f0f2f5; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; background: var(--bg); margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: white; padding: 2rem; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); text-align: center; width: 100%; max-width: 400px; }
        h1 { color: var(--primary); font-size: 1.5rem; margin-bottom: 1rem; }
        
        .file-input-wrapper { margin-bottom: 1.5rem; }
        input[type="file"] { width: 100%; font-size: 16px; } /* 16px prevents auto-zoom on iOS */
        
        button { 
            background: var(--primary); color: white; border: none; padding: 15px; 
            border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1rem;
            width: 100%; transition: opacity 0.2s; -webkit-tap-highlight-color: transparent;
        }
        button:disabled { background: #cbd5e0; cursor: not-allowed; }

        .progress-section { margin: 20px 0; display: none; }
        .bar-bg { width: 100%; background: #edf2f7; border-radius: 50px; height: 10px; overflow: hidden; margin-top: 8px; }
        .bar-fill { width: 0%; height: 100%; background: var(--primary); transition: width 0.3s ease; }
        
        #status { margin-top: 15px; font-size: 0.85rem; color: #4a5568; line-height: 1.4; }
    </style>
</head>
<body>

<div class="card">
    <h1>Sprite Extractor</h1>
    
    <div class="file-input-wrapper">
        <input type="file" id="upload" accept=".sprite3">
    </div>
    
    <button id="convertBtn" disabled>Convert to ZIP</button>

    <div class="progress-section" id="progressWrapper">
        <div id="status">Ready...</div>
        <div class="bar-bg">
            <div id="bar-fill" class="bar-fill"></div>
        </div>
    </div>
</div>

<script>
    const uploadInput = document.getElementById('upload');
    const convertBtn = document.getElementById('convertBtn');
    const barFill = document.getElementById('bar-fill');
    const progressWrapper = document.getElementById('progressWrapper');
    const statusText = document.getElementById('status');

    let fileBlob = null;
    let fileName = "";

    // Step 1: Handle Upload (Pre-loading file into memory for iOS)
    uploadInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;

        fileName = file.name;
        progressWrapper.style.display = 'block';
        statusText.innerText = "Reading file...";
        barFill.style.width = '0%';
        
        const reader = new FileReader();
        
        reader.onprogress = (event) => {
            if (event.lengthComputable) {
                const percent = (event.loaded / event.total) * 100;
                barFill.style.width = percent + '%';
                statusText.innerText = `Uploading: ${Math.round(percent)}%`;
            }
        };

        reader.onload = (event) => {
            fileBlob = event.target.result;
            convertBtn.disabled = false;
            statusText.innerText = "File loaded. Ready to convert!";
            barFill.style.width = '100%';
            barFill.style.background = "var(--success)";
        };

        reader.readAsArrayBuffer(file);
    });

    // Step 2: Handle Conversion
    convertBtn.addEventListener('click', async () => {
        if (!fileBlob) return;

        convertBtn.disabled = true;
        barFill.style.width = '0%';
        barFill.style.background = "var(--primary)";
        statusText.innerText = "Unzipping .sprite3...";

        try {
            const zip = new JSZip();
            const spriteData = await zip.loadAsync(fileBlob);
            
            const projectJsonFile = spriteData.file("project.json");
            if (!projectJsonFile) throw new Error("Not a valid Scratch sprite.");

            const projectJson = await projectJsonFile.async("string");
            const data = JSON.parse(projectJson);
            const costumes = data.costumes || [];
            
            const outputZip = new JSZip();
            
            for (let i = 0; i < costumes.length; i++) {
                const c = costumes[i];
                const progress = Math.round(((i + 1) / costumes.length) * 100);
                
                statusText.innerText = `Extracting: ${c.name}`;
                barFill.style.width = progress + '%';

                const assetFile = spriteData.file(c.md5ext);
                if (assetFile) {
                    const content = await assetFile.async("blob");
                    outputZip.file(`${c.name}.${c.dataFormat}`, content);
                }
            }

            statusText.innerText = "Generating ZIP...";
            const finalZip = await outputZip.generateAsync({type: "blob"});
            
            // iOS Save Trick
            const url = URL.createObjectURL(finalZip);
            const a = document.createElement('a');
            a.href = url;
            a.download = fileName.replace(".sprite3", "_assets.zip");
            document.body.appendChild(a);
            a.click();
            
            // Cleanup
            setTimeout(() => {
                window.URL.revokeObjectURL(url);
                document.body.removeChild(a);
                statusText.innerText = "Done! Check your Downloads.";
                convertBtn.disabled = false;
            }, 100);

        } catch (err) {
            statusText.innerText = "Error: " + err.message;
            statusText.style.color = "red";
            convertBtn.disabled = false;
        }
    });
</script>

</body>
</html>
