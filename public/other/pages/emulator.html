<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Emulator</title>
<style>
    /* Base Switch OS Styling */
    body {
        background-color: #2b2b2b;
        color: #ffffff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
        overflow: hidden;
        user-select: none;
    }
    
    header {
        display: flex;
        justify-content: space-between;
        padding: 20px 40px;
        align-items: flex-start;
    }
    .profile-icon {
        width: 60px;
        height: 60px;
        background: linear-gradient(135deg, #ff4b4b, #e60012);
        border-radius: 50%;
        border: 2px solid transparent;
        transition: border 0.1s;
        cursor: pointer;
    }
    .profile-icon:hover { border: 2px solid #00c3e3; }
    .status { font-size: 20px; display: flex; gap: 15px; }
    
    .active-title-container { text-align: center; height: 40px; margin-top: 10px; }
    #active-title {
        margin: 0; font-size: 26px; font-weight: normal;
        letter-spacing: 1px; text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
    }
    
    .game-list {
        display: flex; gap: 15px; padding: 20px 40px;
        height: 280px; align-items: center; overflow-x: auto; white-space: nowrap;
    }
    .game-list::-webkit-scrollbar { display: none; }
    
    .game-icon {
        position: relative;
        width: 256px; height: 256px;
        background: linear-gradient(135deg, #444, #333);
        background-size: cover; background-position: center;
        border: 5px solid transparent; border-radius: 4px;
        flex-shrink: 0; display: flex; justify-content: center; align-items: center;
        cursor: pointer; transition: transform 0.15s, border-color 0.1s;
        box-shadow: 0 8px 15px rgba(0,0,0,0.4);
        font-size: 40px; font-weight: bold; color: #666;
    }
    .game-icon:hover {
        border-color: #00c3e3; transform: scale(1.08) translateY(-10px);
        color: #888; z-index: 10;
    }

    .delete-btn {
        display: none; position: absolute; top: -10px; right: -10px;
        background: #e60012; color: white; border: 2px solid #2b2b2b;
        border-radius: 50%; width: 35px; height: 35px;
        font-size: 18px; font-weight: bold; cursor: pointer;
        justify-content: center; align-items: center; z-index: 20;
        box-shadow: 0 4px 8px rgba(0,0,0,0.5);
    }
    .delete-btn:hover { background: #ff4b4b; transform: scale(1.1); }
    .game-icon:hover .delete-btn { display: flex; }
    
    .system-row { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
    .sys-btn {
        width: 65px; height: 65px; background-color: #3c3c3c;
        border-radius: 50%; display: flex; justify-content: center; align-items: center;
        font-size: 24px; cursor: pointer; border: 3px solid transparent;
        transition: border 0.1s, background 0.1s; box-shadow: 0 4px 8px rgba(0,0,0,0.3);
    }
    .sys-btn:hover { border-color: #00c3e3; background-color: #4c4c4c; }

    .footer {
        position: absolute; bottom: 0; width: 100%; border-top: 1px solid #444;
        padding: 10px 40px; display: flex; justify-content: space-between;
        background: #2b2b2b; font-size: 15px; box-sizing: border-box; align-items: center;
    }
    .footer .links a { color: #00c3e3; text-decoration: none; margin-right: 15px; }
    .footer .links a:hover { text-decoration: underline; }
    .footer .controls span { margin-left: 20px; font-weight: bold; }
    .btn-icon {
        background: #111; color: #fff; border-radius: 50%;
        padding: 2px 8px; font-size: 12px; margin-right: 5px; border: 1px solid #555;
    }

    /* Modal Styling */
    #modal-overlay {
        display: none; position: fixed; top: 0; left: 0;
        width: 100vw; height: 100vh; background: rgba(0,0,0,0.8);
        z-index: 50; align-items: center; justify-content: center;
    }
    .modal {
        background: #2b2b2b; padding: 30px; border-radius: 8px;
        width: 400px; border: 2px solid #555; box-shadow: 0 10px 30px rgba(0,0,0,0.8);
    }
    .modal h3 { margin-top: 0; text-align: center; color: #fff; }
    .modal label { display: block; margin: 10px 0 5px; color: #aaa; font-size: 14px; }
    .modal input[type="text"], .modal select, .modal input[type="file"] {
        width: 100%; padding: 10px; background: #111; border: 1px solid #444;
        color: white; border-radius: 4px; box-sizing: border-box;
    }
    .modal input:focus, .modal select:focus { border-color: #00c3e3; outline: none; }
    .modal-btns { display: flex; gap: 10px; margin-top: 25px; }
    .modal-btn {
        flex: 1; padding: 12px; border: none; border-radius: 4px;
        cursor: pointer; font-weight: bold; font-size: 16px;
    }
    .btn-save { background: #00c3e3; color: #000; }
    .btn-save:hover { background: #00a0bb; }
    .btn-cancel { background: #444; color: #fff; }
    .btn-cancel:hover { background: #555; }

    /* Loading Screen Styling */
    #loading-screen {
        display: none; position: absolute; top: 0; left: 0;
        width: 100vw; height: 100vh; background: #2b2b2b;
        z-index: 150; flex-direction: column; justify-content: center; align-items: center;
    }
    .loading-icon {
        width: 60px; height: 60px; background: #e60012;
        border-radius: 10px; animation: pulse 1s infinite alternate;
    }
    @keyframes pulse {
        0% { transform: scale(0.9); opacity: 0.7; }
        100% { transform: scale(1.1); opacity: 1; }
    }
    #loading-screen p { margin-top: 20px; font-size: 20px; color: #ccc; }

    /* Emulator Container */
    #emulator-container {
        display: none; position: absolute; top: 0; left: 0;
        width: 100vw; height: 100vh; background: black; z-index: 100;
    }
    #game { width: 100%; height: 100%; }
    .close-emu {
        position: absolute; top: 20px; left: 20px; z-index: 101;
        color: white; background: rgba(255,0,0,0.7); border: none;
        padding: 10px 15px; cursor: pointer; font-size: 16px; border-radius: 5px;
    }
</style>
</head>
<body>

<div id="ui-container">
    <header>
        <div class="profile-icon"></div>
        <div class="status">
            <span id="clock">12:00 PM</span><span>📶</span><span>🔋</span>
        </div>
    </header>
    
    <div class="active-title-container">
        <h2 id="active-title">All Software</h2>
    </div>
    
    <div class="game-list" id="game-list"></div>

    <input type="file" id="json-upload" accept=".json" style="display: none" onchange="importData(event)">

    <div class="system-row">
        <div class="sys-btn" title="Add Game" onmouseenter="setTitle('Add a New Game')" onmouseleave="setTitle('All Software')" onclick="openModal()">➕</div>
        <div class="sys-btn" title="Save Backup" onmouseenter="setTitle('Save JSON Backup')" onmouseleave="setTitle('All Software')" onclick="exportData()">💾</div>
        <div class="sys-btn" title="Load Backup" onmouseenter="setTitle('Load JSON Backup')" onmouseleave="setTitle('All Software')" onclick="document.getElementById('json-upload').click()">📂</div>
    </div>

    <div class="footer">
        <div class="links">
            <a href="https://www.romsgames.net/" target="_blank">ROM DOWNLOADS</a> | 
            <a href="https://romsfun.com/roms/" target="_blank">MORE ROM DOWNLOADS</a>
        </div>
        <div class="controls">
            <span><span class="btn-icon">A</span> Start</span>
            <span><span class="btn-icon">B</span> Back</span>
        </div>
    </div>
</div>

<div id="modal-overlay">
    <div class="modal">
        <h3>Create New Game</h3>
        <label>Game Name</label>
        <input type="text" id="game-name" placeholder="e.g., Super Mario World">
        <label>System Core</label>
        <select id="game-core">
            <option value="nes">Nintendo (NES)</option>
            <option value="snes">Super Nintendo (SNES)</option>
            <option value="n64">Nintendo 64</option>
            <option value="gb">Game Boy</option>
            <option value="gbc">Game Boy Color</option>
            <option value="gba">Game Boy Advance</option>
            <option value="nds">Nintendo DS</option>
            <option value="genesis">Sega Genesis</option>
            <option value="psx">PlayStation 1</option>
        </select>
        <label>ROM File</label>
        <input type="file" id="game-rom">
        <label>Box Art (Optional)</label>
        <input type="file" id="game-photo" accept="image/*">
        <div class="modal-btns">
            <button class="modal-btn btn-cancel" onclick="closeModal()">Cancel</button>
            <button class="modal-btn btn-save" onclick="saveNewGame()">Save Game</button>
        </div>
    </div>
</div>

<div id="loading-screen">
    <div class="loading-icon"></div>
    <p>Starting software...</p>
</div>

<div id="emulator-container">
    <button class="close-emu" onclick="closeEmulator()">Close Game</button>
    <div id="game"></div>
</div>

<script>
    setInterval(() => {
        document.getElementById('clock').innerText = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});
    }, 1000);

    function setTitle(text) { document.getElementById('active-title').innerText = text; }

    const dbPromise = new Promise((resolve, reject) => {
        const request = indexedDB.open('SwitchEmuDB', 1);
        request.onupgradeneeded = e => {
            e.target.result.createObjectStore('games', { keyPath: 'id' });
        };
        request.onsuccess = e => resolve(e.target.result);
        request.onerror = e => reject(e.target.error);
    });

    async function getGames() {
        const db = await dbPromise;
        return new Promise(resolve => {
            const tx = db.transaction('games', 'readonly');
            const store = tx.objectStore('games');
            const request = store.getAll();
            request.onsuccess = () => resolve(request.result);
        });
    }

    async function saveGameToDB(game) {
        const db = await dbPromise;
        return new Promise(resolve => {
            const tx = db.transaction('games', 'readwrite');
            const store = tx.objectStore('games');
            store.put(game);
            tx.oncomplete = () => resolve();
        });
    }

    async function deleteGameFromDB(id) {
        const db = await dbPromise;
        return new Promise(resolve => {
            const tx = db.transaction('games', 'readwrite');
            const store = tx.objectStore('games');
            store.delete(id);
            tx.oncomplete = () => resolve();
        });
    }

    async function renderGames() {
        const list = document.getElementById('game-list');
        list.innerHTML = ''; 
        const games = await getGames();
        
        games.forEach(game => {
            const div = document.createElement('div');
            div.className = 'game-icon';
            
            if(game.photo) {
                div.style.backgroundImage = `url(${game.photo})`;
            } else {
                div.innerHTML = game.system.toUpperCase(); 
            }
            
            const delBtn = document.createElement('div');
            delBtn.className = 'delete-btn';
            delBtn.innerHTML = '✖';
            delBtn.onclick = async (e) => {
                e.stopPropagation();
                if(confirm(`Are you sure you want to delete ${game.name}?`)) {
                    await deleteGameFromDB(game.id);
                    renderGames();
                }
            };
            div.appendChild(delBtn);

            div.onmouseenter = () => setTitle(game.name);
            div.onmouseleave = () => setTitle('All Software');
            div.onclick = () => launchGame(game);
            list.appendChild(div);
        });

        if(games.length > 0) {
            const allSoft = document.createElement('div');
            allSoft.className = 'game-icon';
            allSoft.style.width = '100px';
            allSoft.style.borderRadius = '50%';
            allSoft.innerHTML = '⛶';
            allSoft.onmouseenter = () => setTitle('All Software');
            allSoft.onmouseleave = () => setTitle('All Software');
            list.appendChild(allSoft);
        }
    }

    function openModal() { document.getElementById('modal-overlay').style.display = 'flex'; }
    function closeModal() { 
        document.getElementById('modal-overlay').style.display = 'none'; 
        document.getElementById('game-name').value = '';
        document.getElementById('game-rom').value = '';
        document.getElementById('game-photo').value = '';
    }

    function readFileAsBase64(file) {
        return new Promise((resolve, reject) => {
            if(!file) { resolve(null); return; }
            const reader = new FileReader();
            reader.onload = e => resolve(e.target.result);
            reader.onerror = reject;
            reader.readAsDataURL(file);
        });
    }

    async function saveNewGame() {
        const name = document.getElementById('game-name').value || "Unknown Game";
        const core = document.getElementById('game-core').value;
        const romFile = document.getElementById('game-rom').files[0];
        const photoFile = document.getElementById('game-photo').files[0];

        if(!romFile) {
            alert("You must select a ROM file!");
            return;
        }

        try {
            const romBase64 = await readFileAsBase64(romFile);
            const photoBase64 = await readFileAsBase64(photoFile);

            await saveGameToDB({
                id: Date.now(),
                name: name,
                system: core,
                data: romBase64,
                photo: photoBase64
            });

            await renderGames();
            closeModal();
        } catch (error) {
            alert("An error occurred while saving the game.");
            console.error(error);
        }
    }

    async function exportData() {
        const games = await getGames();
        const data = { games: games };
        const blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = 'switch_emulator_backup.json';
        a.click();
        URL.revokeObjectURL(url);
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async function(e) {
            try {
                const data = JSON.parse(e.target.result);
                if (data.games) {
                    for(let game of data.games) {
                        await saveGameToDB(game);
                    }
                    await renderGames();
                    alert('Backup loaded successfully!');
                } else {
                    alert('Invalid backup file structure.');
                }
            } catch(err) {
                alert('Error parsing JSON backup file.');
            }
        };
        reader.readAsText(file);
    }

    function launchGame(game) {
        document.getElementById('ui-container').style.display = 'none';
        
        // Show our new loading screen
        const loadingScreen = document.getElementById('loading-screen');
        loadingScreen.style.display = 'flex';

        // We use a tiny timeout to ensure the browser has time to render the loading screen 
        // before it gets frozen decoding massive ROM files.
        setTimeout(() => {
            fetch(game.data)
                .then(res => res.blob())
                .then(blob => {
                    const blobUrl = URL.createObjectURL(blob);
                    window.EJS_player = '#game';
                    window.EJS_core = game.system;
                    window.EJS_gameUrl = blobUrl;
                    window.EJS_pathtodata = 'https://cdn.emulatorjs.org/latest/data/';

                    const script = document.createElement('script');
                    script.src = 'https://cdn.emulatorjs.org/latest/data/loader.js';
                    
                    // Once the EmulatorJS script finishes loading, hide our loading screen and show the game
                    script.onload = () => {
                        loadingScreen.style.display = 'none';
                        document.getElementById('emulator-container').style.display = 'block';
                    };
                    
                    document.body.appendChild(script);
                })
                .catch(err => {
                    alert("Error loading game data.");
                    location.reload();
                });
        }, 50);
    }

    function closeEmulator() { location.reload(); }

    renderGames();
</script>
</body>
</html>
