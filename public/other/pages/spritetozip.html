<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Scratch Sprite3 → PNG Converter</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body {
    background:#111827;
    color:white;
    font-family:Arial, sans-serif;
    text-align:center;
    padding:40px;
}

.box {
    background:#1f2937;
    padding:30px;
    border-radius:15px;
    max-width:700px;
    margin:auto;
}

button, input {
    margin:10px;
    padding:12px;
    border-radius:8px;
    border:none;
}

button {
    background:#22c55e;
    color:white;
    cursor:pointer;
    font-weight:bold;
}

button:hover {
    background:#16a34a;
}

#log {
    background:#000;
    text-align:left;
    padding:15px;
    height:200px;
    overflow:auto;
    border-radius:10px;
    font-family:monospace;
}
</style>
</head>

<body>

<div class="box">

<h1>🐱 Scratch Sprite3 → PNG</h1>

<p>
Convert Scratch 3 sprite files into a ZIP full of PNG costumes.
</p>

<input type="file" id="file" accept=".sprite3">

<br>

<label>
PNG Scale:
<select id="scale">
<option value="1">1x</option>
<option value="2">2x</option>
<option value="4">4x</option>
</select>
</label>

<br>

<button onclick="convert()">Convert</button>

<div id="log"></div>

</div>


<script>

const logBox=document.getElementById("log");

function log(t){
    logBox.innerHTML += t+"<br>";
    logBox.scrollTop=logBox.scrollHeight;
}


async function renderSVG(svgText, scale){

    return new Promise(resolve=>{

        let img=new Image();

        let blob=new Blob(
            [svgText],
            {type:"image/svg+xml"}
        );

        let url=URL.createObjectURL(blob);


        img.onload=()=>{

            let canvas=document.createElement("canvas");

            canvas.width=img.width*scale;
            canvas.height=img.height*scale;

            let ctx=canvas.getContext("2d");

            ctx.drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
            );


            canvas.toBlob(
                b=>{
                    resolve(b);
                },
                "image/png"
            );


            URL.revokeObjectURL(url);
        };


        img.src=url;

    });

}



async function bitmapToPNG(blob, scale){

    return new Promise(resolve=>{

        let img=new Image();

        let url=URL.createObjectURL(blob);


        img.onload=()=>{

            let canvas=document.createElement("canvas");

            canvas.width=img.width*scale;
            canvas.height=img.height*scale;


            let ctx=canvas.getContext("2d");

            ctx.drawImage(
                img,
                0,
                0,
                canvas.width,
                canvas.height
            );


            canvas.toBlob(
                b=>resolve(b),
                "image/png"
            );


            URL.revokeObjectURL(url);

        };


        img.src=url;

    });

}



async function convert(){

let file=document.getElementById("file").files[0];

if(!file){
    alert("Choose a .sprite3 file first!");
    return;
}


log("Opening sprite...");


let zip=await JSZip.loadAsync(file);


let jsonFile=zip.file("sprite.json");

if(!jsonFile){

    alert("Not a valid Scratch sprite3 file!");

    return;
}


let sprite=JSON.parse(
    await jsonFile.async("text")
);


let output=new JSZip();


let scale=
Number(document.getElementById("scale").value);



let costumes=sprite.costumes;


log(
"Found "+costumes.length+" costumes"
);



for(let i=0;i<costumes.length;i++){

    let c=costumes[i];

    log(
    "Converting: "+c.name
    );


    let asset=
        c.assetId+"."+c.dataFormat;


    let file=zip.file(asset);


    if(!file){

        log(
        "Missing asset: "+asset
        );

        continue;
    }


    let png;


    if(c.dataFormat==="svg"){

        let svg=
        await file.async("text");

        png=
        await renderSVG(svg,scale);

    }

    else {

        let blob=
        await file.async("blob");

        png=
        await bitmapToPNG(blob,scale);

    }


    output.file(
        cleanName(c.name)+".png",
        png
    );

}



log("Creating ZIP...");


let result=
await output.generateAsync(
{
    type:"blob"
}
);



let a=document.createElement("a");

a.href=
URL.createObjectURL(result);


a.download=
file.name.replace(".sprite3","")+"_PNGs.zip";


a.click();


log("Done!");

}



function cleanName(name){

return name
.replace(/[\\/:*?"<>|]/g,"_")
.trim();

}

</script>

</body>
</html>
