<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DarkPad - Text Editor</title>
    <style>
        /* --- CUSTOM CURSOR FIX --- */

        /* 1. Apply to the root and body */
        html, body {
            cursor: url('https://codehs.com/uploads/471381c796bfff3712cd05b64b44142a'), auto !important;
            min-height: 100vh;
        }

        /* 2. Apply to all interactive elements */
        /* We include 'a' tags, buttons, and tailwind-style pointer classes */
        a, 
        button, 
        input, 
        select, 
        textarea, 
        .cursor-pointer, 
        #keystroke-tester-container div,
        [role="button"] {
            cursor: url('https://codehs.com/uploads/83f80767e459872bcd2a56d8cc903e59'), pointer !important;
        }

        /* 3. Special fix for iframes/modals */
        #gameModal, .bg-gray-900-transparent {
            cursor: url('https://codehs.com/uploads/471381c796bfff3712cd05b64b44142a'), auto !important;
        }
        /* --- 1. THEME & BASIC SETUP --- */
        :root {
            --bg-color: #1e1e1e;
            --toolbar-bg: #2d2d2d;
            --text-color: #d4d4d4;
            --accent-color: #007acc;
            --hover-color: #005f9e;
            --modal-bg: #252526;
            --border-color: #3e3e42;
        }

        body {
            margin: 0;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
        }

        /* --- 2. TOOLBAR --- */
        .toolbar {
            background-color: var(--toolbar-bg);
            padding: 10px 20px;
            display: flex;
            gap: 10px;
            border-bottom: 1px solid var(--border-color);
            align-items: center;
        }

        h1 {
            margin: 0;
            font-size: 1.2rem;
            margin-right: auto;
            color: #fff;
            font-weight: normal;
        }

        button, .file-upload {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
            text-decoration: none;
            display: inline-block;
        }

        button:hover, .file-upload:hover {
            background-color: var(--hover-color);
        }

        #fileInput { display: none; }

        /* --- 3. EDITOR AREA --- */
        #editor {
            flex-grow: 1;
            background-color: var(--bg-color);
            color: var(--text-color);
            border: none;
            resize: none;
            padding: 20px;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 16px;
            line-height: 1.5;
            outline: none;
        }

        ::-webkit-scrollbar { width: 10px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: #444; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }

        /* --- 4. POPUP MODAL STYLING --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.2s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-box {
            background: var(--modal-bg);
            padding: 20px;
            border-radius: 8px;
            width: 350px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal-title {
            font-size: 1.1rem;
            color: white;
            margin-bottom: 5px;
        }

        /* Adjusted to handle single input */
        .input-group {
            display: flex;
            width: 100%;
        }

        input[type="text"] {
            background: #3c3c3c;
            border: 1px solid var(--border-color);
            color: white;
            padding: 10px;
            border-radius: 4px;
            font-size: 0.9rem;
            outline: none;
            width: 100%; /* Full width now */
            box-sizing: border-box;
        }
        
        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
            margin-top: 5px;
        }

        .btn-cancel { background-color: #444; }
        .btn-cancel:hover { background-color: #555; }
    </style>
</head>
<body>

    <div class="toolbar">
        <h1>DarkPad</h1>
        <label for="fileInput" class="file-upload">Open</label>
        <input type="file" id="fileInput">
        <button onclick="openSaveModal()">Save As...</button>
    </div>

    <textarea id="editor" placeholder="Start typing..."></textarea>

    <div class="modal-overlay" id="saveModal">
        <div class="modal-box">
            <div class="modal-title">Save File</div>
            
            <div class="input-group">
                <input type="text" id="fileNameInput" placeholder="example.txt">
            </div>

            <div class="modal-actions">
                <button class="btn-cancel" onclick="closeSaveModal()">Cancel</button>
                <button onclick="confirmDownload()">Download</button>
            </div>
        </div>
    </div>

    <script>
        // References
        const fileInput = document.getElementById('fileInput');
        const editor = document.getElementById('editor');
        const saveModal = document.getElementById('saveModal');
        const fileNameInput = document.getElementById('fileNameInput');

        // --- OPEN FILE LOGIC ---
        fileInput.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;
            
            // Set the input value to the FULL file name (e.g. "script.js")
            fileNameInput.value = file.name;

            const reader = new FileReader();
            reader.onload = function(e) { editor.value = e.target.result; };
            reader.readAsText(file);
        });

        // --- MODAL LOGIC ---
        function openSaveModal() {
            saveModal.classList.add('active');
            
            // If box is empty, set a default
            if (!fileNameInput.value) fileNameInput.value = "document.txt";
            
            fileNameInput.focus();
            fileNameInput.select(); // Highlight text for easy overwriting
        }

        function closeSaveModal() {
            saveModal.classList.remove('active');
        }

        saveModal.addEventListener('click', function(e) {
            if (e.target === saveModal) closeSaveModal();
        });

        // Add "Enter key" support to save immediately
        fileNameInput.addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                event.preventDefault();
                confirmDownload();
            }
        });

        // --- DOWNLOAD LOGIC ---
        function confirmDownload() {
            const text = editor.value;
            let filename = fileNameInput.value.trim();
            
            // Fallback: If they left it blank
            if (!filename) filename = "untitled.txt";

            // Fallback: If they typed a name but forgot the dot (e.g. "notes"), add .txt
            if (filename.indexOf('.') === -1) {
                filename += ".txt";
            }
            
            const blob = new Blob([text], { type: 'text/plain' });
            
            const anchor = document.createElement('a');
            anchor.href = URL.createObjectURL(blob);
            anchor.download = filename; // Use the full manually typed name
            
            document.body.appendChild(anchor);
            anchor.click();
            document.body.removeChild(anchor);
            
            closeSaveModal();
        }
    </script>
</body>
</html>
