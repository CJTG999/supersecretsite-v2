<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Runner</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            background: linear-gradient(-45deg, #020617, #1e1b4b, #312e81, #020617);
            background-size: 400% 400%;
            animation: flow 15s ease infinite;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-family: ui-sans-serif, system-ui, sans-serif;
        }

        @keyframes flow {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
        }

        .glass-btn {
            background: rgba(99, 102, 241, 0.2);
            border: 1px solid rgba(165, 180, 252, 0.2);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glass-btn:hover {
            background: rgba(99, 102, 241, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(99, 102, 241, 0.4);
        }

        textarea {
            background: rgba(0, 0, 0, 0.3) !important;
            border: 1px solid rgba(255, 255, 255, 0.05) !important;
            resize: none;
        }

        .tab-active {
            color: #818cf8;
            border-bottom: 2px solid #818cf8;
        }
    </style>
</head>
<body>

    <div class="glass-card p-10 max-w-2xl w-full mx-4">
        <header class="text-center mb-10">
            <h1 class="text-3xl font-light tracking-tighter italic">HTML<span class="font-bold">Portal</span></h1>
            <p class="text-slate-500 text-sm mt-1">Execute HTML</p>
        </header>

        <div class="flex gap-8 mb-8 border-b border-white/5 text-sm font-medium">
            <button onclick="setMode('text')" id="btn-text" class="pb-4 tab-active transition-all">Input Text</button>
            <button onclick="setMode('file')" id="btn-file" class="pb-4 text-slate-500 hover:text-slate-300 transition-all">Upload File</button>
        </div>

        <div id="input-text-container" class="space-y-4">
            <textarea id="html-input" rows="10" class="w-full rounded-2xl p-5 font-mono text-sm focus:outline-none focus:ring-1 focus:ring-indigo-500/50" placeholder=""></textarea>
            <button onclick="runFromText()" class="glass-btn w-full py-4 rounded-2xl font-bold text-indigo-100">
                Run
            </button>
        </div>

        <div id="input-file-container" class="hidden">
            <label class="group cursor-pointer border-2 border-dashed border-white/10 rounded-3xl p-16 block hover:border-indigo-500/40 transition-all text-center">
                <div class="bg-indigo-500/10 w-16 h-16 rounded-full flex items-center justify-center mx-auto mb-4 group-hover:scale-110 transition-transform">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z" />
                    </svg>
                </div>
                <span class="text-slate-400 text-sm">Select .html to inject</span>
                <input type="file" id="file-input" accept=".html" class="hidden" onchange="runFromFile(this)" />
            </label>
        </div>
    </div>

    <script>
        function setMode(mode) {
            const isText = mode === 'text';
            document.getElementById('input-text-container').classList.toggle('hidden', !isText);
            document.getElementById('input-file-container').classList.toggle('hidden', isText);
            document.getElementById('btn-text').className = isText ? 'pb-4 tab-active transition-all' : 'pb-4 text-slate-500 transition-all';
            document.getElementById('btn-file').className = !isText ? 'pb-4 tab-active transition-all' : 'pb-4 text-slate-500 transition-all';
        }

        function execute(content) {
            if (!content) return alert("Source is empty.");
            
            // Create a Blob from the content
            const blob = new Blob([content], { type: 'text/html' });
            // Create a URL for that Blob
            const blobUrl = URL.createObjectURL(blob);
            // Open it in a new tab
            window.open(blobUrl, '_blank');
            
            // Cleanup: The URL is revoked after a short delay to keep memory clean
            setTimeout(() => URL.revokeObjectURL(blobUrl), 10000);
        }

        function runFromText() {
            const code = document.getElementById('html-input').value;
            execute(code);
        }

        function runFromFile(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = (e) => execute(e.target.result);
            reader.readAsText(file);
            
            // Clear input so same file can be uploaded twice
            input.value = '';
        }
    </script>
</body>
</html>
