<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Hax</title>
    <link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAABAAAAAQCAIAAACQkWg2AAAAIUlEQVR4AWMgB7g5+2Oi/9gACRpGNWCVw2oKURpGNZABACyfd5rreVdMAAAAAElFTkSuQmCC">
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- chess.js for game logic and move validation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .board-container {
            position: relative;
            width: clamp(300px, 90vw, 600px);
            height: clamp(300px, 90vw, 600px);
        }
        #chessBoard {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            border: 2px solid #374151; /* gray-700 */
            border-radius: 0.5rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .square {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: clamp(24px, 7vw, 48px);
            user-select: none;
        }
        .light { background-color: #f3f4f6; } /* gray-100 */
        .dark { background-color: #6b7280; } /* gray-500 */
        .piece {
            cursor: grab;
            text-shadow: 0 2px 4px rgba(0,0,0,0.2);
        }
        .piece.dragging {
            opacity: 0.5;
            cursor: grabbing;
        }
        #arrowCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Allows clicks to go through to the board */
            z-index: 10;
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex flex-col items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-4xl mx-auto flex flex-col lg:flex-row items-center lg:items-start justify-center gap-8">
        
        <!-- Chess Board -->
        <div class="board-container">
            <div id="chessBoard"></div>
            <canvas id="arrowCanvas"></canvas>
        </div>

        <!-- Controls and Status -->
        <div class="w-full lg:w-1/3 bg-gray-800 p-6 rounded-lg shadow-xl flex flex-col gap-4 text-center">
            <h1 class="text-3xl font-bold text-gray-100">Chess AI</h1>
            <p class="text-gray-400">Drag & drop to move. The AI will show you the best move.</p>
            
            <div id="status" class="bg-gray-700 p-3 rounded-md text-lg font-semibold h-16 flex items-center justify-center">
                White to move
            </div>

            <button id="bestMoveBtn" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 px-4 rounded-lg transition-colors duration-300">
                Show Best Move
            </button>
            
            <p class="text-xs text-gray-500 text-center -mt-2">Using a built-in Minimax AI.</p>

            <button id="resetBtn" class="w-full bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg transition-colors duration-300">
                Reset Game
            </button>

            <div class="text-left mt-4 text-sm text-gray-500">
                <p><span class="font-bold">FEN:</span> <code id="fen" class="break-all"></code></p>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- DOM Elements ---
            const boardElement = document.getElementById('chessBoard');
            const statusElement = document.getElementById('status');
            const fenElement = document.getElementById('fen');
            const bestMoveBtn = document.getElementById('bestMoveBtn');
            const resetBtn = document.getElementById('resetBtn');
            const canvas = document.getElementById('arrowCanvas');
            const ctx = canvas.getContext('2d');

            // --- Game State ---
            let game = new Chess();
            let draggedPiece = null;
            let sourceSquare = null;

            // --- Unicode pieces ---
            const pieces = {
                p: '♟', r: '♜', n: '♞', b: '♝', q: '♛', k: '♚',
                P: '♙', R: '♖', N: '♘', B: '♗', Q: '♕', K: '♔'
            };

            // --- NEW AI (Minimax Algorithm) Section ---
            const pieceValues = { 'p': 10, 'n': 30, 'b': 30, 'r': 50, 'q': 90, 'k': 900 };

            function evaluateBoard(game) {
                if (game.in_checkmate()) {
                    // The player whose turn it is is in checkmate. So the other player has won.
                    return game.turn() === 'w' ? -Infinity : Infinity;
                }
                if (game.in_draw() || game.in_stalemate()) {
                    return 0;
                }
                // Simple material count
                let totalEvaluation = 0;
                const board = game.board();
                for (let i = 0; i < 8; i++) {
                    for (let j = 0; j < 8; j++) {
                        const piece = board[i][j];
                        if (piece) {
                            const value = pieceValues[piece.type];
                            totalEvaluation += piece.color === 'w' ? value : -value;
                        }
                    }
                }
                return totalEvaluation;
            }

            function minimax(game, depth, alpha, beta, isMaximizingPlayer) {
                if (depth === 0 || game.game_over()) {
                    return evaluateBoard(game);
                }
                const moves = game.moves();
                if (isMaximizingPlayer) { // White's turn (maximizer)
                    let maxEval = -Infinity;
                    for (const move of moves) {
                        game.move(move);
                        const evaluation = minimax(game, depth - 1, alpha, beta, false);
                        game.undo();
                        maxEval = Math.max(maxEval, evaluation);
                        alpha = Math.max(alpha, evaluation);
                        if (beta <= alpha) {
                            break;
                        }
                    }
                    return maxEval;
                } else { // Black's turn (minimizer)
                    let minEval = Infinity;
                    for (const move of moves) {
                        game.move(move);
                        const evaluation = minimax(game, depth - 1, alpha, beta, true);
                        game.undo();
                        minEval = Math.min(minEval, evaluation);
                        beta = Math.min(beta, evaluation);
                        if (beta <= alpha) {
                            break;
                        }
                    }
                    return minEval;
                }
            }

            function getBestMove(game) {
                const moves = game.moves({ verbose: true });
                if (moves.length === 0) return null;

                let bestMove = null;
                let bestValue = game.turn() === 'w' ? -Infinity : Infinity;
                const isMaximizing = game.turn() === 'w';
                const searchDepth = 3; // A shallow depth for performance in browser

                for (const move of moves) {
                    game.move(move.san);
                    const value = minimax(game, searchDepth - 1, -Infinity, Infinity, !isMaximizing);
                    game.undo();

                    if (isMaximizing) {
                        if (value >= bestValue) {
                            bestValue = value;
                            bestMove = move;
                        }
                    } else {
                        if (value <= bestValue) {
                            bestValue = value;
                            bestMove = move;
                        }
                    }
                }
                return bestMove ? `${bestMove.from}${bestMove.to}` : null;
            }
            
            // --- Drawing Functions ---
            function drawBoard() {
                boardElement.innerHTML = '';
                clearArrow();
                const squares = game.board();
                for (let i = 0; i < 8; i++) {
                    for (let j = 0; j < 8; j++) {
                        const square = document.createElement('div');
                        const isLight = (i + j) % 2 === 0;
                        square.className = `square ${isLight ? 'light' : 'dark'}`;
                        square.dataset.row = i;
                        square.dataset.col = j;
                        square.dataset.square = String.fromCharCode(97 + j) + (8 - i);
                        
                        const pieceInfo = squares[i][j];
                        if (pieceInfo) {
                            const pieceElement = document.createElement('div');
                            pieceElement.className = 'piece';
                            const pieceKey = pieceInfo.color === 'w' ? pieceInfo.type.toUpperCase() : pieceInfo.type;
                            pieceElement.innerText = pieces[pieceKey];
                            pieceElement.style.color = pieceInfo.color === 'w' ? '#FFFFFF' : '#000000';
                            pieceElement.draggable = true;
                            pieceElement.dataset.piece = `${pieceInfo.type}${pieceInfo.color}`;
                            square.appendChild(pieceElement);
                        }
                        boardElement.appendChild(square);
                    }
                }
                updateStatus();
                addDragListeners();
            }

            function drawArrow(move) {
                const from = move.substring(0, 2);
                const to = move.substring(2, 4);

                const squareSize = boardElement.offsetWidth / 8;
                canvas.width = boardElement.offsetWidth;
                canvas.height = boardElement.offsetHeight;

                const fromCoords = squareToCoords(from, squareSize);
                const toCoords = squareToCoords(to, squareSize);

                ctx.clearRect(0, 0, canvas.width, canvas.height);
                ctx.beginPath();
                
                const headlen = 15; // length of head in pixels
                const angle = Math.atan2(toCoords.y - fromCoords.y, toCoords.x - fromCoords.x);
                
                ctx.moveTo(fromCoords.x, fromCoords.y);
                ctx.lineTo(toCoords.x, toCoords.y);
                
                // Arrowhead
                ctx.lineTo(toCoords.x - headlen * Math.cos(angle - Math.PI / 6), toCoords.y - headlen * Math.sin(angle - Math.PI / 6));
                ctx.moveTo(toCoords.x, toCoords.y);
                ctx.lineTo(toCoords.x - headlen * Math.cos(angle + Math.PI / 6), toCoords.y - headlen * Math.sin(angle + Math.PI / 6));
                
                ctx.strokeStyle = "rgba(25, 181, 254, 0.8)"; // Blue with transparency
                ctx.lineWidth = 8;
                ctx.lineCap = 'round';
                ctx.stroke();
            }

            function clearArrow() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
            }

            // --- Utility Functions ---
            function updateStatus() {
                let moveColor = game.turn() === 'b' ? 'Black' : 'White';

                if (game.in_checkmate()) {
                    statusElement.textContent = `Checkmate! ${moveColor === 'White' ? 'Black' : 'White'} wins.`;
                } else if (game.in_draw()) {
                    statusElement.textContent = 'Draw!';
                } else {
                    statusElement.textContent = `${moveColor} to move`;
                    if (game.in_check()) {
                        statusElement.textContent += ' (in check)';
                    }
                }
                fenElement.textContent = game.fen();
            }
            
            function squareToCoords(square, squareSize) {
                const col = square.charCodeAt(0) - 97;
                const row = 8 - parseInt(square.substring(1));
                return {
                    x: col * squareSize + squareSize / 2,
                    y: row * squareSize + squareSize / 2
                };
            }

            // --- Event Handlers ---
            function onDragStart(e) {
                draggedPiece = e.target;
                sourceSquare = e.target.parentElement.dataset.square;
                setTimeout(() => e.target.classList.add('dragging'), 0);
            }

            function onDragEnd(e) {
                draggedPiece.classList.remove('dragging');
                draggedPiece = null;
                sourceSquare = null;
            }

            function onDragOver(e) {
                e.preventDefault();
            }

            function onDrop(e) {
                e.preventDefault();
                const targetEl = e.target.closest('.square');
                if (!targetEl || !sourceSquare) return;
                
                const targetSquare = targetEl.dataset.square;
                const move = game.move({
                    from: sourceSquare,
                    to: targetSquare,
                    promotion: 'q' // Always promote to a queen for simplicity
                });

                if (move === null) {
                    // illegal move
                    return;
                }
                
                // Valid move, update board
                drawBoard();
            }
            
            function addDragListeners() {
                const pieces = document.querySelectorAll('.piece');
                const squares = document.querySelectorAll('.square');

                pieces.forEach(piece => {
                    piece.addEventListener('dragstart', onDragStart);
                    piece.addEventListener('dragend', onDragEnd);
                });

                squares.forEach(square => {
                    square.addEventListener('dragover', onDragOver);
                    square.addEventListener('drop', onDrop);
                });
            }

            bestMoveBtn.addEventListener('click', () => {
                if(game.game_over()) return;
                bestMoveBtn.disabled = true;
                bestMoveBtn.textContent = "Calculating...";
                statusElement.textContent = "AI is thinking...";

                // Use a timeout to allow the UI to update before the calculation starts
                setTimeout(() => {
                    const bestMove = getBestMove(game);

                    if (bestMove) {
                        drawArrow(bestMove);
                        statusElement.textContent = `AI suggests: ${bestMove}`;
                    } else {
                        statusElement.textContent = "No best move found.";
                    }
                    
                    bestMoveBtn.disabled = false;
                    bestMoveBtn.textContent = "Show Best Move";
                }, 50);
            });
            
            resetBtn.addEventListener('click', () => {
                game.reset();
                drawBoard();
                statusElement.textContent = "Game Reset. White to move.";
            });

            // --- Initial Load ---
            drawBoard();
            window.addEventListener('resize', () => {
                // Redraw arrow on resize if one exists
                if (ctx.isPointInPath(1, 1)) { // A hacky way to check if canvas has content
                   // Currently arrow clears on move, so this is less critical. 
                   // A more robust solution would store the last move and redraw it.
                   clearArrow();
                }
            });
        });
    </script>
</body>
</html>
