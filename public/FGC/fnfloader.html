<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>FNF Web - Perfect Note Vanish Fix</title>
    <style>
        :root { --bg: #050505; --panel: #111; --text: #eee; --accent: #38EF7D; --error: #ff4b2b; --bot: #00D2FF; }
        body { 
            background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; 
            display: flex; flex-direction: column; margin: 0; overflow: hidden; height: 100vh;
        }
        #ui { 
            background: var(--panel); padding: 8px; border-bottom: 1px solid #222; 
            display: flex; gap: 10px; align-items: center; width: 100%; justify-content: center; 
            font-size: 10px; z-index: 20; flex-wrap: wrap; box-sizing: border-box;
        }
        .input-group { display: flex; flex-direction: column; gap: 2px; }
        select, input[type="range"] { background: #222; color: #fff; border: 1px solid #444; font-size: 10px; border-radius: 3px; }
        input[type="file"] { width: 90px; color: #666; font-size: 8px; }
        #game-container { position: relative; flex-grow: 1; width: 100%; display: flex; justify-content: center; align-items: center; background: #000; overflow: hidden; }
        #game { width: 100%; height: 100%; object-fit: contain; }
        .screen-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 10; }
        .btn-main { padding: 15px 40px; font-weight: bold; background: #fff; color: #000; border: none; border-radius: 4px; cursor: pointer; }
        .toggle { background: #222; color: #fff; border: 1px solid #333; padding: 5px 8px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 9px; }
        .toggle.active { border-color: var(--accent); color: var(--accent); }
        .key-setter { background: #222; border: 1px solid #444; color: var(--accent); padding: 4px 6px; border-radius: 3px; cursor: pointer; min-width: 20px; text-align: center; font-weight: bold; }
        label { font-weight: bold; color: #555; text-transform: uppercase; font-size: 8px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="ui">
    <div class="input-group">
        <label>Audio Mode</label>
        <select id="audio-mode">
            <option value="1">1 File</option>
            <option value="2" selected>2 Files (Inst+Voc)</option>
            <option value="3">3 Files</option>
        </select>
    </div>
    <div class="input-group"><label>Inst</label><input type="file" id="inst-up"></div>
    <div class="input-group" id="voc-group"><label>Vocals</label><input type="file" id="voc-up"></div>
    <div class="input-group hidden" id="opp-group"><label>Opponent</label><input type="file" id="opp-up"></div>
    <div class="input-group"><label>Chart</label><input type="file" id="chart-up"></div>
    
    <div style="width: 1px; height: 20px; background: #333;"></div>
    <div class="input-group"><label>Binds</label>
        <div style="display: flex; gap: 3px;">
            <div class="key-setter" data-lane="0" id="bind-0">D</div>
            <div class="key-setter" data-lane="1" id="bind-1">F</div>
            <div class="key-setter" data-lane="2" id="bind-2">J</div>
            <div class="key-setter" data-lane="3" id="bind-3">K</div>
        </div>
    </div>
    <div style="width: 1px; height: 20px; background: #333;"></div>

    <div class="input-group"><label>Scroll Speed</label><input type="range" id="speed-slider" min="1" max="6" step="0.1" value="3.2"></div>
    <button id="scroll-toggle" class="toggle">UPSCROLL</button>
    <button id="bot-toggle" class="toggle">BOT: OFF</button>
    <button id="ghost-toggle" class="toggle">GHOST: OFF</button>
    <button id="reset-defaults" class="toggle" style="color:var(--error)">LOAD GUNS</button>
</div>

<div id="game-container">
    <div id="start-screen" class="screen-overlay">
        <button id="start-btn" class="btn-main" disabled>AWAITING ASSETS</button>
    </div>
    <canvas id="game"></canvas>
</div>

<script>
const ASSETS = {
    inst: "https://codehs.com/uploads/6a1397376b9e9e043c3a06c363d43aa4",
    voc: "https://codehs.com/uploads/036b51f0e018e8a9461289c5d1f948b3",
    chart: "https://codehs.com/uploads/2a7c94ee757ab992ca21bef7dd1ff91d",
    hs: "https://codehs.com/uploads/9a83a5f1ec0d6e55cab21c974f523a9a"
};

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('start-btn');
const speedSlider = document.getElementById('speed-slider');

canvas.width = 1280; canvas.height = 720;

let audioCtx, instBuf, playerBuf, oppBuf, hsBuf, chart;
let instS, playerS, oppS, playerG;
let startTime = 0, isPlaying = false, isDownscroll = false;
let isBotplay = false, ghostTapping = false, health = 1, activeNotes = [];
let combo = 0, comboBounce = 0, misses = 0, totalPlayed = 0, notesHit = 0;
let binds = ['d', 'f', 'j', 'k'], held = [false, false, false, false], listeningForLane = -1;
const colors = ['#FF4B2B', '#00D2FF', '#38EF7D', '#F9D423'];

document.querySelectorAll('.key-setter').forEach(btn => {
    btn.onclick = () => { listeningForLane = parseInt(btn.dataset.lane); btn.innerText = "..."; btn.classList.add('waiting'); };
});

async function getBuf(src) {
    if (!audioCtx) audioCtx = new AudioContext();
    const r = await (src instanceof File ? src.arrayBuffer() : fetch(src).then(x => x.arrayBuffer()));
    return await audioCtx.decodeAudioData(r);
}

getBuf(ASSETS.hs).then(b => hsBuf = b);

function parseChart(raw) {
    const data = raw.song || raw;
    chart = data;
    if (data.speed) speedSlider.value = data.speed;
    activeNotes = [];
    data.notes.forEach(s => {
        s.sectionNotes.forEach(n => {
            const isP = (n[1] < 4) ? s.mustHitSection : !s.mustHitSection;
            activeNotes.push({ time: n[0], lane: n[1] % 4, isPlayer: isP, hit: false, botHeld: 0 });
        });
    });
    startBtn.disabled = false; startBtn.innerText = "START SONG";
}

document.getElementById('reset-defaults').onclick = async () => {
    const [i, v, c] = await Promise.all([getBuf(ASSETS.inst), getBuf(ASSETS.voc), fetch(ASSETS.chart).then(r => r.json())]);
    instBuf = i; playerBuf = v; parseChart(c);
};

document.getElementById('inst-up').onchange = async (e) => { instBuf = await getBuf(e.target.files[0]); };
document.getElementById('voc-up').onchange = async (e) => { playerBuf = await getBuf(e.target.files[0]); };
document.getElementById('chart-up').onchange = async (e) => { parseChart(JSON.parse(await e.target.files[0].text())); };

function playHS() {
    if(!hsBuf) return;
    const s = audioCtx.createBufferSource(); s.buffer = hsBuf;
    const g = audioCtx.createGain(); g.gain.value = 0.8;
    s.connect(g); g.connect(audioCtx.destination); s.start(0);
}

function startSong() {
    if(audioCtx.state === 'suspended') audioCtx.resume();
    if(instS) { [instS, playerS, oppS].forEach(s => { if(s) try{s.stop()}catch(e){} }); }
    instS = audioCtx.createBufferSource(); instS.buffer = instBuf; instS.connect(audioCtx.destination);
    if (playerBuf) { playerS = audioCtx.createBufferSource(); playerS.buffer = playerBuf; playerG = audioCtx.createGain(); playerS.connect(playerG); playerG.connect(audioCtx.destination); }
    activeNotes.forEach(n => n.hit = false);
    health = 1; combo = 0; misses = 0; totalPlayed = 0; notesHit = 0;
    startTime = audioCtx.currentTime;
    [instS, playerS].forEach(s => { if(s) s.start(0); });
    isPlaying = true; document.getElementById('start-screen').classList.add('hidden');
    requestAnimationFrame(loop);
}

window.onkeydown = (e) => {
    const k = e.key.toLowerCase();
    if (listeningForLane !== -1) {
        binds[listeningForLane] = k; document.getElementById(`bind-${listeningForLane}`).innerText = k.toUpperCase();
        document.getElementById(`bind-${listeningForLane}`).classList.remove('waiting'); listeningForLane = -1; return;
    }
    if(!isPlaying || isBotplay) return;
    const lane = binds.indexOf(k);
    if(lane === -1 || held[lane]) return;
    held[lane] = true;
    const songTime = (audioCtx.currentTime - startTime) * 1000;
    
    // FORCED HIT CHECK: If ANY note is in lane and within window, kill it immediately.
    const note = activeNotes.find(n => !n.hit && n.isPlayer && n.lane === lane && Math.abs(n.time - songTime) < 180);
    
    if(note) { 
        note.hit = true;
        combo++; notesHit++; totalPlayed++;
        comboBounce = 15;
        health = Math.min(2, health + 0.045); 
        playHS(); 
    } 
    else if (!ghostTapping) { 
        health -= 0.06; combo = 0; misses++; totalPlayed++;
    }
};
window.onkeyup = (e) => { const l = binds.indexOf(e.key.toLowerCase()); if(l !== -1) held[l] = false; };

function loop() {
    if(!isPlaying) return;
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,canvas.width,canvas.height);
    const songTime = (audioCtx.currentTime - startTime) * 1000;
    const sY = isDownscroll ? 600 : 100;
    const speed = parseFloat(speedSlider.value);

    if(isBotplay) {
        activeNotes.forEach(n => { if(!n.hit && n.isPlayer && n.time <= songTime) { n.hit = true; n.botHeld = 8; combo++; notesHit++; totalPlayed++; comboBounce = 15; playHS(); } });
    }

    // Drawing Receptors
    for(let i=0; i<8; i++) {
        const isP = i >= 4; const lIdx = i%4;
        const hld = isP ? (isBotplay ? activeNotes.some(n=>n.lane===lIdx && n.botHeld>0) : held[lIdx]) : false;
        const x = (canvas.width/2) + (isP ? 100 : -520) + (lIdx * 110);
        ctx.strokeStyle = isP ? (hld ? colors[lIdx] : '#444') : '#222';
        ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(x+40, sY+40, 35, 0, Math.PI*2); ctx.stroke();
    }

    // Drawing Notes
    activeNotes.forEach(n => {
        if(n.hit) return; // SKIP IMMEDIATELY
        if(n.botHeld > 0) n.botHeld--;

        const x = (canvas.width/2) + (n.isPlayer ? 100 : -520) + (n.lane * 110);
        const diff = n.time - songTime;
        const y = isDownscroll ? sY - (diff * speed) : sY + (diff * speed);
        
        // Miss condition (Note passed the receptor)
        if(n.isPlayer && diff < -180) { n.hit = true; health -= 0.1; combo = 0; misses++; totalPlayed++; return; }
        if(!n.isPlayer && diff <= 0) { n.hit = true; return; } 
        
        // Final draw check
        if(y > -100 && y < 820) {
            ctx.fillStyle = n.isPlayer ? colors[n.lane] : '#333';
            ctx.beginPath(); ctx.arc(x+40, y+40, 35, 0, Math.PI*2); ctx.fill();
        }
    });

    // Combo Bounce
    if(combo > 0) {
        ctx.fillStyle = 'white';
        ctx.font = `bold ${42 + comboBounce}px Inter`;
        ctx.textAlign = 'center';
        ctx.fillText(combo, canvas.width/2, canvas.height/2 - (comboBounce * 2));
        if(comboBounce > 0) comboBounce *= 0.88;
    }

    // Info/Health Bar
    const healthY = isDownscroll ? 55 : 665;
    const barY = isDownscroll ? (healthY + 55) : (healthY - 35);
    let comboRank = (misses === 0 && notesHit > 0) ? "FC" : (misses < 10 ? "SDCB" : "Clear");
    const acc = totalPlayed === 0 ? "0.00" : ((notesHit / totalPlayed) * 100).toFixed(2);
    const timeLeft = Math.max(0, (instBuf ? instBuf.duration : 0) - (audioCtx.currentTime - startTime));
    const minutes = Math.floor(timeLeft / 60);
    const seconds = Math.floor(timeLeft % 60).toString().padStart(2, '0');

    ctx.fillStyle = '#222'; ctx.fillRect(canvas.width/2 - 300, healthY, 600, 16);
    ctx.fillStyle = health > 0.4 ? '#38EF7D' : '#ff4b2b';
    ctx.fillRect(canvas.width/2 - 300, healthY, 600 * (health/2), 16);

    ctx.fillStyle = 'white';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`Time: ${minutes}:${seconds} | Misses: ${misses} | Acc: ${acc}% | [${comboRank}]`, canvas.width/2, barY);
    
    if(health <= 0 || (instBuf && timeLeft <= 0)) startSong();
    requestAnimationFrame(loop);
}

startBtn.onclick = startSong;
document.getElementById('bot-toggle').onclick = (e) => { isBotplay = !isBotplay; e.target.classList.toggle('active'); e.target.innerText = `BOT: ${isBotplay?'ON':'OFF'}`; };
document.getElementById('ghost-toggle').onclick = (e) => { ghostTapping = !ghostTapping; e.target.classList.toggle('active'); e.target.innerText = `GHOST: ${ghostTapping?'ON':'OFF'}`; };
document.getElementById('scroll-toggle').onclick = (e) => { isDownscroll = !isDownscroll; e.target.classList.toggle('active'); e.target.innerText = isDownscroll ? "DOWNSCROLL" : "UPSCROLL"; };
</script>
</body>
</html>
