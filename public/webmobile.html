<!DOCTYPE html>
<html lang="en">
<head>
	<base href="https://cdn.jsdelivr.net/gh/bubbls/fnf-mods@main/remnants/">
	
	<meta charset="utf-8">
	<title>Friday Night Funkin'</title>
	
	<meta id="viewport" name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
	<meta name="mobile-web-app-capable" content="yes">
	
	<link rel="shortcut icon" type="image/png" href="./favicon.png">
	<script type="text/javascript" src="./Funkin.js"></script>

	<script>
		window.addEventListener("touchmove", function (event) {
			event.preventDefault();
		}, { passive: false });

		if (typeof window.devicePixelRatio != 'undefined' && window.devicePixelRatio > 2) {
			var meta = document.getElementById("viewport");
			meta.setAttribute('content', 'width=device-width, initial-scale=' + (2 / window.devicePixelRatio) + ', user-scalable=no');
		}

		window.addEventListener("keydown", function(e) {
			if (["Space","ArrowUp","ArrowDown","ArrowLeft","ArrowRight"].indexOf(e.code) > -1) {
				e.preventDefault();
			}
		}, false);
	</script>

	<style>
		html,body { margin:0; padding:0; height:100%; overflow:hidden; }
		#openfl-content { background:#000; width:100%; height:100%; }

		#mobileControls {
			position:fixed;
			inset:0;
			z-index:99999;
			pointer-events:none;
		}

		#mobileControls button {
			pointer-events:auto;
			position:fixed;
			width:80px;
			height:80px;
			border:none;
			border-radius:18px;
			background:rgba(80,80,80,.6);
			color:#fff;
			font-size:28px;
		}

		#leftBtn { left:20px; bottom:120px; }
		#downBtn { left:110px; bottom:120px; }
		#upBtn { left:200px; bottom:120px; }
		#rightBtn { left:290px; bottom:120px; }

		#okBtn { right:20px; bottom:120px; }
		#escBtn { right:20px; top:20px; }
	</style>
</head>

<body>

<noscript>Please enable JavaScript.</noscript>

<div id="openfl-content"></div>

<script>
	lime.embed("Funkin", "openfl-content", 1280, 720, { parameters: {} });
</script>

<!-- MOBILE CONTROLS -->
<div id="mobileControls">
	<button id="leftBtn">←</button>
	<button id="downBtn">↓</button>
	<button id="upBtn">↑</button>
	<button id="rightBtn">→</button>
	<button id="okBtn">OK</button>
	<button id="escBtn">ESC</button>
</div>

<script>
function pressKey(key) {
	// stronger multi-target dispatch (fixes Psych/OpenFL ignoring window-only events)
	const evt = new KeyboardEvent("keydown", {
		key,
		code: key,
		bubbles: true,
		cancelable: true,
	});

	document.dispatchEvent(evt);
	window.dispatchEvent(evt);
}

function releaseKey(key) {
	const evt = new KeyboardEvent("keyup", {
		key,
		code: key,
		bubbles: true,
		cancelable: true,
	});

	document.dispatchEvent(evt);
	window.dispatchEvent(evt);
}

function bind(id, key) {
	const b = document.getElementById(id);

	["touchstart","mousedown"].forEach(e => {
		b.addEventListener(e, (x) => {
			x.preventDefault();
			pressKey(key);
		});
	});

	["touchend","mouseup","touchcancel"].forEach(e => {
		b.addEventListener(e, (x) => {
			x.preventDefault();
			releaseKey(key);
		});
	});
}

bind("leftBtn","ArrowLeft");
bind("downBtn","ArrowDown");
bind("upBtn","ArrowUp");
bind("rightBtn","ArrowRight");
bind("escBtn","Escape");

// FIXED: OK BUTTON (THIS IS THE IMPORTANT PART)
document.getElementById("okBtn").addEventListener("click", (e) => {
	e.preventDefault();

	// try real accept input
	pressKey("Enter");

	// fallback safety trigger
	document.dispatchEvent(new KeyboardEvent("keydown", {
		key: "Enter",
		bubbles: true
	}));
});
</script>

</body>
</html>
