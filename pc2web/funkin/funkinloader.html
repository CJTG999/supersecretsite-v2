<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FNF Web Loader</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { margin: 0; background: #111; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; overflow: hidden; }
        #status { margin-bottom: 20px; font-size: 1.2rem; }
        #game-container { width: 960px; height: 720px; border: 2px solid #ff5e00; display: none; }
        iframe { width: 100%; height: 100%; border: none; }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #ff5e00; border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="loader-ui">
        <div class="loader"></div>
        <p id="status">Downloading FNF Web Port...</p>
    </div>

    <div id="game-container">
        <iframe id="game-frame"></iframe>
    </div>

    <script>
        const ZIP_URL = '/pc2web/funkin/FNF-Web-0.8.1.zip';
        const statusText = document.getElementById('status');
        const gameContainer = document.getElementById('game-container');
        const loaderUI = document.getElementById('loader-ui');
        const gameFrame = document.getElementById('game-frame');

        async function loadAndUnzip() {
            try {
                // 1. Fetch the ZIP file
                const response = await fetch(ZIP_URL);
                if (!response.ok) throw new Error("Failed to download ZIP file.");
                
                const arrayBuffer = await response.arrayBuffer();
                statusText.innerText = "Unzipping files...";

                // 2. Load the ZIP data
                const zip = await JSZip.loadAsync(arrayBuffer);
                
                // 3. Find the main HTML file (usually index.html)
                const indexFile = zip.file("index.html");
                if (!indexFile) throw new Error("Could not find index.html in the ZIP.");

                // 4. Extract index.html as a Blob
                const content = await indexFile.async("blob");
                const url = URL.createObjectURL(content);

                // 5. Load it into the iframe
                gameFrame.src = url;
                
                // Hide loader, show game
                loaderUI.style.display = 'none';
                gameContainer.style.display = 'block';
                statusText.innerText = "Ready!";

            } catch (error) {
                statusText.innerText = "Error: " + error.message;
                console.error(error);
            }
        }

        // Start the process
        loadAndUnzip();
    </script>
</body>
</html>
