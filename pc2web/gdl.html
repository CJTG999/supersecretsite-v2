<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Geometry Dash Lite</title>
  <link rel="icon" type="image/png" href="gdlogo.png">

  <style>
    /* --- CUSTOM CURSOR FIX --- */

    /* 1. Apply to the root and body */
    html, body {
        cursor: url('https://codehs.com/uploads/471381c796bfff3712cd05b64b44142a'), auto !important;
        min-height: 100vh;
    }

    /* 2. Apply to all interactive elements */
    /* We include 'a' tags, buttons, and tailwind-style pointer classes */
    a, 
    button, 
    input, 
    select, 
    textarea, 
    .cursor-pointer, 
    #keystroke-tester-container div,
    [role="button"] {
        cursor: url('https://codehs.com/uploads/83f80767e459872bcd2a56d8cc903e59'), pointer !important;
    }

    /* 3. Special fix for iframes/modals */
    #gameModal, .bg-gray-900-transparent {
        cursor: url('https://codehs.com/uploads/471381c796bfff3712cd05b64b44142a'), auto !important;
    }

    /*
      1. Remove all default margin and padding from the browser.
      2. Set height to 100% so the body fills the window.
      3. Hide any potential scrollbars.
    */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    /*
      1. Set the iframe to fill 100% of the viewport width (vw)
         and 100% of the viewport height (vh).
      2. Remove the default border.
    */
    #full-window-iframe {
      width: 100vw;
      height: 100vh;
      border: none;
    }
  </style>

</head>
<body>

  <iframe 
    id="full-window-iframe"
    src="https://geometrylitepc.io/geometry-dash-lite-pc.embed" 
    title="Full-Window Iframe Embed">
  </iframe>

</body>
</html>
