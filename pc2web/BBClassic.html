<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baldi's Web-Based Basics v1.4.3</title>
  <link rel="icon" href="https://codehs.com/uploads/9ac6357a7c4bb4f3591d2a4ea8565dec" type="image/jpeg">

  <style>
    /*
      1. Remove all default margin and padding from the browser.
      2. Set height to 100% so the body fills the window.
      3. Hide any potential scrollbars.
    */
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
    }

    /*
      1. Set the iframe to fill 100% of the viewport width (vw)
         and 100% of the viewport height (vh).
      2. Remove the default border.
    */
    #full-window-iframe {
      width: 100vw;
      height: 100vh;
      border: none;
    }
  </style>

</head>
<body>

  <iframe 
    id="full-window-iframe"
    src="https://funkypotato.com/gamez/baldis-basics/" 
    title="Full-Window Iframe Embed">
  </iframe>

</body>
</html>
