<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FNF Web Engine v3</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg: #050505;
            --panel: #111;
            --text: #eee;
            --accent: #38EF7D;
            --secondary: #00D2FF;
            --error: #ff4b2b;
            --sidebar-width: 320px;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'Inter', -apple-system, sans-serif;
            margin: 0;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }

        #sidebar {
            width: var(--sidebar-width);
            background: var(--panel);
            border-right: 1px solid #222;
            display: flex;
            flex-direction: column;
            padding: 20px;
            box-sizing: border-box;
            overflow-y: auto;
            z-index: 100;
        }

        .section-header {
            font-size: 10px;
            color: #555;
            text-transform: uppercase;
            font-weight: 800;
            margin: 20px 0 10px 0;
            border-bottom: 1px solid #222;
            padding-bottom: 4px;
        }

        .input-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        label { font-size: 11px; font-weight: bold; color: #999; display: flex; justify-content: space-between; }
        
        select, input, button.menu-btn {
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #333;
            padding: 10px;
            border-radius: 6px;
            font-size: 12px;
            cursor: pointer;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.2s;
        }

        button.menu-btn:hover { border-color: var(--accent); background: #222; }
        
        .keybind-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }
        .keybind-grid input {
            text-align: center;
            padding: 5px;
            text-transform: uppercase;
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 5px;
        }
        .color-grid input[type="color"] {
            padding: 2px;
            height: 30px;
            border: none;
            background: none;
        }

        #main-stage {
            flex-grow: 1;
            position: relative;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        canvas { width: 100%; height: 100%; object-fit: contain; background: #000; }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.85);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 50;
            transition: opacity 0.3s ease;
        }
        .overlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .btn-start {
            padding: 20px 60px;
            font-size: 24px;
            font-weight: 900;
            background: var(--accent);
            color: #000;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-start:hover:not(:disabled) { transform: scale(1.05); }
        .btn-start:disabled { background: #333; color: #666; cursor: not-allowed; }

        .hidden-ui { display: none !important; }

        #toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: var(--accent);
            color: #000;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: bold;
            transform: translateY(100px);
            transition: transform 0.3s;
            z-index: 1000;
        }
        #toast.show { transform: translateY(0); }
    </style>
</head>
<body>

<div id="sidebar">
    <h2 style="color: var(--accent); margin: 0 0 20px 0;">FNF WEB ENGINE</h2>

    <span class="section-header">Volumes</span>
    <div class="input-group">
        <label>Instrumental <span id="vol-inst-val">50%</span></label>
        <input type="range" id="vol-inst" min="0" max="1" step="0.05" value="0.5">
        
        <label>Vocals <span id="vol-voc-val">50%</span></label>
        <input type="range" id="vol-voc" min="0" max="1" step="0.05" value="0.5">
        
        <label>Hit Sounds <span id="vol-hit-val">35%</span></label>
        <input type="range" id="vol-hit" min="0" max="1" step="0.05" value="0.35">
    </div>

    <span class="section-header">Preset Manager</span>
    <div class="input-group">
        <label>Select Preset</label>
        <select id="preset-select">
            <option value="">-- Choose a Song --</option>
            <option value="guns">Guns (Week 7)</option>
        </select>
    </div>

    <span class="section-header">Manual Imports</span>
    <div class="input-group">
        <label>Upload ZIP (all files)</label>
        <input type="file" id="zip-up" accept=".zip">
    </div>
    <div class="input-group">
        <label>Instrumental</label>
        <input type="file" id="inst-up" accept="audio/*">
    </div>
    <div class="input-group">
        <label>Vocals</label>
        <input type="file" id="voc-up" accept="audio/*">
    </div>
    <div class="input-group">
        <label>Chart (.json)</label>
        <input type="file" id="chart-up" accept=".json">
    </div>

    <span class="section-header">Gameplay Settings</span>
    <div class="input-group">
        <label>Note Type</label>
        <select id="note-style-select">
            <option value="circle">Circles</option>
            <option value="square">Squares</option>
            <option value="triangle">Triangles</option>
            <option value="arrows" selected>Arrows</option>
        </select>
    </div>

    <div id="arrow-colors-ui" class="input-group">
        <label>Colors (L, D, U, R)</label>
        <div class="color-grid">
            <input type="color" id="color-0" value="#c24b99">
            <input type="color" id="color-1" value="#00ffff">
            <input type="color" id="color-2" value="#12fa05">
            <input type="color" id="color-3" value="#f9393f">
        </div>
    </div>

    <span class="section-header">Controls</span>
    <div class="input-group">
        <label>Keybinds</label>
        <div class="keybind-grid">
            <input type="text" id="key-0" value="D" maxlength="1">
            <input type="text" id="key-1" value="F" maxlength="1">
            <input type="text" id="key-2" value="J" maxlength="1">
            <input type="text" id="key-3" value="K" maxlength="1">
        </div>
    </div>

    <div class="input-group">
        <button id="scroll-toggle" class="menu-btn">DOWNSCROLL: ON</button>
        <button id="middle-toggle" class="menu-btn">MIDDLESCROLL: OFF</button>
        <button id="bot-toggle" class="menu-btn">BOTPLAY: OFF</button>
        <button id="hitsound-toggle" class="menu-btn">HIT SOUNDS: ON</button>
        <button id="ghost-toggle" class="menu-btn">GHOST TAPPING: ON</button>
    </div>
    
    <div class="input-group">
        <label>Scroll Speed: <span id="speed-val">1.5</span></label>
        <input type="range" id="speed-slider" min="1" max="5" step="0.1" value="1.5">
    </div>
</div>

<div id="main-stage">
    <div id="start-screen" class="overlay">
        <button id="start-btn" class="btn-start" disabled>AWAITING ASSETS</button>
        <p style="color: #888; margin-top: 15px; font-family: monospace;">[SPACE] Start • [R] Restart</p>
    </div>
    <canvas id="game"></canvas>
</div>

<div id="toast">Ready!</div>

<script>
/**
 * FNF WEB ENGINE - UPDATED HUD & ANIMATIONS
 */
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const startBtn = document.getElementById('start-btn');
const startScreen = document.getElementById('start-screen');

const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

// Volume Nodes
const instGain = audioCtx.createGain();
const vocGain = audioCtx.createGain();
const hitGain = audioCtx.createGain();
instGain.connect(audioCtx.destination);
vocGain.connect(audioCtx.destination);
hitGain.connect(audioCtx.destination);

const BUILT_IN_PRESETS = {
    guns: {
        name: "Guns (Week 7)",
        inst: "https://codehs.com/uploads/6a1397376b9e9e043c3a06c363d43aa4",
        voc: "https://codehs.com/uploads/036b51f0e018e8a9461289c5d1f948b3",
        chart: "https://codehs.com/uploads/2a7c94ee757ab992ca21bef7dd1ff91d"
    }
};

const HITSOUND_URL = "https://codehs.com/uploads/09743623372843dc76af5b7736be6680";
const ARROW_PNG_URL = "https://codehs.com/uploads/18203ab3287b8e13f9dbfa755b53691e";

let instBuf, vocBuf, hitSoundBuf, instSource, vocSource;
let isPlaying = false, startTime = 0, songTime = 0;
let notes = [], activeNotes = [];
let scrollSpeed = 2.5, isDownscroll = true, isBotplay = false, useHitSounds = true, ghostTapping = true, isMiddlescroll = false;
let health = 0.5, score = 0, combo = 0, totalMisses = 0;
let noteStyle = 'arrows';

// --- NEW HUD ANIMATION STATE ---
let comboUI = {
    rating: "",
    alpha: 0,
    scale: 1,
    yOffset: 0,
    isFC: true
};

// Texture Data
let arrowSheet = new Image();
let atlasData = {};
let tintCache = [null, null, null, null]; 
let receptorCache = [null, null, null, null]; 

// Key Tracking
let keys = ['d', 'f', 'j', 'k'];
let keyPressedState = [false, false, false, false];
let opponentPressedState = [false, false, false, false];
let colors = ['#c24b99', '#00ffff', '#12fa05', '#f9393f'];

canvas.width = 1280; canvas.height = 720;

function showToast(m) {
    const t = document.getElementById('toast');
    t.innerText = m; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2000);
}

function updateStartBtn() {
    if (instBuf && notes.length > 0) {
        startBtn.disabled = false;
        startBtn.innerText = "START SONG";
    }
}

async function decodeAudio(data) {
    let buffer = data;
    if (typeof data === 'string') buffer = await fetch(data).then(r => r.arrayBuffer());
    return await audioCtx.decodeAudioData(buffer);
}

async function initAssets() {
    try {
        hitSoundBuf = await decodeAudio(HITSOUND_URL);
        arrowSheet.src = ARROW_PNG_URL;
        await new Promise(r => arrowSheet.onload = r);

        atlasData = {
            LEFT:  { x: 156, y: 237, w: 154, h: 157 },
            DOWN:  { x: 479, y: 234, w: 157, h: 154 },
            UP:    { x: 637, y: 234, w: 157, h: 154 },
            RIGHT: { x: 311, y: 237, w: 154, h: 157 }
        };

        updateTintCache();
        startBtn.innerText = "AWAITING SONG SELECT";
        showToast("Engine Ready");
    } catch(e) { console.error(e); }
}

function updateTintCache() {
    const lanes = ["LEFT", "DOWN", "UP", "RIGHT"];
    lanes.forEach((name, i) => {
        const data = atlasData[name];
        [tintCache, receptorCache].forEach(cache => {
            const canvas = document.createElement('canvas');
            canvas.width = data.w; canvas.height = data.h;
            const tctx = canvas.getContext('2d');
            tctx.drawImage(arrowSheet, data.x, data.y, data.w, data.h, 0, 0, data.w, data.h);
            tctx.globalCompositeOperation = 'multiply';
            tctx.fillStyle = colors[i];
            tctx.fillRect(0, 0, data.w, data.h);
            tctx.globalCompositeOperation = 'destination-in';
            tctx.drawImage(arrowSheet, data.x, data.y, data.w, data.h, 0, 0, data.w, data.h);
            cache[i] = canvas;
        });
    });
}

function playHitSound() {
    if (!useHitSounds || !hitSoundBuf) return;
    const source = audioCtx.createBufferSource();
    source.buffer = hitSoundBuf;
    source.connect(hitGain);
    source.start(0);
}

// --- UPDATED RATING LOGIC ---
function triggerRating(diff) {
    let r = "SH!T";
    const absDiff = Math.abs(diff);
    if (absDiff < 45) r = "Sick";
    else if (absDiff < 90) r = "Good";
    else if (absDiff < 135) r = "Bad";
    
    comboUI.rating = r;
    comboUI.alpha = 1.0;
    comboUI.scale = 1.4; // Initial pop size
    comboUI.yOffset = 0; // Reset bounce
    comboUI.isFC = (totalMisses === 0);
}

function parseChart(json) {
    const data = json.song || json;
    notes = [];
    scrollSpeed = data.speed || 2.5;
    document.getElementById('speed-slider').value = scrollSpeed;
    document.getElementById('speed-val').innerText = scrollSpeed;

    const sections = data.notes || [];
    sections.forEach(section => {
        if (!section.sectionNotes) return;
        section.sectionNotes.forEach(n => {
            notes.push({
                time: n[0],
                lane: n[1] % 4,
                isPlayer: n[1] < 4 ? section.mustHitSection : !section.mustHitSection,
                hit: false, missed: false
            });
        });
    });
    notes.sort((a,b) => a.time - b.time);
    updateStartBtn();
}

function drawReceptor(ctx, x, y, size, lane, style, isPressed) {
    const cx = x + size/2;
    const cy = y + size/2;
    const r = size * 0.45;

    if (style === 'arrows' && receptorCache[lane]) {
        const sprite = receptorCache[lane];
        const scale = size / sprite.width;
        ctx.globalAlpha = isPressed ? 1.0 : 0.4;
        if (!isPressed) ctx.filter = 'grayscale(100%)';
        ctx.drawImage(sprite, x, y, sprite.width * scale, sprite.height * scale);
        ctx.filter = 'none'; ctx.globalAlpha = 1.0;
        return;
    }

    if (isPressed) {
        ctx.shadowBlur = 20;
        ctx.shadowColor = colors[lane];
    } else {
        ctx.shadowBlur = 0;
    }

    ctx.strokeStyle = isPressed ? colors[lane] : '#222';
    ctx.lineWidth = 4;
    ctx.fillStyle = isPressed ? colors[lane] + '44' : 'transparent';

    switch(style) {
        case 'circle':
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.stroke();
            if (isPressed) ctx.fill();
            break;
        case 'square':
            const rs = size * 0.8;
            ctx.strokeRect(cx - rs/2, cy - rs/2, rs, rs);
            if (isPressed) ctx.fillRect(cx - rs/2, cy - rs/2, rs, rs);
            break;
        case 'triangle':
            ctx.beginPath();
            const angle = [Math.PI, Math.PI/2, -Math.PI/2, 0][lane];
            for(let i=0; i<3; i++) {
                const a = angle + (i * 2 * Math.PI / 3);
                ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
            }
            ctx.closePath(); ctx.stroke();
            if (isPressed) ctx.fill();
            break;
    }
    ctx.shadowBlur = 0;
}

function drawNote(ctx, x, y, size, lane, style, isPlayer) {
    const cx = x + size/2;
    const cy = y + size/2;
    const r = size * 0.45;

    if (style === 'arrows' && tintCache[lane]) {
        const sprite = tintCache[lane];
        const scale = size / sprite.width;
        if (!isPlayer) ctx.filter = 'grayscale(100%) brightness(50%)';
        ctx.drawImage(sprite, x, y, sprite.width * scale, sprite.height * scale);
        ctx.filter = 'none';
        return;
    }

    ctx.fillStyle = isPlayer ? colors[lane] : '#444';
    switch(style) {
        case 'circle':
            ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI*2); ctx.fill();
            break;
        case 'square':
            const rs = size * 0.8;
            ctx.fillRect(cx - rs/2, cy - rs/2, rs, rs);
            break;
        case 'triangle':
            ctx.beginPath();
            const angle = [Math.PI, Math.PI/2, -Math.PI/2, 0][lane];
            for(let i=0; i<3; i++) {
                const a = angle + (i * 2 * Math.PI / 3);
                ctx.lineTo(cx + r * Math.cos(a), cy + r * Math.sin(a));
            }
            ctx.closePath(); ctx.fill();
            break;
    }
}

// Volume Controls
['inst', 'voc', 'hit'].forEach(v => {
    const input = document.getElementById(`vol-${v}`);
    const display = document.getElementById(`vol-${v}-val`);
    input.oninput = () => {
        const val = parseFloat(input.value);
        display.innerText = Math.round(val * 100) + '%';
        if (v === 'inst') instGain.gain.setTargetAtTime(val, audioCtx.currentTime, 0.05);
        if (v === 'voc') vocGain.gain.setTargetAtTime(val, audioCtx.currentTime, 0.05);
        if (v === 'hit') hitGain.gain.setTargetAtTime(val, audioCtx.currentTime, 0.05);
    };
    input.dispatchEvent(new Event('input'));
});

// Manual Imports
document.getElementById('inst-up').onchange = async (e) => {
    if (!e.target.files[0]) return;
    showToast("Decoding Instrumental...");
    instBuf = await decodeAudio(await e.target.files[0].arrayBuffer());
    updateStartBtn();
    showToast("Inst Loaded");
};

document.getElementById('voc-up').onchange = async (e) => {
    if (!e.target.files[0]) return;
    showToast("Decoding Vocals...");
    vocBuf = await decodeAudio(await e.target.files[0].arrayBuffer());
    showToast("Vocals Loaded");
};

document.getElementById('chart-up').onchange = (e) => {
    if (!e.target.files[0]) return;
    const reader = new FileReader();
    reader.onload = (ev) => {
        try {
            parseChart(JSON.parse(ev.target.result));
            showToast("Chart Loaded");
        } catch(err) { showToast("Invalid Chart JSON"); }
    };
    reader.readAsText(e.target.files[0]);
};

document.getElementById('zip-up').onchange = async (e) => {
    if (!e.target.files[0]) return;
    showToast("Reading ZIP...");
    try {
        const zip = await JSZip.loadAsync(e.target.files[0]);
        let i, v, c;
        for (let name in zip.files) {
            const l = name.toLowerCase();
            if (l.includes('inst')) i = zip.files[name];
            else if (l.includes('voc')) v = zip.files[name];
            else if (l.endsWith('.json')) c = zip.files[name];
        }
        if (i) instBuf = await decodeAudio(await i.async("arraybuffer"));
        if (v) vocBuf = await decodeAudio(await v.async("arraybuffer"));
        if (c) parseChart(JSON.parse(await c.async("string")));
        showToast("ZIP Assets Extracted");
    } catch(err) { showToast("Error reading ZIP"); }
};

// UI Handlers
document.getElementById('note-style-select').onchange = (e) => {
    noteStyle = e.target.value;
    document.getElementById('arrow-colors-ui').classList.toggle('hidden-ui', noteStyle !== 'arrows');
};

[0,1,2,3].forEach(i => {
    document.getElementById(`color-${i}`).onchange = (e) => {
        colors[i] = e.target.value;
        updateTintCache();
    };
    const keyInp = document.getElementById(`key-${i}`);
    keyInp.oninput = () => { if (keyInp.value) keys[i] = keyInp.value.toLowerCase(); };
});

document.getElementById('preset-select').onchange = async (e) => {
    const val = e.target.value;
    if (!val) return;
    showToast("Loading Preset...");
    const p = BUILT_IN_PRESETS[val];
    instBuf = await decodeAudio(p.inst);
    vocBuf = p.voc ? await decodeAudio(p.voc) : null;
    parseChart(await fetch(p.chart).then(r => r.json()));
    showToast("Preset Ready");
};

// Game Management
async function start() {
    if (!instBuf) return;
    if (audioCtx.state === 'suspended') await audioCtx.resume();
    isPlaying = true; health = 0.5; score = 0; combo = 0; totalMisses = 0;
    activeNotes = notes.map(n => ({...n, hit: false, missed: false}));
    
    instSource = audioCtx.createBufferSource(); instSource.buffer = instBuf;
    instSource.connect(instGain);
    if (vocBuf) {
        vocSource = audioCtx.createBufferSource(); vocSource.buffer = vocBuf;
        vocSource.connect(vocGain);
    }

    startTime = audioCtx.currentTime;
    instSource.start(0); if (vocSource) vocSource.start(0);
    startScreen.classList.add('hidden');
    requestAnimationFrame(loop);
}

function stop() {
    isPlaying = false;
    try { if(instSource) instSource.stop(); if(vocSource) vocSource.stop(); } catch(e){}
    startScreen.classList.remove('hidden');
}

function loop() {
    if (!isPlaying) return;
    songTime = (audioCtx.currentTime - startTime) * 1000;
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,canvas.width,canvas.height);

    const sY = isDownscroll ? 600 : 100;
    const playerX = isMiddlescroll ? 465 : 740;
    const opponentX = 140;

    opponentPressedState = [false, false, false, false];

    activeNotes.forEach(n => {
        if (n.hit || n.missed) return;
        const diff = n.time - songTime;
        const y = isDownscroll ? sY - (diff * scrollSpeed) : sY + (diff * scrollSpeed);
        
        if (diff < -150) { 
            n.missed = true; 
            if (n.isPlayer) { 
                health -= 0.08; 
                combo = 0; 
                totalMisses++; 
            } 
        }
        if (y < -100 || y > 820) return;

        if (isBotplay && n.isPlayer && diff <= 0) { 
            n.hit = true; 
            playHitSound(); 
            combo++; 
            triggerRating(0); 
        }
        if (!n.isPlayer && diff <= 0) { n.hit = true; opponentPressedState[n.lane] = true; }
        if (!n.isPlayer && isMiddlescroll) return;

        drawNote(ctx, (n.isPlayer ? playerX : opponentX) + (n.lane * 110), y, 100, n.lane, noteStyle, n.isPlayer);
    });

    for (let i=0; i<8; i++) {
        const lane = i % 4;
        const isPlayer = i >= 4;
        if (!isPlayer && isMiddlescroll) continue;
        const x = (isPlayer ? playerX : opponentX) + (lane * 110);
        const pressed = isPlayer ? keyPressedState[lane] : opponentPressedState[lane];
        drawReceptor(ctx, x, sY, 100, lane, noteStyle, pressed);
    }

    // --- NEW RATING & COMBO HUD RENDERING ---
    ctx.save();
    const uiX = canvas.width / 2;
    const uiY = canvas.height / 2 - 50;
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";

    // 1. Permanent Combo Number (Visible as long as combo > 0)
    if (combo > 0) {
        ctx.fillStyle = comboUI.isFC ? "#FFD700" : "white";
        ctx.font = "bold 35px Inter";
        ctx.fillText(combo, uiX, uiY + 50);
        
        ctx.font = "bold 12px Inter";
        ctx.fillStyle = "rgba(255,255,255,0.6)";
        ctx.fillText("COMBO", uiX, uiY + 75);
    }

    // 2. Animated Rating Text (Sick, Good, etc.)
    if (comboUI.alpha > 0) {
        ctx.globalAlpha = comboUI.alpha;
        
        // Bounce Logic: Move up and shrink over time
        comboUI.yOffset -= 1.5; 
        if (comboUI.scale > 1.0) comboUI.scale -= 0.05;
        
        // Fade Logic
        comboUI.alpha -= 0.018; 

        ctx.fillStyle = "white";
        ctx.font = `italic bold ${45 * comboUI.scale}px Inter`;
        
        // Draw rating with bounce offset
        ctx.fillText(comboUI.rating.toUpperCase(), uiX, uiY + comboUI.yOffset);
    }
    ctx.restore();

    // Progress Bar
    ctx.fillStyle = '#111'; ctx.fillRect(340, 680, 600, 15);
    ctx.fillStyle = '#38EF7D'; ctx.fillRect(340 + (600 * (1-health)), 680, 600 * health, 15);
    
    if (health <= 0) stop();
    requestAnimationFrame(loop);
}

window.onkeydown = (e) => {
    if (document.activeElement.tagName === 'INPUT') return;
    const k = e.key.toLowerCase();
    if (k === ' ') { e.preventDefault(); isPlaying ? stop() : start(); return; }
    if (k === 'r') { stop(); start(); return; }
    const lane = keys.indexOf(k);
    if (lane !== -1) {
        keyPressedState[lane] = true;
        if (isPlaying && !isBotplay) {
            const note = activeNotes.find(n => n.isPlayer && !n.hit && n.lane === lane && Math.abs(n.time - songTime) < 160);
            if (note) { 
                const diff = note.time - songTime;
                note.hit = true; 
                health = Math.min(1, health + 0.02); 
                score += 100; 
                combo++; 
                playHitSound();
                triggerRating(diff);
            }
            else if (!ghostTapping) { 
                health -= 0.04; 
                combo = 0; 
                totalMisses++;
            }
        }
    }
};

window.onkeyup = (e) => {
    const lane = keys.indexOf(e.key.toLowerCase());
    if (lane !== -1) keyPressedState[lane] = false;
};

document.getElementById('scroll-toggle').onclick = (e) => { isDownscroll = !isDownscroll; e.target.innerText = `DOWNSCROLL: ${isDownscroll ? 'ON' : 'OFF'}`; };
document.getElementById('middle-toggle').onclick = (e) => { isMiddlescroll = !isMiddlescroll; e.target.innerText = `MIDDLESCROLL: ${isMiddlescroll ? 'ON' : 'OFF'}`; };
document.getElementById('bot-toggle').onclick = (e) => { isBotplay = !isBotplay; e.target.innerText = `BOTPLAY: ${isBotplay ? 'ON' : 'OFF'}`; };
document.getElementById('hitsound-toggle').onclick = (e) => { useHitSounds = !useHitSounds; e.target.innerText = `HIT SOUNDS: ${useHitSounds ? 'ON' : 'OFF'}`; };
document.getElementById('speed-slider').oninput = (e) => { scrollSpeed = parseFloat(e.target.value); document.getElementById('speed-val').innerText = scrollSpeed; };

startBtn.onclick = start;
initAssets();
</script>
</body>
</html>
