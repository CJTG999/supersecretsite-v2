<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>FNFME</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        :root {
            --bg: #000;
            --panel: #111;
            --accent: #38EF7D;
            --error: #ff4b2b;
            --safe-top: env(safe-area-inset-top);
            --safe-bottom: env(safe-area-inset-bottom);
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; outline: none; }

        body {
            background: var(--bg);
            color: #eee;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            touch-action: none;
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            background: #000;
        }

        canvas {
            width: 100%;
            height: 100%;
            display: block;
        }

        #start-menu {
            position: fixed;
            inset: 0;
            background: linear-gradient(135deg, #111 0%, #000 100%);
            z-index: 2000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
            overflow-y: auto;
        }

        #start-menu.hidden { display: none; }

        .logo-area {
            margin-bottom: 20px;
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .title-text { font-size: 38px; font-weight: 900; color: var(--accent); margin: 0; }

        .menu-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
            max-width: 340px;
        }

        .upload-card {
            background: #1a1a1a;
            border: 1px dashed #444;
            padding: 12px;
            border-radius: 12px;
            text-align: left;
        }

        .upload-card span { font-size: 11px; color: #888; display: block; margin-bottom: 6px; font-weight: bold; }

        #menu-modal {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.98);
            z-index: 2500;
            display: flex;
            flex-direction: column;
            padding: calc(20px + var(--safe-top)) 20px calc(20px + var(--safe-bottom)) 20px;
            overflow-y: auto;
            transition: transform 0.4s cubic-bezier(0.19, 1, 0.22, 1);
        }

        #menu-modal.hidden { transform: translateY(100%); }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .section { margin-bottom: 25px; }
        .section-label { 
            display: block; 
            font-size: 11px; 
            color: #555; 
            text-transform: uppercase; 
            margin-bottom: 10px;
            border-bottom: 1px solid #222;
        }

        .btn {
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 14px;
            border-radius: 12px;
            text-align: center;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .btn:active { transform: scale(0.98); background: #222; }
        .btn.active { border-color: var(--accent); color: var(--accent); }
        .btn.primary { background: var(--accent); color: #000; border: none; font-size: 18px; }
        .btn.outline { background: transparent; border: 2px solid #333; }
        .btn.danger { border-color: var(--error); color: var(--error); }

        input[type="range"], select {
            width: 100%;
            background: #1a1a1a;
            color: #fff;
            border: 1px solid #333;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 10px;
            font-size: 14px;
        }

        #top-bar {
            position: absolute;
            top: var(--safe-top);
            left: 0;
            right: 0;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            z-index: 100;
            pointer-events: none;
        }

        .game-icon {
            background: rgba(0,0,0,0.5);
            width: 44px;
            height: 44px;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: auto;
            font-size: 20px;
        }

        #toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            background: var(--accent);
            color: #000;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 3000;
            pointer-events: none;
            white-space: nowrap;
        }
        #toast.show { opacity: 1; }

        .hidden-input { display: none; }
    </style>
</head>
<body>

<div id="game-container">
    <!-- Start Menu -->
    <div id="start-menu">
        <div class="logo-area">
            <h1 class="title-text">FNF Mobile</h1>
            <div style="color:#666; letter-spacing: 2px; font-size: 12px;">ENGINE v3.0</div>
        </div>

        <div class="menu-options">
            <button id="play-btn" class="btn primary">START GAME</button>
            
            <div class="section" style="margin: 0; text-align: left;">
                <span class="section-label">SONG LIBRARY (PERSISTENT)</span>
                <select id="library-select">
                    <option value="guns">Guns (Week 7) - Built-in</option>
                </select>
            </div>

            <div class="upload-card">
                <span>ADD SONGS (ZIP / LOOSE / JSON BUNDLE)</span>
                <input type="file" id="file-uploader" accept=".zip,.json,.mp3,.ogg" multiple style="font-size: 10px; width: 100%;">
                <div style="font-size: 9px; color: #555; margin-top: 5px;">Charts and Audio stay saved on your device!</div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <button class="btn outline" id="export-library-btn" style="padding: 10px; font-size: 11px;">EXPORT BUNDLE</button>
                <button class="btn outline" id="clear-library-btn" style="padding: 10px; font-size: 11px; color: var(--error);">CLEAR ALL</button>
            </div>

            <button class="btn outline" id="open-settings-btn">SETTINGS</button>
        </div>
    </div>

    <!-- HUD Icons -->
    <div id="top-bar">
        <div class="game-icon" id="pause-game-btn">⚙️</div>
        <div class="game-icon" onclick="resetGame()">🔄</div>
    </div>

    <canvas id="game"></canvas>

    <!-- Settings/Pause Modal -->
    <div id="menu-modal" class="hidden">
        <div class="modal-header">
            <h2 style="margin:0; color:var(--accent);">Pause Menu</h2>
        </div>

        <div class="section">
            <button class="btn primary" id="resume-game-btn" style="width: 100%; margin-bottom: 20px;">RESUME GAME</button>
            
            <span class="section-label">Gameplay</span>
            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 15px;">
                <button id="bot-toggle" class="btn">BOT: OFF</button>
                <button id="ghost-toggle" class="btn">GHOST: OFF</button>
            </div>
            <label style="font-size: 11px; color:#666;">SCROLL SPEED</label>
            <input type="range" id="speed-slider" min="1" max="6" step="0.1" value="3.2">
        </div>

        <div class="section">
            <span class="section-label">Audio</span>
            <label style="font-size: 11px; color:#666;">MASTER VOLUME</label>
            <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8">
        </div>

        <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
            <button id="exit-to-menu-btn" class="btn danger" style="width: 100%;">QUIT TO MENU</button>
        </div>
    </div>
</div>

<div id="toast">Ready!</div>

<script>
/** * FNF Mobile Engine v3.0
 * Persistent Storage (IndexedDB), Exportable JSON Bundles (Base64), and Engine Optimization
 */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const startMenu = document.getElementById('start-menu');
const settingsModal = document.getElementById('menu-modal');
const toast = document.getElementById('toast');
const librarySelect = document.getElementById('library-select');

// Global Game State
let audioCtx, instBuf, playerBuf, hsBuf, chartData;
let instS, playerS, masterGain;
let startTime = 0, pauseTimeOffset = 0, isPlaying = false;
let isBotplay = false, ghostTapping = false, health = 1;
let activeNotes = [];
let combo = 0, misses = 0, lastRating = "", popAlpha = 0;
let touchHeld = [false, false, false, false];
const colors = ['#FF4B2B', '#00D2FF', '#38EF7D', '#F9D423'];

// Built-in Song (Not in DB)
const BUILT_IN_SONGS = {
    'guns': {
        name: "Guns (Week 7)",
        inst: "https://codehs.com/uploads/6a1397376b9e9e043c3a06c363d43aa4",
        voc: "https://codehs.com/uploads/036b51f0e018e8a9461289c5d1f948b3",
        chart: "https://codehs.com/uploads/2a7c94ee757ab992ca21bef7dd1ff91d"
    }
};

const HS_URL = "https://codehs.com/uploads/9a83a5f1ec0d6e55cab21c974f523a9a";
const keyMap = { 'd': 0, 'ArrowLeft': 0, 'f': 1, 'ArrowDown': 1, 'j': 2, 'ArrowUp': 2, 'k': 3, 'ArrowRight': 3 };

// --- Storage Logic (IndexedDB) ---
let db;
const request = indexedDB.open("FNF_Library", 1);
request.onupgradeneeded = (e) => {
    db = e.target.result;
    if (!db.objectStoreNames.contains("songs")) {
        db.createObjectStore("songs", { keyPath: "id" });
    }
};
request.onsuccess = (e) => {
    db = e.target.result;
    refreshLibraryUI();
};

async function saveSongToDB(songData) {
    return new Promise((resolve) => {
        const tx = db.transaction("songs", "readwrite");
        const store = tx.objectStore("songs");
        store.put(songData);
        tx.oncomplete = () => {
            refreshLibraryUI();
            resolve();
        };
    });
}

async function getAllSongsFromDB() {
    return new Promise((resolve) => {
        const tx = db.transaction("songs", "readonly");
        const store = tx.objectStore("songs");
        const request = store.getAll();
        request.onsuccess = () => resolve(request.result);
    });
}

async function clearLibrary() {
    return new Promise((resolve) => {
        const tx = db.transaction("songs", "readwrite");
        tx.objectStore("songs").clear();
        tx.oncomplete = () => {
            refreshLibraryUI();
            resolve();
        };
    });
}

async function refreshLibraryUI() {
    // Keep Guns as first option
    librarySelect.innerHTML = `<option value="guns">Guns (Week 7) - Built-in</option>`;
    const savedSongs = await getAllSongsFromDB();
    savedSongs.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.textContent = s.name;
        librarySelect.appendChild(opt);
    });
}

// --- Utility Helpers ---
function showToast(msg) { 
    toast.innerText = msg; toast.classList.add('show'); 
    setTimeout(() => toast.classList.remove('show'), 2000); 
}

async function blobToBase64(blob) {
    if (!blob) return null;
    return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onloadend = () => resolve(reader.result);
        reader.readAsDataURL(blob);
    });
}

async function base64ToBlob(base64) {
    if (!base64) return null;
    const r = await fetch(base64);
    return await r.blob();
}

// Audio Helpers
async function getBuf(src) {
    if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        masterGain = audioCtx.createGain();
        masterGain.connect(audioCtx.destination);
    }
    const r = await (src instanceof Blob ? src.arrayBuffer() : fetch(src).then(x => x.arrayBuffer()));
    return await audioCtx.decodeAudioData(r);
}

function parseChart(raw) {
    const data = raw.song || raw;
    chartData = raw;
    activeNotes = [];
    data.notes.forEach(s => {
        s.sectionNotes.forEach(n => {
            const isP = (n[1] < 4) ? s.mustHitSection : !s.mustHitSection;
            activeNotes.push({ 
                time: n[0], lane: n[1] % 4, isPlayer: isP, len: n[2] || 0,
                hit: false, held: false, fullyHit: false
            });
        });
    });
}

// --- Interaction Logic ---
const handleInput = (lane, isDown) => {
    if (!isPlaying || isBotplay) return;
    if (isDown) {
        if (touchHeld[lane]) return;
        touchHeld[lane] = true;
        const songTime = (audioCtx.currentTime - startTime + pauseTimeOffset) * 1000;
        const note = activeNotes.find(n => n.isPlayer && !n.hit && n.lane === lane && Math.abs(n.time - songTime) < 160);
        if (note) {
            note.hit = true; note.held = true; combo++;
            health = Math.min(2, health + 0.04);
            const s = audioCtx.createBufferSource(); s.buffer = hsBuf; s.connect(masterGain); s.start(0);
            const diff = Math.abs(note.time - songTime);
            if(diff < 45) { lastRating = "SICK!"; popAlpha = 1; }
            else if(diff < 90) { lastRating = "GOOD"; popAlpha = 1; }
            else { lastRating = "BAD"; popAlpha = 1; }
        } else if (!ghostTapping) {
            health -= 0.06; combo = 0; misses++; lastRating = "MISS"; popAlpha = 1;
        }
    } else {
        touchHeld[lane] = false;
        activeNotes.forEach(n => { if(n.lane === lane && n.held) n.held = false; });
    }
};

window.addEventListener('keydown', e => { if(keyMap[e.key] !== undefined) handleInput(keyMap[e.key], true); });
window.addEventListener('keyup', e => { if(keyMap[e.key] !== undefined) handleInput(keyMap[e.key], false); });
canvas.addEventListener('touchstart', e => { e.preventDefault(); for(let t of e.changedTouches) handleInput(Math.floor((t.clientX / window.innerWidth) * 4), true); });
canvas.addEventListener('touchend', e => { for(let t of e.changedTouches) handleInput(Math.floor((t.clientX / window.innerWidth) * 4), false); });

// Settings / Navigation
function pauseGame() {
    if (!isPlaying) return;
    isPlaying = false;
    pauseTimeOffset += (audioCtx.currentTime - startTime);
    if(instS) { try { instS.stop(); playerS.stop(); } catch(e){} }
    settingsModal.classList.remove('hidden');
}

function resumeGame() {
    if (isPlaying) return;
    settingsModal.classList.add('hidden');
    instS = audioCtx.createBufferSource(); instS.buffer = instBuf; instS.connect(masterGain);
    if(playerBuf) { playerS = audioCtx.createBufferSource(); playerS.buffer = playerBuf; playerS.connect(masterGain); }
    startTime = audioCtx.currentTime;
    instS.start(0, pauseTimeOffset);
    if(playerS) playerS.start(0, pauseTimeOffset);
    isPlaying = true;
    requestAnimationFrame(loop);
}

document.getElementById('pause-game-btn').onclick = pauseGame;
document.getElementById('resume-game-btn').onclick = resumeGame;
document.getElementById('open-settings-btn').onclick = () => { settingsModal.classList.remove('hidden'); document.getElementById('resume-game-btn').style.display = 'none'; };
document.getElementById('exit-to-menu-btn').onclick = () => { isPlaying = false; pauseTimeOffset = 0; if(instS) { try { instS.stop(); playerS.stop(); } catch(e){} } settingsModal.classList.add('hidden'); startMenu.classList.remove('hidden'); };
document.getElementById('bot-toggle').onclick = (e) => { isBotplay = !isBotplay; e.target.classList.toggle('active'); e.target.innerText = `BOT: ${isBotplay?'ON':'OFF'}`; };
document.getElementById('ghost-toggle').onclick = (e) => { ghostTapping = !ghostTapping; e.target.classList.toggle('active'); e.target.innerText = `GHOST: ${ghostTapping?'ON':'OFF'}`; };
document.getElementById('clear-library-btn').onclick = () => { if(confirm("Delete all saved songs?")) clearLibrary(); };

// --- Advanced Bundle Export/Import ---
document.getElementById('export-library-btn').onclick = async () => {
    const songs = await getAllSongsFromDB();
    if (songs.length === 0) { showToast("Library is empty!"); return; }
    showToast("Preparing Bundle...");
    
    // Convert blobs to base64 for the JSON export
    const exportData = await Promise.all(songs.map(async s => {
        return {
            ...s,
            inst: await blobToBase64(s.inst),
            voc: await blobToBase64(s.voc)
        };
    }));

    const blob = new Blob([JSON.stringify(exportData)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `fnf_mobile_bundle_${Date.now()}.json`;
    a.click();
    showToast("Exported!");
};

// --- File Handling (Main Logic) ---
document.getElementById('file-uploader').onchange = async (e) => {
    const files = Array.from(e.target.files);
    if (!files.length) return;

    showToast("Reading Files...");

    // Check if it's a JSON Bundle
    if (files.length === 1 && files[0].name.endsWith('.json')) {
        const text = await files[0].text();
        try {
            const data = JSON.parse(text);
            if (Array.isArray(data) && data[0].chart) {
                showToast("Importing Bundle...");
                for (const s of data) {
                    await saveSongToDB({
                        id: s.id || 'imp-' + Math.random(),
                        name: s.name,
                        chart: s.chart,
                        inst: await base64ToBlob(s.inst),
                        voc: await base64ToBlob(s.voc)
                    });
                }
                showToast("Bundle Imported!");
                return;
            }
        } catch(err) {}
    }

    // Normal processing (Loose/ZIP)
    let fInst, fVoc, fChart, songName = "Custom Song";
    for(const file of files) {
        const name = file.name.toLowerCase();
        if (name.endsWith('.zip')) {
            const zip = await JSZip.loadAsync(file);
            const zipTasks = [];
            zip.forEach((path, entry) => {
                if(!entry.dir) {
                    const eName = entry.name.toLowerCase();
                    zipTasks.push(entry.async("blob").then(blob => {
                        if (eName.includes("inst")) fInst = blob;
                        else if (eName.includes("vocals") || eName.includes("voices")) fVoc = blob;
                        else if (eName.endsWith(".json")) fChart = blob;
                    }));
                }
            });
            await Promise.all(zipTasks);
            songName = file.name.replace('.zip', '');
        } else if (name.endsWith('.json')) {
            fChart = file;
            songName = file.name.replace('.json', '');
        } else if (name.includes('inst')) {
            fInst = file;
        } else if (name.includes('vocals') || name.includes('voices')) {
            fVoc = file;
        }
    }

    if (fChart) {
        const chartObj = JSON.parse(await (new Response(fChart)).text());
        const id = 'song-' + Date.now();
        await saveSongToDB({
            id: id,
            name: songName + " (Saved)",
            inst: fInst || null,
            voc: fVoc || null,
            chart: chartObj
        });
        showToast("Saved to Memory!");
        librarySelect.value = id;
        selectFromLibrary(id);
    } else {
        showToast("Error: Missing .json chart");
    }
};

async function selectFromLibrary(id) {
    if (id === 'guns') {
        const s = BUILT_IN_SONGS.guns;
        showToast("Loading Built-in...");
        const chart = await fetch(s.chart).then(r => r.json());
        parseChart(chart);
        instBuf = await getBuf(s.inst);
        playerBuf = await getBuf(s.voc);
        showToast("Ready!");
        return;
    }

    const tx = db.transaction("songs", "readonly");
    const store = tx.objectStore("songs");
    const s = await new Promise(r => {
        const req = store.get(id);
        req.onsuccess = () => r(req.result);
    });

    if (!s) return;
    showToast("Loading " + s.name + "...");
    parseChart(s.chart);
    if (s.inst) instBuf = await getBuf(s.inst);
    if (s.voc) playerBuf = await getBuf(s.voc);
    showToast("Ready!");
}
librarySelect.onchange = e => selectFromLibrary(e.target.value);

// --- Game Engine Core ---
function resize() { canvas.width = window.innerWidth * window.devicePixelRatio; canvas.height = window.innerHeight * window.devicePixelRatio; }
window.addEventListener('resize', resize);
resize();

function getLayout() {
    const w = canvas.width, h = canvas.height;
    const isP = h > w;
    return isP ? {
        ratingX: w/2, ratingY: h*0.25, comboX: w/2, comboY: h*0.25+50, opponentY: 100, oppXStart: w/2-220, playerY: h-220, playXStart: w/2-220, laneWidth: 110, hbX: w/2-200, hbY: h-70, hbW: 400
    } : {
        ratingX: w-250, ratingY: 100, comboX: w-250, comboY: 150, opponentY: 80, oppXStart: 40, playerY: h-180, playXStart: w/2-220, laneWidth: 110, hbX: w/2-200, hbY: 40, hbW: 400
    };
}

function startSong() {
    if(!instBuf || !chartData) { showToast("Select a song first!"); return; }
    if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
    if(instS) { try { instS.stop(); playerS.stop(); } catch(e){} }
    instS = audioCtx.createBufferSource(); instS.buffer = instBuf; instS.connect(masterGain);
    if(playerBuf) { playerS = audioCtx.createBufferSource(); playerS.buffer = playerBuf; playerS.connect(masterGain); }
    activeNotes.forEach(n => { n.hit = false; n.held = false; n.fullyHit = false; });
    health = 1; combo = 0; misses = 0; popAlpha = 0; pauseTimeOffset = 0;
    startTime = audioCtx.currentTime;
    instS.start(0); if(playerS) playerS.start(0);
    isPlaying = true; startMenu.classList.add('hidden');
    document.getElementById('resume-game-btn').style.display = 'block';
    requestAnimationFrame(loop);
}

function resetGame() { if(chartData) startSong(); }
document.getElementById('play-btn').onclick = startSong;

function loop() {
    if(!isPlaying) return;
    const l = getLayout(), songTime = (audioCtx.currentTime - startTime + pauseTimeOffset) * 1000, speed = parseFloat(document.getElementById('speed-slider').value);
    masterGain.gain.value = parseFloat(document.getElementById('volume-slider').value);
    ctx.fillStyle = '#000'; ctx.fillRect(0,0,canvas.width, canvas.height);

    activeNotes.forEach(n => {
        if(n.hit) { if(n.held && n.len > 0) { if(n.time + n.len < songTime) { n.held = false; n.fullyHit = true; } else health = Math.min(2, health + 0.005); } return; }
        if(!n.isPlayer && n.time <= songTime) { n.hit = true; if(n.len > 0) n.held = true; }
        if(isBotplay && n.isPlayer && n.time <= songTime) { n.hit = true; if(n.len > 0) n.held = true; combo++; health = Math.min(2, health + 0.04); lastRating = "SICK!"; popAlpha = 1; }
        if(n.isPlayer && !n.hit && (n.time - songTime) < -160) { n.hit = true; health -= 0.12; combo = 0; misses++; lastRating = "MISS"; popAlpha = 1; }
    });

    ctx.textAlign = 'center'; ctx.fillStyle = `rgba(255,255,255,${popAlpha})`; ctx.font = 'bold 42px sans-serif'; ctx.fillText(lastRating, l.ratingX, l.ratingY);
    ctx.font = 'bold 28px sans-serif'; ctx.fillText(`Combo: ${combo}`, l.comboX, l.comboY); if(popAlpha > 0) popAlpha -= 0.02;

    ctx.fillStyle = '#222'; ctx.fillRect(l.hbX, l.hbY, l.hbW, 10);
    ctx.fillStyle = health > 0.4 ? getComputedStyle(document.documentElement).getPropertyValue('--accent') : getComputedStyle(document.documentElement).getPropertyValue('--error');
    ctx.fillRect(l.hbX, l.hbY, l.hbW * (health / 2), 10);
    ctx.fillStyle = '#888'; ctx.font = 'bold 14px sans-serif'; ctx.fillText(`Accuracy: ${Math.max(0, 100 - (misses*2)).toFixed(2)}% | Misses: ${misses}`, canvas.width/2, l.hbY + 35);

    const renderSide = (isPlayer) => {
        const yBase = isPlayer ? l.playerY : l.opponentY, xStart = isPlayer ? l.playXStart : l.oppXStart;
        for(let i=0; i<4; i++) {
            const isHeld = (isPlayer && (isBotplay ? activeNotes.some(n=>n.lane===i && n.held) : touchHeld[i]));
            ctx.strokeStyle = isHeld ? colors[i] : '#333'; ctx.lineWidth = 4;
            ctx.beginPath(); ctx.arc(xStart + (i * l.laneWidth) + 40, yBase + 40, 35, 0, Math.PI*2); ctx.stroke();
        }
        activeNotes.forEach(n => {
            if(n.isPlayer !== isPlayer || n.fullyHit || (n.hit && n.len <= 0)) return;
            const x = xStart + (n.lane * l.laneWidth), vY = yBase - ((n.time - songTime) * speed);
            if(vY > -200 && vY < canvas.height + 200) {
                if(n.len > 0) {
                    const h = n.len * speed; let dTop = vY + 40, dH = -h;
                    if(n.hit && n.held) { dTop = yBase + 40; dH = -((n.time + n.len - songTime) * speed); }
                    ctx.fillStyle = isPlayer ? colors[n.lane] : '#444'; ctx.globalAlpha = 0.3; ctx.fillRect(x + 30, dTop, 20, dH); ctx.globalAlpha = 1;
                }
                if(!n.hit) { ctx.fillStyle = isPlayer ? colors[n.lane] : '#444'; ctx.beginPath(); ctx.arc(x+40, vY+40, 35, 0, Math.PI*2); ctx.fill(); }
            }
        });
    }
    renderSide(false); renderSide(true);
    if(health <= 0) resetGame();
    requestAnimationFrame(loop);
}

// Init
getBuf(HS_URL).then(b => hsBuf = b);
setTimeout(() => selectFromLibrary('guns'), 500); // Small delay for DB check
</script>
