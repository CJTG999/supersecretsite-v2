<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FNF Web Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; color: white; touch-action: none; font-family: sans-serif; }
        canvas { display: block; width: 100vw; height: 100vh; }
        #ui-layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; display: flex; flex-direction: column; }
        .interactive { pointer-events: auto; }
        .hidden { display: none !important; }
        
        /* Toast Notifications */
        #toast-container { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 50; pointer-events: none; }
        .toast { background: rgba(0,0,0,0.8); color: white; padding: 10px 20px; border-radius: 20px; margin-top: 10px; transition: opacity 0.5s; }
        
        /* Custom Scrollbar for the menu */
        #menu::-webkit-scrollbar { width: 8px; }
        #menu::-webkit-scrollbar-track { background: transparent; }
        #menu::-webkit-scrollbar-thumb { background: #10b981; border-radius: 4px; }
    </style>
</head>
<body>

<canvas id="gameCanvas"></canvas>

<div id="ui-layer">
    <!-- Main Menu / Overlay -->
    <div id="menu" class="interactive flex flex-col items-center justify-center h-full bg-black/80 backdrop-blur-sm p-4 overflow-y-auto">
        <h1 class="text-4xl md:text-5xl font-bold mb-8 text-transparent bg-clip-text bg-gradient-to-r from-green-400 to-emerald-600 mt-8">FNF Mobile Enhanced</h1>
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6 w-full max-w-4xl">
            <!-- Library Management Panel -->
            <div class="bg-gray-900 border border-gray-700 p-6 rounded-xl flex flex-col">
                <h2 class="text-xl font-bold mb-4 text-emerald-400">Library Management</h2>
                <div class="flex flex-col gap-3 flex-1 justify-center">
                    <label class="bg-emerald-600 hover:bg-emerald-500 text-center cursor-pointer text-white font-bold py-3 px-4 rounded transition-colors shadow-lg shadow-emerald-900/50">
                        Upload Song (.zip, .json)
                        <input type="file" id="file-uploader" class="hidden" accept=".zip,.json,audio/*" multiple>
                    </label>
                    <button id="btn-export" class="bg-teal-600 hover:bg-teal-500 text-white font-bold py-3 px-4 rounded transition-colors shadow-lg shadow-teal-900/50">
                        Export Library to Bundle
                    </button>
                    <p class="text-xs text-gray-400 mt-2 text-center">Zip your chart (.json), Inst (.ogg), and Voices (.ogg) together to upload a full track!</p>
                </div>
            </div>

            <!-- Song Settings Panel -->
            <div class="bg-gray-900 border border-gray-700 p-6 rounded-xl">
                <h2 class="text-xl font-bold mb-4 text-emerald-400">Song Settings</h2>
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Audio Offset (ms)</label>
                        <input type="number" id="setting-offset" value="0" class="w-full bg-gray-800 border border-gray-600 rounded p-2 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div>
                        <label class="block text-sm text-gray-400 mb-1">Scroll Speed (Mult)</label>
                        <input type="number" id="setting-speed" value="1.0" step="0.1" class="w-full bg-gray-800 border border-gray-600 rounded p-2 text-white focus:outline-none focus:border-emerald-500">
                    </div>
                    <div class="flex items-center gap-2 mt-2">
                        <input type="checkbox" id="setting-ghost" checked class="w-5 h-5 accent-emerald-500 rounded bg-gray-800 border-gray-600">
                        <label class="text-sm text-gray-300">Ghost Tapping</label>
                    </div>
                    <div class="flex items-center gap-2 mt-2">
                        <input type="checkbox" id="setting-botplay" class="w-5 h-5 accent-emerald-500 rounded bg-gray-800 border-gray-600">
                        <label class="text-sm text-gray-300">Botplay</label>
                    </div>
                </div>
            </div>
        </div>

        <!-- Play Area -->
        <div class="flex gap-4 w-full max-w-4xl bg-gray-900 border border-gray-700 p-4 rounded-xl shadow-2xl">
            <select id="song-select" class="flex-1 bg-gray-800 border border-gray-600 rounded p-3 text-white focus:outline-none focus:border-emerald-500 font-bold">
                <option value="none">-- Select a Song --</option>
                <!-- Dynamically populated from DB -->
            </select>
            <button id="btn-play" class="bg-green-600 hover:bg-green-500 text-white font-bold py-3 px-10 rounded transition-colors disabled:opacity-50 text-xl shadow-lg shadow-green-900/50">PLAY</button>
        </div>
    </div>

    <!-- In-Game HUD -->
    <div id="hud" class="hidden flex-col h-full justify-between p-4">
        <div class="flex justify-between items-start">
            <button id="btn-quit" class="interactive bg-red-600/80 hover:bg-red-500 text-white px-4 py-2 rounded-full font-bold backdrop-blur-md">Quit</button>
            <div class="text-right font-mono text-xl text-white drop-shadow-md">
                <div id="score-display">Score: 0</div>
                <div id="combo-display">Combo: 0</div>
            </div>
        </div>
        
        <!-- Health Bar -->
        <div class="w-full max-w-2xl mx-auto mb-8">
            <div class="h-4 w-full bg-red-600 rounded-full overflow-hidden border-2 border-white shadow-[0_0_10px_rgba(0,0,0,0.5)]">
                <div id="health-fill" class="h-full bg-green-500 transition-all duration-100" style="width: 50%;"></div>
            </div>
        </div>
    </div>
</div>

<div id="toast-container"></div>

<script>
/**
 * FNF WEB ENGINE - SINGLE FILE
 * Features: DB Storage, ZIP Uploads, Settings Restored, Wide Hitboxes, Sliding
 */

// --- Audio & Game State ---
const AudioContext = window.AudioContext || window.webkitAudioContext;
let audioCtx;
let instSource, vocSource;
let isPlaying = false;
let songTime = 0, startTime = 0;
let health = 1.0; 
let score = 0, combo = 0;

// User Settings
let userSettings = {
    offset: 0,
    speedMult: 1.0,
    ghostTapping: true,
    botplay: false
};

// Hit tracking & Visuals
let activeNotes = [];
let scrollSpeed = 2.0;
const colors = ['#c24b99', '#00ffff', '#12fa05', '#f9393f']; 
let playerHeld = [false, false, false, false];
let oppHeld = [false, false, false, false];

// Judgments
let lastJudgment = "";
let judgmentAlpha = 0;
let judgmentTimer = 0;

// UI Elements
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');
const menuUI = document.getElementById('menu');
const hudUI = document.getElementById('hud');
const healthFill = document.getElementById('health-fill');
const scoreDisp = document.getElementById('score-display');
const comboDisp = document.getElementById('combo-display');
const songSelect = document.getElementById('song-select');

// Resize Canvas
function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

// --- Database (IndexedDB for storing songs) ---
const DB_NAME = "FNF_Engine_DB";
let db;

function initDB() {
    return new Promise((resolve, reject) => {
        const req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = (e) => {
            const database = e.target.result;
            if (!database.objectStoreNames.contains("songs")) {
                database.createObjectStore("songs", { keyPath: "id" });
            }
        };
        req.onsuccess = (e) => { db = e.target.result; resolve(); };
        req.onerror = (e) => reject(e);
    });
}

async function saveSongToDB(songData) {
    return new Promise((resolve, reject) => {
        const tx = db.transaction("songs", "readwrite");
        tx.objectStore("songs").put(songData);
        tx.oncomplete = () => resolve();
        tx.onerror = () => reject(tx.error);
    });
}

async function getAllSongs() {
    return new Promise((resolve, reject) => {
        const tx = db.transaction("songs", "readonly");
        const req = tx.objectStore("songs").getAll();
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}

async function getSong(id) {
    return new Promise((resolve, reject) => {
        const tx = db.transaction("songs", "readonly");
        const req = tx.objectStore("songs").get(id);
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
    });
}

// Ensure the "Guns" default track exists
async function addDefaultGunsSong() {
    const existing = await getSong('guns');
    if (!existing) {
        // Generate a simple demo chart for "Guns" if missing
        const dummyChart = { song: { song: 'Guns', speed: 2.2, notes: [] } };
        let t = 0;
        for(let i=0; i<64; i++) {
            dummyChart.song.notes.push({
                mustHitSection: true,
                sectionNotes: [ [t, i % 4, 0] ]
            });
            t += 250; // Simple beat sequence
        }
        await saveSongToDB({
            id: 'guns',
            name: 'Guns (Default Demo)',
            inst: null,
            voc: null,
            chart: dummyChart
        });
    }
}

// --- File Handling & ZIP Processing ---
function showToast(msg) {
    const container = document.getElementById('toast-container');
    const t = document.createElement('div');
    t.className = 'toast'; t.innerText = msg;
    container.appendChild(t);
    setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 500); }, 3000);
}

async function refreshLibrary() {
    const songs = await getAllSongs();
    songSelect.innerHTML = '<option value="none">-- Select a Song --</option>';
    songs.forEach(s => {
        const opt = document.createElement('option');
        opt.value = s.id;
        opt.innerText = s.name;
        songSelect.appendChild(opt);
    });
}

document.getElementById('file-uploader').addEventListener('change', async (e) => {
    const files = Array.from(e.target.files);
    if (!files.length) return;
    
    showToast("Processing files...");

    if (files.length === 1 && files[0].name.endsWith('.zip')) {
        try {
            const zip = await JSZip.loadAsync(files[0]);
            let zInst, zVoc, zChart, zName = files[0].name.replace('.zip', '');
            
            for (const [path, file] of Object.entries(zip.files)) {
                if (file.dir) continue;
                const name = path.toLowerCase();
                
                if (name.endsWith('.json') && !name.includes('metadata')) {
                    zChart = JSON.parse(await file.async("string"));
                } else if ((name.includes('inst') || name === 'audio.ogg' || name === 'audio.mp3') && (name.endsWith('.mp3') || name.endsWith('.ogg'))) {
                    zInst = new Blob([await file.async("arraybuffer")]);
                } else if ((name.includes('voc') || name.includes('voice')) && (name.endsWith('.mp3') || name.endsWith('.ogg'))) {
                    zVoc = new Blob([await file.async("arraybuffer")]);
                }
            }
            
            if (zChart) {
                const id = 'song-' + Date.now();
                await saveSongToDB({ id, name: zName, inst: zInst, voc: zVoc, chart: zChart });
                showToast("ZIP Successfully Installed!");
                await refreshLibrary();
                songSelect.value = id;
            } else {
                showToast("Error: No .json chart found in ZIP.");
            }
        } catch(err) {
            console.error(err);
            showToast("Failed to read ZIP file.");
        }
        return;
    }

    let fInst, fVoc, fChart, songName = "Custom Song";
    for(const file of files) {
        const name = file.name.toLowerCase();
        if (name.endsWith('.json')) { fChart = file; songName = file.name.replace('.json', ''); }
        else if (name.includes('inst')) fInst = file;
        else if (name.includes('voc') || name.includes('voice')) fVoc = file;
    }

    if (fChart) {
        try {
            const chartData = JSON.parse(await fChart.text());
            const id = 'song-' + Date.now();
            await saveSongToDB({ id, name: songName, inst: fInst, voc: fVoc, chart: chartData });
            showToast("Song saved to library!");
            await refreshLibrary();
            songSelect.value = id;
        } catch(e) {
            showToast("Invalid JSON chart.");
        }
    } else {
        showToast("Please include a .json chart file.");
    }
});

// Generic Hitsound function 
function playHitSound() {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gainNode = audioCtx.createGain();
    osc.connect(gainNode);
    gainNode.connect(audioCtx.destination);
    
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
    
    gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
    gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
    
    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
}

// --- Game Logic ---
function getLayout() {
    const isPortrait = canvas.width < canvas.height;
    const laneW = isPortrait ? canvas.width / 4 : Math.min(canvas.width / 10, 110);
    const playXStart = isPortrait ? 0 : canvas.width - (laneW * 4.5) - 40;
    const oppXStart = isPortrait ? 0 : 40;
    const strumY = Math.min(canvas.height * 0.15, 120);
    return { isPortrait, laneW, playXStart, oppXStart, strumY };
}

function parseChart(chartData) {
    activeNotes = [];
    if (!chartData || !chartData.song || !chartData.song.notes) return;
    
    // Apply user settings multiplier to speed
    scrollSpeed = (chartData.song.speed || 2.0) * userSettings.speedMult;

    chartData.song.notes.forEach(section => {
        const mustHit = section.mustHitSection;
        section.sectionNotes.forEach(note => {
            const time = note[0];
            let rawLane = note[1];
            const len = note[2] || 0;
            
            let isPlayer = mustHit;
            if (rawLane > 3) {
                isPlayer = !mustHit;
                rawLane %= 4;
            }

            activeNotes.push({
                time: time,
                lane: rawLane,
                len: len,
                isPlayer: isPlayer,
                hit: false,
                held: false,
                missed: false,
                wasGoodHit: false
            });
        });
    });
    
    activeNotes.sort((a, b) => a.time - b.time);
}

// Input Handling
const keysMap = {
    'ArrowLeft': 0, 'a': 0, 'A': 0,
    'ArrowDown': 1, 's': 1, 'S': 1,
    'ArrowUp': 2, 'w': 2, 'W': 2,
    'ArrowRight': 3, 'd': 3, 'D': 3
};

function hitNote(lane, isBot = false) {
    if (!isPlaying) return;
    if (!isBot && userSettings.botplay) return; // Prevent manual input during botplay

    playerHeld[lane] = true;
    const hitWindow = 200;
    // Apply user audio offset
    const currentMs = (songTime * 1000) - userSettings.offset;
    
    const validNotes = activeNotes.filter(n => 
        n.isPlayer && !n.hit && !n.missed && n.lane === lane && Math.abs(n.time - currentMs) <= hitWindow
    );

    if (validNotes.length > 0) {
        const noteToHit = validNotes[0]; 
        noteToHit.hit = true;
        noteToHit.held = true;
        noteToHit.wasGoodHit = true;
        
        playHitSound();

        const diff = Math.abs(noteToHit.time - currentMs);
        
        // Botplay forces perfect SICK hits
        if (isBot || diff < 60) { lastJudgment = "SICK!!"; score += 350; health += 0.04; }
        else if (diff < 120) { lastJudgment = "GOOD!"; score += 200; health += 0.02; }
        else { lastJudgment = "BAD"; score += 50; }
        
        combo++;
        judgmentAlpha = 1.0;
        judgmentTimer = 0;
    } else if (!isBot && !userSettings.ghostTapping) {
        // Penalty for Ghost Tapping if setting is turned off
        health -= 0.05;
        combo = 0;
        lastJudgment = "MISS";
        judgmentAlpha = 1.0;
        judgmentTimer = 0;
    }
}

function releaseNote(lane, isBot = false) {
    if (!isBot && userSettings.botplay) return;
    playerHeld[lane] = false;
    activeNotes.forEach(n => {
        if (n.isPlayer && n.lane === lane && n.held) {
            n.held = false;
        }
    });
}

window.addEventListener('keydown', e => {
    if (e.repeat) return; 
    const lane = keysMap[e.key];
    if (lane !== undefined) hitNote(lane);
});
window.addEventListener('keyup', e => {
    const lane = keysMap[e.key];
    if (lane !== undefined) releaseNote(lane);
});

// Touch Listeners (Sliding + Massive Hitboxes)
const activeTouches = {}; 

function getLaneFromTouch(x, y) {
    if (y < canvas.height * 0.4) return -1;
    const colWidth = canvas.width / 4;
    for(let i=0; i<4; i++) {
        if (x >= i * colWidth && x < (i+1) * colWidth) return i;
    }
    return -1;
}

canvas.addEventListener('touchstart', e => {
    e.preventDefault();
    if(userSettings.botplay) return;
    for (let i=0; i<e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        const lane = getLaneFromTouch(t.clientX, t.clientY);
        activeTouches[t.identifier] = lane; 
        if (lane !== -1) hitNote(lane);
    }
}, {passive: false});

canvas.addEventListener('touchmove', e => {
    e.preventDefault();
    if(userSettings.botplay) return;
    for (let i=0; i<e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        const currentLane = getLaneFromTouch(t.clientX, t.clientY);
        const prevLane = activeTouches[t.identifier];
        
        if (currentLane !== prevLane) {
            if (prevLane !== -1 && prevLane !== undefined) releaseNote(prevLane);
            if (currentLane !== -1) hitNote(currentLane);
            activeTouches[t.identifier] = currentLane;
        }
    }
}, {passive: false});

const handleTouchEnd = e => {
    e.preventDefault();
    if(userSettings.botplay) return;
    for (let i=0; i<e.changedTouches.length; i++) {
        const t = e.changedTouches[i];
        const prevLane = activeTouches[t.identifier];
        if (prevLane !== -1 && prevLane !== undefined) releaseNote(prevLane);
        delete activeTouches[t.identifier];
    }
};

canvas.addEventListener('touchend', handleTouchEnd, {passive: false});
canvas.addEventListener('touchcancel', handleTouchEnd, {passive: false});

// --- Rendering Loop ---
function drawReceptor(cx, cy, size, color, isHeld) {
    ctx.lineWidth = 4;
    ctx.strokeStyle = isHeld ? '#fff' : color;
    ctx.fillStyle = isHeld ? color : 'rgba(0,0,0,0.5)';
    ctx.beginPath();
    const s2 = size / 2;
    ctx.roundRect(cx - s2, cy - s2, size, size, size * 0.2);
    ctx.fill();
    ctx.stroke();
}

function drawNote(cx, cy, size, color) {
    ctx.fillStyle = color;
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(cx, cy, size/2 * 0.95, 0, Math.PI*2);
    ctx.fill();
    ctx.stroke();
}

function updateGame() {
    if (!isPlaying) return;

    if (audioCtx) {
        songTime = audioCtx.currentTime - startTime;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    const l = getLayout();
    // Use Offset logic for visual rendering sync too
    const currentMs = (songTime * 1000) - userSettings.offset; 
    const size = l.laneW * 0.95; 
    const strumCenterY = l.strumY + (size / 2);

    // --- Autoplay Logic ---
    oppHeld = [false, false, false, false];
    
    activeNotes.forEach(n => {
        // Opponent Autoplay
        if (!n.isPlayer && !n.hit && currentMs >= n.time) { n.hit = true; n.held = true; }
        if (!n.isPlayer && n.held) {
            oppHeld[n.lane] = true;
            if (currentMs >= n.time + n.len) n.held = false;
        }

        // Botplay Logic (Player Side)
        if (userSettings.botplay) {
            if (n.isPlayer && !n.hit && currentMs >= n.time) {
                hitNote(n.lane, true);
            }
            if (n.isPlayer && n.held && currentMs >= n.time + n.len) {
                releaseNote(n.lane, true);
            }
        }
    });

    // --- Miss Detection for Player ---
    if (!userSettings.botplay) {
        activeNotes.forEach(n => {
            if (n.isPlayer && !n.hit && !n.missed && currentMs > n.time + 200) {
                n.missed = true;
                combo = 0;
                health -= 0.08;
                lastJudgment = "MISS";
                judgmentAlpha = 1.0;
                judgmentTimer = 0;
            }
            if (n.isPlayer && n.held && currentMs >= n.time + n.len) {
                n.held = false;
            }
        });
    }

    health = Math.max(0, Math.min(2.0, health));
    healthFill.style.width = (health / 2.0 * 100) + '%';
    healthFill.style.backgroundColor = health < 0.4 ? '#ef4444' : '#10b981';

    // Hide Opponent in Portrait mode
    if (!l.isPortrait) {
        for (let i = 0; i < 4; i++) {
            const cx = l.oppXStart + (i * l.laneW) + (l.laneW / 2);
            drawReceptor(cx, strumCenterY, size, colors[i], oppHeld[i]);
        }
    }

    // Always draw Player Receptors
    for (let i = 0; i < 4; i++) {
        const cx = l.playXStart + (i * l.laneW) + (l.laneW / 2);
        drawReceptor(cx, strumCenterY, size, colors[i], playerHeld[i]);
    }

    // Render Notes
    activeNotes.forEach(n => {
        if (!n.isPlayer && l.isPortrait) return; 
        if (n.hit && !n.held && n.len === 0) return; 

        const xBase = n.isPlayer ? l.playXStart : l.oppXStart;
        const cx = xBase + (n.lane * l.laneW) + (l.laneW / 2);
        const cy = strumCenterY + ((n.time - currentMs) * (scrollSpeed * 0.45));

        if (cy > canvas.height + 200 || cy < -1000) return;

        if (n.len > 0) {
            const holdHeight = n.len * (scrollSpeed * 0.45);
            let drawY = cy;
            let drawH = holdHeight;
            
            if (n.held) {
                drawY = strumCenterY;
                drawH = holdHeight - (currentMs - n.time) * (scrollSpeed * 0.45);
            }

            if (drawH > 0) {
                ctx.globalAlpha = 0.6;
                ctx.fillStyle = colors[n.lane];
                const tailW = l.laneW * 0.35;
                ctx.fillRect(cx - (tailW/2), drawY, tailW, drawH);
                ctx.globalAlpha = 1.0;
            }
        }

        if (!n.hit) {
            drawNote(cx, cy, size, colors[n.lane]);
        }
    });

    // Render Judgment
    if (judgmentAlpha > 0) {
        ctx.save();
        ctx.globalAlpha = judgmentAlpha;
        ctx.fillStyle = lastJudgment === "MISS" ? '#ef4444' : '#ffffff';
        ctx.font = 'bold 48px sans-serif';
        ctx.textAlign = 'center';
        
        const scale = 1.0 + (judgmentAlpha * 0.2);
        ctx.translate(canvas.width / 2, canvas.height * 0.4);
        ctx.scale(scale, scale);
        
        ctx.lineWidth = 4; ctx.strokeStyle = '#000';
        ctx.strokeText(lastJudgment, 0, 0);
        ctx.fillText(lastJudgment, 0, 0);
        ctx.restore();
        
        judgmentTimer += 0.016;
        if (judgmentTimer > 0.5) judgmentAlpha -= 0.05;
    }

    scoreDisp.innerText = `Score: ${score}`;
    comboDisp.innerText = `Combo: ${combo}`;

    if (health <= 0) {
        stopGame();
        showToast("GAME OVER");
    }

    requestAnimationFrame(updateGame);
}

// --- Audio Loading & Control ---
async function decodeAudio(blob) {
    if (!blob) return null;
    const arrayBuffer = await blob.arrayBuffer();
    return await audioCtx.decodeAudioData(arrayBuffer);
}

function stopGame() {
    isPlaying = false;
    if (instSource) { instSource.stop(); instSource.disconnect(); instSource = null; }
    if (vocSource) { vocSource.stop(); vocSource.disconnect(); vocSource = null; }
    hudUI.classList.add('hidden');
    menuUI.classList.remove('hidden');
}

document.getElementById('btn-play').addEventListener('click', async () => {
    const songId = songSelect.value;
    if (songId === 'none') { showToast("Select a song first!"); return; }

    // Grab settings from DOM
    userSettings.offset = parseInt(document.getElementById('setting-offset').value) || 0;
    userSettings.speedMult = parseFloat(document.getElementById('setting-speed').value) || 1.0;
    userSettings.ghostTapping = document.getElementById('setting-ghost').checked;
    userSettings.botplay = document.getElementById('setting-botplay').checked;

    const song = await getSong(songId);
    if (!song) { showToast("Error loading song."); return; }

    menuUI.classList.add('hidden');
    hudUI.classList.remove('hidden');
    showToast("Loading Audio...");

    if (!audioCtx) audioCtx = new AudioContext();
    if (audioCtx.state === 'suspended') await audioCtx.resume();

    try {
        parseChart(song.chart);
        score = 0; combo = 0; health = 1.0;
        
        const [instBuffer, vocBuffer] = await Promise.all([
            decodeAudio(song.inst),
            decodeAudio(song.voc)
        ]);

        if (instBuffer) {
            instSource = audioCtx.createBufferSource();
            instSource.buffer = instBuffer;
            instSource.connect(audioCtx.destination);
            
            if (vocBuffer) {
                vocSource = audioCtx.createBufferSource();
                vocSource.buffer = vocBuffer;
                vocSource.connect(audioCtx.destination);
            }

            isPlaying = true;
            startTime = audioCtx.currentTime + 0.5;
            instSource.start(startTime);
            if (vocSource) vocSource.start(startTime);
            
            instSource.onended = () => {
                if(isPlaying) { stopGame(); showToast("Song Cleared!"); }
            };
            
            updateGame();
        } else {
            // No Audio Fallback (For Default "Guns" Demo or broken files)
            isPlaying = true;
            startTime = audioCtx.currentTime + 0.5;
            updateGame();
            
            let lastNoteTime = 5000;
            if (activeNotes.length > 0) lastNoteTime = activeNotes[activeNotes.length - 1].time;
            
            setTimeout(() => {
                if (isPlaying) { stopGame(); showToast("Song Cleared!"); }
            }, lastNoteTime + 2000);
        }
    } catch (err) {
        console.error(err);
        stopGame();
        showToast("Playback error.");
    }
});

document.getElementById('btn-quit').addEventListener('click', stopGame);

// Boot
window.onload = async () => {
    try {
        await initDB();
        await addDefaultGunsSong();
        await refreshLibrary();
        
        // Auto select guns
        if (songSelect.querySelector('option[value="guns"]')) {
            songSelect.value = "guns";
        }
    } catch(e) {
        showToast("Database init failed. Incognito mode?");
    }
};

</script>
