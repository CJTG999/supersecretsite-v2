<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>FNF Mobile v4</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
body { margin:0; background:#000; overflow:hidden; font-family:sans-serif; }
canvas { width:100vw; height:100vh; display:block; }

#menu {
position:fixed; inset:0; background:#000; color:white;
display:flex; flex-direction:column; align-items:center; justify-content:center;
z-index:10;
}

button, input {
padding:12px; margin:6px; border-radius:10px;
border:none; font-weight:bold;
}
</style>
</head>

<body>

<div id="menu">
<h1>FNF Mobile v4</h1>
<button onclick="startSong()">START</button>

<label>Hit Window</label>
<input id="hitWindow" type="range" min="100" max="250" value="180">

<label>Note Size</label>
<input id="noteSizeSlider" type="range" min="0.6" max="1.3" step="0.05" value="0.95">

<label>Input Offset (ms)</label>
<input id="offsetSlider" type="range" min="-150" max="150" value="0">

<button id="laneGlowBtn">Lane Glow: ON</button>
<button id="vibrateBtn">Vibration: OFF</button>
</div>

<canvas id="game"></canvas>

<script>
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let audioCtx = new AudioContext();
let startTime = 0;
let notes = [];
let isPlaying = false;

let touchHeld = [false,false,false,false];

let laneGlow = true;
let vibrate = false;

document.getElementById("laneGlowBtn").onclick = e=>{
laneGlow = !laneGlow;
e.target.innerText = "Lane Glow: " + (laneGlow?"ON":"OFF");
};

document.getElementById("vibrateBtn").onclick = e=>{
vibrate = !vibrate;
e.target.innerText = "Vibration: " + (vibrate?"ON":"OFF");
};

function resize(){
canvas.width = innerWidth * devicePixelRatio;
canvas.height = innerHeight * devicePixelRatio;
}
resize();
addEventListener("resize",resize);

function startSong(){
notes = [];
for(let i=0;i<100;i++){
notes.push({
lane: Math.floor(Math.random()*4),
time: i*400
});
}
startTime = audioCtx.currentTime;
isPlaying = true;
document.getElementById("menu").style.display="none";
requestAnimationFrame(loop);
}

function getLaneX(lane){
return (canvas.width/4)*lane + canvas.width/8;
}

function handleInput(lane, down){
if(!isPlaying) return;

const hitWindow = parseFloat(document.getElementById("hitWindow").value);
const offset = parseFloat(document.getElementById("offsetSlider").value);

if(down){
touchHeld[lane] = true;

const songTime = (audioCtx.currentTime - startTime)*1000 + offset;

const note = notes
.filter(n=>!n.hit && n.lane===lane)
.sort((a,b)=>Math.abs(a.time-songTime)-Math.abs(b.time-songTime))
.find(n=>Math.abs(n.time-songTime)<hitWindow);

if(note){
note.hit = true;

if(vibrate && navigator.vibrate) navigator.vibrate(10);
}
}else{
touchHeld[lane] = false;
}
}

// TOUCH FIX (aligned properly)
canvas.addEventListener("touchstart",e=>{
for(let t of e.changedTouches){
const rect = canvas.getBoundingClientRect();
const x = (t.clientX - rect.left)/rect.width;
const lane = Math.min(3, Math.max(0, Math.floor(x*4)));
handleInput(lane,true);
}
});

canvas.addEventListener("touchend",e=>{
for(let t of e.changedTouches){
const rect = canvas.getBoundingClientRect();
const x = (t.clientX - rect.left)/rect.width;
const lane = Math.min(3, Math.max(0, Math.floor(x*4)));
handleInput(lane,false);
}
});

function loop(){
if(!isPlaying) return;

ctx.fillStyle="#000";
ctx.fillRect(0,0,canvas.width,canvas.height);

const songTime = (audioCtx.currentTime - startTime)*1000;
const noteScale = parseFloat(document.getElementById("noteSizeSlider").value);

for(let i=0;i<4;i++){
if(laneGlow && touchHeld[i]){
ctx.fillStyle="rgba(255,255,255,0.2)";
ctx.fillRect(i*(canvas.width/4),0,canvas.width/4,canvas.height);
}
}

notes.forEach(n=>{
if(n.hit) return;

const y = canvas.height - (songTime - n.time)*0.5;

if(y < -100) return;

ctx.beginPath();
ctx.fillStyle="white";
ctx.arc(getLaneX(n.lane), y, 40*noteScale, 0, Math.PI*2);
ctx.fill();
});

requestAnimationFrame(loop);
}
</script>

</body>
</html>
