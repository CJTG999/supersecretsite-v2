<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sss - home</title>
    <link rel="icon" href="https://codehs.com/uploads/c69638d51ac51123c4b70ad422b59760">
    <style>
        /* --- CUSTOM CURSOR FIX --- */
        /* 1. Apply to the root and body */
        html, body {
            cursor: url('https://codehs.com/uploads/471381c796bfff3712cd05b64b44142a'), auto !important;
            min-height: 100vh;
        }
        /* 2. Apply to all interactive elements */
        /* We include 'a' tags, buttons, and tailwind-style pointer classes */
        a, 
        button, 
        input, 
        select, 
        textarea, 
        .cursor-pointer, 
        #keystroke-tester-container div,
        [role="button"] {
            cursor: url('https://codehs.com/uploads/83f80767e459872bcd2a56d8cc903e59'), pointer !important;
        }
        /* 3. Special fix for iframes/modals */
        #gameModal, .bg-gray-900-transparent {
            cursor: url('https://codehs.com/uploads/471381c796bfff3712cd05b64b44142a'), auto !important;
        }
        
        /* RESET & BASICS */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Segoe UI', 'Press Start 2P', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d0d0d;
            background: radial-gradient(circle at center, #1a0b2e 0%, #0d0d0d 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;F
            min-height: 100vh;
            text-align: center;
            padding: 40px 0;
        }
        .container {
            width: 95%;
            max-width: 1000px; /* Wider to accommodate the grid */
            padding: 10px;
        }
        /* PROFILE IMAGE CONTAINER */
        .profile-wrapper {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px auto;
            border-radius: 50%;
            border: 4px solid #4a90e2;
            overflow: hidden; 
            background-color: #222;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .profile-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 5px;
            font-weight: 800;
        }
        .handle {
            color: #4a90e2;
            font-weight: bold;
            font-size: 16px;
            margin-bottom: 20px;
            display: block;
            font-family: monospace;
        }
        /* SEARCH BAR STYLE */
        .search-container {
            margin: 20px auto 30px auto;
            max-width: 500px;
        }
        #gameSearch {
            width: 100%;
            padding: 12px 20px;
            border-radius: 25px;
            border: 2px solid #333;
            background-color: #1a1a1a;
            color: white;
            font-size: 16px;
            outline: none;
            transition: border-color 0.3s;
        }
        #gameSearch:focus {
            border-color: #584dfd;
        }
        /* GAME GRID (THE CARD LOOK) */
        .links-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        .link-btn {
            background-color: #1e1e2e; /* Dark navy card bg */
            border: 2px solid #2a2a3a;
            border-radius: 12px;
            padding: 20px 10px;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            transition: transform 0.2s, border-color 0.2s;
            min-height: 160px;
        }
        .link-btn:hover {
            transform: translateY(-5px);
            border-color: #584dfd;
        }
        .game-title {
            color: #ffffff;
            font-size: 14px;
            font-weight: bold;
            margin-bottom: 15px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        /* THE "PLAY NOW" BUTTON STYLE FROM IMAGE */
        .play-now-label {
            background-color: #584dfd;
            color: white;
            padding: 8px 0;
            width: 90%;
            border-radius: 8px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 4px 0 #3b31c2;
        }
        .btn-icon {
            width: 40px;
            height: 40px;
            margin-bottom: 10px;
            object-fit: contain;
        }
        /* SOCIALS & ABOUT (Kept similar but centered) */
        .socials-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        .social-icon {
            width: 42px; height: 42px;
            background-color: #1a1a1a;
            border-radius: 50%;
            border: 1px solid #333;
            display: flex; align-items: center; justify-content: center;
        }
        .about-section {
            background-color: #161616;
            padding: 20px;
            border-radius: 16px;
            margin: 0 auto 30px auto;
            border: 1px solid #333;
            max-width: 600px;
        }
        .footer { margin-top: 40px; font-size: 12px; color: #555; font-family: monospace; }
        
        /* Hidden class for search */
        .hidden { display: none !important; }

        /* NEW UI BUTTON */
        .new-ui-btn {
            display: inline-block;
            margin: 0 auto 22px auto;
            padding: 10px 26px;
            background-color: #584dfd;
            color: #fff;
            text-decoration: none;
            font-weight: bold;
            font-size: 14px;
            letter-spacing: 0.5px;
            border-radius: 25px;
            box-shadow: 0 4px 0 #3b31c2;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .new-ui-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 0 #3b31c2;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="beta.html" class="new-ui-btn">&#127918; Try the new UI!</a>
        <div class="profile-wrapper">
            <img src="https://codehs.com/uploads/c69638d51ac51123c4b70ad422b59760" alt="Master Programmer Logo">
        </div>
        <h1>SuperSecretSite</h1>
        <span class="handle">&lt;cjtg999/&gt;</span>
        <div class="socials-row" id="socialsRow"></div>
        <div class="about-section">
            <p>Hello world! I'm a beginning developer turning ideas into clean code. Check out my Games and projects below.
                <br> Check out this site's code here!  <br> https://github.com/CJTG999/supersecretsite-v2/
            </p>
        </div>
        <div class="search-container">
            <input type="text" id="gameSearch" placeholder="Search games & projects...">
        </div>
        <div class="links-container" id="linksContainer"></div>
        <div class="footer">
            &copy; 2026 CJ Shaffer
        </div>
    </div>
    <script>
        // All cards and socials are loaded from one shared file.
        async function loadLinks() {
            const response = await fetch('links.json');
            if (!response.ok) throw new Error('Could not load links.json');
            const data = await response.json();
            const container = document.getElementById('linksContainer');
            const socials = document.getElementById('socialsRow');

            data.socials.forEach(item => {
                const link = document.createElement('a');
                link.href = item.href;
                link.className = 'social-icon';
                link.title = item.title;
                const image = document.createElement('img');
                image.src = item.icon;
                image.alt = item.alt || item.title;
                image.style.width = '60%';
                link.appendChild(image);
                socials.appendChild(link);
            });

            data.links.forEach(item => {
                const link = document.createElement('a');
                link.href = item.href;
                link.className = 'link-btn';
                const title = document.createElement('div');
                title.className = 'game-title';
                title.textContent = item.title;
                const image = document.createElement('img');
                image.src = item.icon;
                image.className = 'btn-icon';
                image.alt = '';
                const action = document.createElement('div');
                action.className = 'play-now-label';
                action.textContent = item.meta || 'Launch';
                link.append(title, image, action);
                container.appendChild(link);
            });

            const searchInput = document.getElementById('gameSearch');
            searchInput.addEventListener('input', () => {
                const value = searchInput.value.toLowerCase();
                container.querySelectorAll('.link-btn').forEach(card => {
                    card.classList.toggle('hidden',
                        !card.querySelector('.game-title').textContent.toLowerCase().includes(value));
                });
            });
        }
        loadLinks().catch(error => console.error('SuperSecretSite:', error));

        // SECRET REDIRECT
        document.addEventListener('keydown', function(event) {
            if (event.ctrlKey && event.shiftKey && (event.key === 'p' || event.key === 'P')) {
                event.preventDefault();
                window.location.href = 'other/nexusproxy/public/index.html';
            }
        });
    </script>
</body>
</html>
