        .auth-btn { background: #584dfd; border: none; color: white; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
        .visit-badge { color: #4a90e2; font-weight: bold; background: #000; padding: 2px 10px; border-radius: 20px; border: 1px solid #4a90e2; }

        /* PROFILE */
        .profile-wrapper { width: 120px; height: 120px; margin: 0 auto 15px auto; border-radius: 50%; border: 4px solid #4a90e2; overflow: hidden; background-color: #222; display: flex; justify-content: center; align-items: center; }
        .profile-wrapper img { width: 100%; height: 100%; object-fit: cover; }
        h1 { font-size: 28px; margin-bottom: 5px; font-weight: 800; }
        .handle { color: #4a90e2; font-weight: bold; font-size: 16px; margin-bottom: 20px; display: block; font-family: monospace; }

        /* SEARCH */
        .search-container { margin: 20px auto 30px auto; max-width: 500px; }
        #gameSearch { width: 100%; padding: 12px 20px; border-radius: 25px; border: 2px solid #333; background-color: #1a1a1a; color: white; outline: none; }

        /* CARDS */
        .links-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; }
        .link-btn {
            background-color: #1e1e2e; border: 2px solid #2a2a3a; border-radius: 12px;
            padding: 20px 10px; text-decoration: none; display: flex; flex-direction: column;
            align-items: center; position: relative; transition: transform 0.2s; min-height: 180px;
        }
        .link-btn:hover { transform: translateY(-5px); border-color: #584dfd; }

        /* PIN BUTTON */
        .pin-icon {
            position: absolute; top: 10px; right: 10px;
            background: rgba(0,0,0,0.5); border: 1px solid #444;
            color: #aaa; width: 28px; height: 28px; border-radius: 50%;
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            font-size: 14px; transition: 0.2s;
        }
        .pin-icon.active { color: #ffca28; border-color: #ffca28; }
        .pin-icon:hover { background: #333; }

        .game-title { color: #ffffff; font-size: 14px; font-weight: bold; margin: 10px 0; height: 40px; }
        .play-now-label { background-color: #584dfd; color: white; padding: 8px 0; width: 90%; border-radius: 8px; font-size: 12px; font-weight: bold; text-transform: uppercase; box-shadow: 0 4px 0 #3b31c2; }
        .btn-icon { width: 40px; height: 40px; object-fit: contain; }

        .about-section { background-color: #161616; padding: 20px; border-radius: 16px; margin-bottom: 30px; border: 1px solid #333; }
        .footer { margin-top: 40px; font-size: 12px; color: #555; }

<body>

    <script>
        let pinnedItems = JSON.parse(localStorage.getItem('mp_pins') || "[]");

        // 1. PINNING LOGIC
        async function togglePin(id, event) {
            event.preventDefault();
            const user = localStorage.getItem('mp_user');
            if (!user) return alert("Log in to pin items!");

            if (pinnedItems.includes(id)) {
                pinnedItems = pinnedItems.filter(p => p !== id);
            } else {
                pinnedItems.push(id);
            }

            localStorage.setItem('mp_pins', JSON.stringify(pinnedItems));
            
            // Sync to Cloudflare
            await fetch('/api/save-pins', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: user, pinned_links: JSON.stringify(pinnedItems) })
            });

            renderPins();
        }

        function renderPins() {
            const container = document.getElementById('linksContainer');
            const cards = Array.from(container.children);
            
            cards.sort((a, b) => {
                const aPinned = pinnedItems.includes(a.dataset.id);
                const bPinned = pinnedItems.includes(b.dataset.id);
                if (aPinned && !bPinned) return -1;
                if (!aPinned && bPinned) return 1;
                return 0;
            });

            cards.forEach(card => {
                container.appendChild(card);
                const icon = card.querySelector('.pin-icon');
                if (pinnedItems.includes(card.dataset.id)) icon.classList.add('active');
                else icon.classList.remove('active');
            });
        }

        // 2. AUTH LOGIC
        async function authAction(type) {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            if (!email || !password) return alert("Fill fields!");

            const response = await fetch(`/api/${type}`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();
            if (response.ok) {
                localStorage.setItem('mp_user', email);
                if (data.pinned_links) localStorage.setItem('mp_pins', data.pinned_links);
                location.reload();
            } else alert(data.error);
        }

        function logout() { localStorage.removeItem('mp_user'); localStorage.removeItem('mp_pins'); location.reload(); }

        // INITIALIZE
        window.onload = () => {
            const user = localStorage.getItem('mp_user');
            if (user) {
                document.getElementById('username-text').innerText = user;
                document.getElementById('guest-controls').classList.add('hidden');
                document.getElementById('user-controls').classList.remove('hidden');
            }
            renderPins();
            
            // Basic Visit Counter
            let v = parseInt(localStorage.getItem('mp_visits') || "0") + 1;
            localStorage.setItem('mp_visits', v);
            document.getElementById('visit-count').innerText = v;
        };

        // Search logic
        document.getElementById('gameSearch').addEventListener('input', (e) => {
            const val = e.target.value.toLowerCase();
            document.querySelectorAll('.link-btn').forEach(c => {
                c.classList.toggle('hidden', !c.innerText.toLowerCase().includes(val));
            });
        });
    </script>
