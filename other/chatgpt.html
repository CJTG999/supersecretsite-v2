<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Canvas Pro</title>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --bg: #0a0a0a; --panel: #171717; --accent: #3b82f6; --text: #ececec; --border: #333; }
        * { box-sizing: border-box; }
        body { margin: 0; display: flex; height: 100vh; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica; background: var(--bg); color: var(--text); overflow: hidden; }
        
        /* Layout */
        #chat-sidebar { width: 380px; border-right: 1px solid var(--border); display: flex; flex-direction: column; background: var(--panel); z-index: 10; }
        #canvas { flex: 1; padding: 40px; overflow-y: auto; background: var(--bg); position: relative; }
        
        /* Chat UI */
        #messages { flex: 1; overflow-y: auto; padding: 20px; font-size: 14px; line-height: 1.5; }
        .msg { margin-bottom: 20px; padding: 10px; border-radius: 8px; max-width: 90%; }
        .user-msg { background: #2f2f2f; align-self: flex-end; margin-left: auto; }
        .ai-msg { background: transparent; border: 1px solid var(--border); }
        
        .input-box { padding: 20px; border-top: 1px solid var(--border); }
        textarea { width: 100%; background: #212121; color: white; border: 1px solid var(--border); border-radius: 12px; padding: 12px; resize: none; outline: none; font-size: 14px; }
        
        /* Canvas Styling */
        #canvas-content { max-width: 800px; margin: 0 auto; min-height: 80vh; padding: 40px; background: var(--panel); border-radius: 12px; border: 1px solid var(--border); white-space: pre-wrap; font-family: 'Fira Code', monospace; line-height: 1.6; }
        .canvas-header { margin-bottom: 20px; font-weight: bold; color: var(--accent); display: flex; justify-content: space-between; align-items: center; }
        
        /* Controls */
        .btn { cursor: pointer; background: var(--accent); border: none; color: white; padding: 8px 16px; border-radius: 6px; font-weight: 500; transition: 0.2s; }
        .btn:hover { opacity: 0.8; }
        .secondary-btn { background: #333; margin-right: 5px; }
        img { max-width: 100%; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>

<section id="chat-sidebar">
    <div style="padding: 15px; border-bottom: 1px solid var(--border)">
        <input type="password" id="api-key" placeholder="Enter OpenAI API Key" style="width: 100%; padding: 8px; background: #000; color: #fff; border: 1px solid #444; border-radius: 4px;">
    </div>
    <div id="messages"></div>
    <div class="input-box">
        <div style="margin-bottom: 10px;">
            <input type="file" id="file-input" style="display: none;" onchange="handleFileUpload(event)">
            <button class="btn secondary-btn" onclick="document.getElementById('file-input').click()">📎 File</button>
            <button class="btn secondary-btn" onclick="generateImagePrompt()">🎨 Image</button>
        </div>
        <textarea id="user-input" rows="3" placeholder="Type a message..."></textarea>
        <button class="btn" style="width: 100%; margin-top: 10px;" onclick="sendMessage()">Send to GPT-4</button>
    </div>
</section>

<section id="canvas">
    <div class="canvas-header">
        <span id="canvas-title">Artifacts / Canvas</span>
        <button class="btn secondary-btn" onclick="copyCanvas()">Copy Code</button>
    </div>
    <div id="canvas-content" contenteditable="true">Write code or text here...</div>
</section>

<script>
    let chatHistory = [{ role: "system", content: "You are a helpful assistant. If the user asks for code or a long document, wrap that specific part in [CANVAS]...[/CANVAS] tags so I can display it in the side panel." }];
    let attachedFileBase64 = null;

    async function sendMessage() {
    // Hardcoded API Key - Replace 'your-key-here' with your actual OpenAI key
    const apiKey = "sk-proj-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"; 
    
    const inputField = document.getElementById('user-input');
    const userText = inputField.value;
    
    if (!userText) return alert("Please enter a message.");
    if (apiKey === "sk-proj-xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx") {
        return alert("You forgot to paste your actual API key into the code!");
    }
    
    // ... rest of the function remains the same

        // UI: Add User Message
        appendMessage('user', userText);
        inputField.value = '';

        // Prepare Payload
        let userContent = [{ type: "text", text: userText }];
        if (attachedFileBase64) {
            userContent.push({ type: "image_url", image_url: { url: attachedFileBase64 } });
        }

        chatHistory.push({ role: "user", content: userContent });

        try {
            const response = await fetch('https://api.openai.com/v1/chat/completions', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                body: JSON.stringify({
                    model: "gpt-4o",
                    messages: chatHistory,
                    temperature: 0.7
                })
            });

            const data = await response.json();
            const aiText = data.choices[0].message.content;
            
            // Process Canvas Logic
            processResponse(aiText);
            chatHistory.push({ role: "assistant", content: aiText });
            attachedFileBase64 = null; // Clear file after sending
        } catch (err) {
            appendMessage('ai', "Error: " + err.message);
        }
    }

    function processResponse(text) {
        // Regex to find content inside [CANVAS] tags
        const canvasMatch = text.match(/\[CANVAS\]([\s\S]*?)\[\/CANVAS\]/);
        
        if (canvasMatch) {
            const canvasData = canvasMatch[1].trim();
            document.getElementById('canvas-content').textContent = canvasData;
            // Remove the canvas tag from the chat view for cleanliness
            const cleanChatText = text.replace(/\[CANVAS\][\s\S]*?\[\/CANVAS\]/, "_Code generated in Canvas._");
            appendMessage('ai', cleanChatText);
        } else {
            appendMessage('ai', text);
        }
    }

    async function generateImagePrompt() {
        const apiKey = document.getElementById('api-key').value;
        const prompt = prompt("Describe the image you want to generate:");
        if (!prompt || !apiKey) return;

        appendMessage('user', `Generating image: ${prompt}...`);

        try {
            const response = await fetch('https://api.openai.com/v1/images/generations', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                body: JSON.stringify({ model: "dall-e-3", prompt: prompt, n: 1 })
            });
            const data = await response.json();
            const imgUrl = data.data[0].url;
            appendMessage('ai', `<img src="${imgUrl}">`);
        } catch (err) {
            appendMessage('ai', "Image Error: " + err.message);
        }
    }

    function handleFileUpload(event) {
        const file = event.target.files[0];
        const reader = new FileReader();
        reader.onload = (e) => {
            attachedFileBase64 = e.target.result;
            appendMessage('user', `[File Attached: ${file.name}]`);
        };
        reader.readAsDataURL(file);
    }

    function appendMessage(role, text) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${role}-msg`;
        msgDiv.innerHTML = marked.parse(text);
        document.getElementById('messages').appendChild(msgDiv);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    }

    function copyCanvas() {
        const content = document.getElementById('canvas-content').textContent;
        navigator.clipboard.writeText(content);
        alert("Copied to clipboard!");
    }
</script>

</body>
</html>
