<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MasterAI | Auto-Switch</title>
<style>
    /* --- CSS RESET & BASICS --- */
    body { background: #050505; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
    * { box-sizing: border-box; }

    /* --- HEADER --- */
    .header { 
        padding: 15px 20px; 
        background: linear-gradient(135deg, #1a0b2e 0%, #2d0055 100%); 
        border-bottom: 1px solid #3c096c; 
        display: flex; justify-content: space-between; align-items: center;
        box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }
    .title { font-weight: bold; font-size: 18px; letter-spacing: 1px; color: #fff; }
    .status { font-size: 11px; background: rgba(0,0,0,0.3); padding: 4px 8px; border-radius: 4px; color: #d0d0d0; border: 1px solid #444; }

    /* --- CHAT AREA --- */
    #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; scroll-behavior: smooth; }
    
    .msg { padding: 12px 16px; border-radius: 8px; max-width: 85%; line-height: 1.5; font-size: 15px; word-wrap: break-word; }
    .user { align-self: flex-end; background: linear-gradient(to right, #6200ea, #7c4dff); color: white; border-bottom-right-radius: 2px; }
    .ai { align-self: flex-start; background: #1a1a20; border: 1px solid #333; border-bottom-left-radius: 2px; }
    .system { align-self: center; font-size: 12px; color: #666; font-style: italic; }
    
    /* --- IMAGES --- */
    img { max-width: 100%; border-radius: 8px; margin-top: 10px; border: 1px solid #444; }

    /* --- INPUT AREA --- */
    form { display: flex; padding: 20px; background: #0f0f12; gap: 10px; border-top: 1px solid #222; }
    input { flex: 1; padding: 14px; border-radius: 8px; border: 1px solid #333; background: #18181b; color: white; outline: none; transition: 0.2s; }
    input:focus { border-color: #7c4dff; background: #202025; }
    
    button { 
        padding: 0 25px; background: #7c4dff; color: white; border: none; border-radius: 8px; 
        font-weight: bold; cursor: pointer; transition: 0.2s; text-transform: uppercase; font-size: 13px;
    }
    button:hover { background: #9965f4; box-shadow: 0 0 10px rgba(124, 77, 255, 0.4); }
    button:disabled { background: #333; color: #777; cursor: not-allowed; box-shadow: none; }
    
    /* SCROLLBAR */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
    ::-webkit-scrollbar-track { background: #000; }
</style>
</head>
<body>

<div class="header">
    <div class="title">MASTER AI</div>
    <div class="status" id="modelStatus">Ready</div>
</div>

<div id="chat">
    <div class="msg ai">
        System Online.<br>
        I will attempt to use <b>Gemini 2.0 Flash</b>. If it hits a limit, I will auto-switch to <b>1.5 Flash</b> to keep chatting.
    </div>
</div>

<form id="form">
    <input id="input" placeholder="Enter command..." autocomplete="off">
    <button id="btn">SEND</button>
</form>

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>

<script>
    const KEY = "AIzaSyCzpkJytXuVCNanzTM6opB9zTaV-DFpBgo";
    
    // Priority List: Try first, fail to second
    const MODELS = ["gemini-2.0-flash", "gemini-1.5-flash", "gemini-1.5-pro"];
    
    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const btn = document.getElementById("btn");
    const statusDiv = document.getElementById("modelStatus");

    document.getElementById("form").onsubmit = async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        addMsg(text, "user");
        input.value = "";
        btn.disabled = true;
        btn.innerText = "PROCESSING...";

        try {
            // 1. IMAGE CHECK
            if (text.toLowerCase().startsWith("draw") || text.toLowerCase().startsWith("generate")) {
                await generateImage(text);
            } 
            // 2. TEXT GENERATION (With Fallback)
            else {
                await generateTextWithFallback(text);
            }
        } catch (err) {
            addMsg("❌ Fatal Error: " + err.message, "ai");
        }

        btn.disabled = false;
        btn.innerText = "SEND";
        input.focus();
    };

    // --- SMART TEXT GENERATION ---
    async function generateTextWithFallback(prompt) {
        let lastError = null;

        // Loop through our model list
        for (const model of MODELS) {
            try {
                statusDiv.innerText = `Trying: ${model}...`;
                console.log(`Attempting connection to ${model}...`);
                
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error?.message || response.statusText);
                }

                const data = await response.json();
                const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text;
                
                if (!aiText) throw new Error("Empty response");

                // If success:
                addMsg(marked.parse(aiText), "ai");
                statusDiv.innerText = `Connected: ${model}`;
                statusDiv.style.color = "#4caf50"; // Green for success
                return; // Stop the loop, we are done!

            } catch (err) {
                console.warn(`${model} failed:`, err.message);
                lastError = err;
                // If it's a "Not Found" (404) or "Limit" (429) error, we continue loop to next model.
                // We add a tiny system message so user knows we are switching.
                addMsg(`⚠️ ${model} limit reached. Switching protocols...`, "system");
            }
        }

        // If loop finishes and nothing worked:
        throw new Error(`All models failed. Last error: ${lastError.message}`);
    }

    // --- IMAGE GENERATION ---
    async function generateImage(prompt) {
        statusDiv.innerText = "Generating Visual...";
        const loadMsg = addMsg("🎨 Rendering image...", "ai");
        
        try {
            const cleanPrompt = encodeURIComponent(prompt);
            const imgUrl = `https://image.pollinations.ai/prompt/${cleanPrompt}?nologo=true`;
            
            const img = new Image();
            img.src = imgUrl;
            
            await new Promise((resolve, reject) => {
                img.onload = resolve;
                img.onerror = reject;
            });

            loadMsg.innerHTML = "";
            loadMsg.appendChild(img);
            statusDiv.innerText = "Visual Ready";
        } catch (e) {
            loadMsg.innerHTML = "❌ Image generation failed.";
        }
    }

    // --- UTILS ---
    function addMsg(html, role) {
        const div = document.createElement("div");
        div.className = `msg ${role}`;
        div.innerHTML = html;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }
</script>

</body>
</html>
