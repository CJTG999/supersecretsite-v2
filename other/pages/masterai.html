<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MasterAI 2.0</title>
<style>
    body { background: #0f0f12; color: #e0e0e0; font-family: 'Segoe UI', sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
    
    /* Purple Gradient Header */
    .header { 
        padding: 15px 20px; 
        background: linear-gradient(90deg, #240046 0%, #5a189a 100%); 
        border-bottom: 1px solid #3c096c; 
        font-weight: bold; 
        letter-spacing: 1px;
        display: flex; justify-content: space-between; align-items: center;
    }
    .badge { font-size: 10px; background: #e0aaff; color: #240046; padding: 2px 6px; border-radius: 4px; }

    #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    
    /* Messages */
    .msg { padding: 12px 16px; border-radius: 8px; max-width: 85%; line-height: 1.5; font-size: 15px; }
    .user { align-self: flex-end; background: #7b2cbf; color: white; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .ai { align-self: flex-start; background: #242430; border: 1px solid #3c3c4f; }
    .error { background: #5a1a1a; color: #ffadad; border: 1px solid #800; align-self: center; text-align: center; }
    
    img { max-width: 100%; border-radius: 8px; margin-top: 10px; border: 1px solid #3c3c4f; }
    
    /* Input Area */
    form { display: flex; padding: 20px; background: #18181b; gap: 10px; border-top: 1px solid #2a2a35; }
    input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #3c3c4f; background: #0f0f12; color: white; outline: none; transition: 0.2s; }
    input:focus { border-color: #9d4edd; }
    button { padding: 0 25px; background: #9d4edd; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:hover { background: #c77dff; }
    button:disabled { background: #3c3c4f; cursor: wait; }
</style>
</head>
<body>

<div class="header">
    MASTER AI 
    <span class="badge">GEMINI 2.0 FLASH</span>
</div>

<div id="chat">
    <div class="msg ai">System Online. Running on Gemini 2.0 Flash.</div>
</div>

<form id="form">
    <input id="input" placeholder="Type a message..." autocomplete="off">
    <button id="btn">SEND</button>
</form>

<script type="module">
    import { marked } from "https://esm.run/marked";

    // ✅ CONFIGURATION
    const KEY = "AIzaSyCzpkJytXuVCNanzTM6opB9zTaV-DFpBgo";
    const MODEL = "gemini-2.0-flash"; 

    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const btn = document.getElementById("btn");

    document.getElementById("form").onsubmit = async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        addMsg(text, "user");
        input.value = "";
        btn.disabled = true;
        btn.innerText = "...";

        try {
            // 1. IMAGE CHECK (Pollinations)
            if (text.toLowerCase().startsWith("draw") || text.toLowerCase().startsWith("generate")) {
                const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(text)}?nologo=true`;
                const img = new Image();
                img.src = imgUrl;
                await new Promise((resolve, reject) => {
                    img.onload = resolve;
                    img.onerror = reject;
                });
                const div = addMsg("Generated Image:", "ai");
                div.appendChild(img);
            } 
            // 2. TEXT GEN (Gemini 2.0)
            else {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text }] }] })
                });

                if (!response.ok) {
                    if (response.status === 429) throw new Error("Quota Exceeded. Please wait 1 minute.");
                    const errData = await response.json();
                    throw new Error(errData.error?.message || response.statusText);
                }

                const data = await response.json();
                const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response.";
                
                const msgDiv = addMsg("", "ai");
                msgDiv.innerHTML = marked.parse(aiText);
            }
        } catch (err) {
            addMsg("⚠️ Error: " + err.message, "error");
        }

        btn.disabled = false;
        btn.innerText = "SEND";
        chat.scrollTop = chat.scrollHeight;
    };

    function addMsg(html, role) {
        const div = document.createElement("div");
        div.className = `msg ${role}`;
        div.innerHTML = html;
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }
</script>

</body>
</html>
