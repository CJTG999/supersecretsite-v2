<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MasterAI - Personal AI Assistant</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>

<link id="dynamic-favicon" rel="icon" href="other/pages/images/mai.png">

<style>
    :root {
        --bg-body: #09090b;
        --bg-sidebar: #121214;
        --bg-input: #18181b;
        --bg-msg-user: #2e1065;
        --bg-msg-ai: transparent;
        --text-main: #e4e4e7;
        --text-sec: #a1a1aa;
        --accent: #8b5cf6;
        --border: #27272a;
    }

    * { box-sizing: border-box; }
    body { margin: 0; background: var(--bg-body); color: var(--text-main); font-family: 'Segoe UI', Roboto, sans-serif; display: flex; height: 100vh; overflow: hidden; }

    /* --- SIDEBAR --- */
    .sidebar { width: 260px; background: var(--bg-sidebar); display: flex; flex-direction: column; padding: 16px; border-right: 1px solid var(--border); transition: 0.3s; z-index: 10; }
    .sidebar.collapsed { margin-left: -260px; }
    
    .new-chat-btn {
        background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer;
        display: flex; align-items: center; gap: 10px; font-weight: 600; margin-bottom: 20px;
    }
    .new-chat-btn:hover { opacity: 0.9; }

    .history-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 4px; }
    .history-item { padding: 10px; border-radius: 6px; cursor: pointer; font-size: 13px; color: var(--text-sec); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .history-item:hover { background: #27272a; color: white; }
    .history-item.active { background: #27272a; color: white; border-left: 3px solid var(--accent); }

    .bottom-menu { margin-top: auto; padding-top: 15px; border-top: 1px solid var(--border); display: flex; flex-direction: column; gap: 5px; }
    .menu-item { padding: 10px; cursor: pointer; border-radius: 6px; color: var(--text-sec); font-size: 13px; display: flex; gap: 10px; align-items: center; }
    .menu-item:hover { background: #27272a; color: white; }

    /* --- MAIN --- */
    .main { flex: 1; display: flex; flex-direction: column; position: relative; }
    
    .top-bar { padding: 15px 24px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid var(--border); background: var(--bg-body); }
    .menu-toggle { cursor: pointer; color: var(--text-sec); margin-right: 15px; }
    .model-badge { font-size: 10px; background: #2e1065; border: 1px solid #5b21b6; padding: 4px 8px; border-radius: 12px; color: #ddd6fe; }

    .chat-container { flex: 1; overflow-y: auto; padding: 20px 15%; display: flex; flex-direction: column; gap: 24px; scroll-behavior: smooth; }
    
    .msg-row { display: flex; gap: 16px; animation: fadeIn 0.3s ease; }
    .msg-row.user { justify-content: flex-end; }
    
    .avatar { width: 32px; height: 32px; border-radius: 6px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .ai-avatar { background: linear-gradient(135deg, #8b5cf6, #d946ef); }

    .msg-bubble { max-width: 85%; line-height: 1.6; font-size: 15px; }
    .msg-row.user .msg-bubble { background: var(--bg-msg-user); padding: 12px 18px; border-radius: 12px; color: white; }
    
    /* Input Area */
    .input-container { padding: 24px 15%; background: var(--bg-body); }
    .input-box { background: var(--bg-input); border-radius: 12px; padding: 10px 16px; display: flex; align-items: flex-end; gap: 12px; border: 1px solid var(--border); }
    .input-box:focus-within { border-color: var(--accent); }
    textarea { flex: 1; background: transparent; border: none; color: white; padding: 8px 0; font-size: 15px; outline: none; resize: none; max-height: 150px; font-family: inherit; }
    .send-btn { background: var(--accent); border: none; color: white; cursor: pointer; width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; }
    .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* Markdown & Code */
    pre { background: #18181b; padding: 16px; border-radius: 8px; overflow-x: auto; border: 1px solid var(--border); margin: 10px 0; }
    code { font-family: 'Consolas', monospace; font-size: 13px; color: #a5b4fc; }
    
    @media (max-width: 768px) { .sidebar { position: absolute; height: 100%; } .chat-container, .input-container { padding: 20px 5%; } }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
</style>
</head>
<body>

<div class="sidebar" id="sidebar">
    <button class="new-chat-btn" onclick="startNewChat()">
        <i class="fa-solid fa-plus"></i> New Chat
    </button>
    <div class="history-list" id="historyList"></div>
    <div class="bottom-menu">
        <div class="menu-item" onclick="clearAllData()"><i class="fa-solid fa-trash"></i> Clear History</div>
    </div>
</div>

<div class="main">
    <div class="top-bar">
        <div style="display:flex; align-items:center;">
            <div class="menu-toggle" onclick="toggleSidebar()"><i class="fa-solid fa-bars"></i></div>
            <span style="font-weight:600;">MasterAI</span>
        </div>
        <span class="model-badge" id="modelBadge">Llama 3.1</span>
    </div>

    <div class="chat-container" id="chatContainer"></div>

    <div class="input-container">
        <div class="input-box">
            <textarea id="userInput" rows="1" placeholder="Message MasterAI..." autocomplete="off"></textarea>
            <button class="send-btn" id="sendBtn"><i class="fa-solid fa-arrow-up"></i></button>
        </div>
    </div>
</div>

<script>
    let chats = JSON.parse(localStorage.getItem("masterai_chats")) || [];
    let currentChatId = null;

    const chatContainer = document.getElementById("chatContainer");
    const userInput = document.getElementById("userInput");
    const sendBtn = document.getElementById("sendBtn");
    const modelBadge = document.getElementById("modelBadge");

    // --- INIT ---
    window.onload = () => {
        renderHistory();
        if (chats.length > 0) loadChat(chats[0].id);
        else startNewChat();
        
        userInput.addEventListener("input", function() { 
            this.style.height = 0; 
            this.style.height = (this.scrollHeight) + "px"; 
        });
    };

    userInput.addEventListener("keydown", (e) => { 
        if(e.key === "Enter" && !e.shiftKey) { 
            e.preventDefault(); 
            handleSend(); 
        } 
    });
    
    sendBtn.addEventListener("click", handleSend);

    async function handleSend() {
        const text = userInput.value.trim();
        if(!text) return;

        // UI Update: User Message
        addMessageToUI(text, "user");
        saveMessage(text, "user");
        userInput.value = "";
        userInput.style.height = "auto";
        
        const currentChat = chats.find(c => c.id === currentChatId);
        if (currentChat && currentChat.messages.length === 1 && currentChat.title === "New Chat") {
            currentChat.title = text.substring(0, 30);
            saveChats();
            renderHistory();
        }

        // UI Update: Prepare AI Bubble for Streaming
        const aiRow = document.createElement("div");
        aiRow.className = "msg-row ai";
        aiRow.innerHTML = `
            <div class="avatar ai-avatar"><i class="fa-solid fa-robot"></i></div>
            <div class="msg-bubble">...</div>
        `;
        chatContainer.appendChild(aiRow);
        const bubble = aiRow.querySelector(".msg-bubble");
        
        setLoadingState(true);

        try {
            // Note: This endpoint '/api/chat' must be handled by your Cloudflare Worker
            const response = await fetch('/api/chat', {
                method: "POST",
                body: JSON.stringify({ prompt: text }),
                headers: { "Content-Type": "application/json" }
            });

            if (!response.ok) throw new Error("Connection failed");

            // --- STREAMING READER ---
            const reader = response.body.getReader();
            const decoder = new TextDecoder();
            let fullText = "";
            bubble.innerText = ""; // Clear the loading dots

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                const chunk = decoder.decode(value, { stream: true });
                const lines = chunk.split("\n");
                
                for (const line of lines) {
                    if (line.startsWith("data: ") && line !== "data: [DONE]") {
                        try {
                            const data = JSON.parse(line.replace("data: ", ""));
                            fullText += data.response;
                            // Re-render markdown as we stream
                            bubble.innerHTML = marked.parse(fullText);
                            chatContainer.scrollTop = chatContainer.scrollHeight;
                        } catch (e) { /* partial chunk */ }
                    }
                }
            }
            saveMessage(fullText, "ai");

        } catch (err) {
            bubble.innerText = "⚠️ Error: " + err.message;
        }

        setLoadingState(false);
    }

    // --- UI HELPERS ---
    function addMessageToUI(text, role) {
        const row = document.createElement("div");
        row.className = `msg-row ${role}`;
        const content = `
            ${role === 'ai' ? '<div class="avatar ai-avatar"><i class="fa-solid fa-robot"></i></div>' : ''}
            <div class="msg-bubble">${role==='ai' ? marked.parse(text) : text}</div>
        `;
        row.innerHTML = content;
        chatContainer.appendChild(row);
        chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    function setLoadingState(loading) {
        sendBtn.disabled = loading;
        userInput.disabled = loading;
        if(!loading) userInput.focus();
    }

    // --- DATA MANAGEMENT ---
    function startNewChat() {
        currentChatId = Date.now().toString();
        chats.unshift({ id: currentChatId, title: "New Chat", messages: [] });
        saveChats();
        renderHistory();
        chatContainer.innerHTML = '';
        addMessageToUI("<b>MasterAI v3.1 (Llama) Online.</b><br>How can I help you today?", "ai");
    }

    function loadChat(id) {
        currentChatId = id;
        const chat = chats.find(c => c.id === id);
        chatContainer.innerHTML = '';
        if(chat) {
            chat.messages.forEach(msg => addMessageToUI(msg.text, msg.role));
        }
        renderHistory();
        if(window.innerWidth < 768) toggleSidebar();
    }

    function saveMessage(text, role) {
        const chat = chats.find(c => c.id === currentChatId);
        if(chat) { chat.messages.push({ role, text }); saveChats(); }
    }

    function saveChats() { localStorage.setItem("masterai_chats", JSON.stringify(chats)); }

    function renderHistory() {
        const list = document.getElementById("historyList");
        list.innerHTML = "";
        chats.forEach(chat => {
            const item = document.createElement("div");
            item.className = `history-item ${chat.id === currentChatId ? 'active' : ''}`;
            item.innerText = chat.title || "New Chat";
            item.onclick = () => loadChat(chat.id);
            list.appendChild(item);
        });
    }

    function clearAllData() {
        if(confirm("Delete all history?")) { 
            localStorage.removeItem("masterai_chats"); 
            chats = []; 
            startNewChat(); 
        }
    }

    function toggleSidebar() { document.getElementById("sidebar").classList.toggle("collapsed"); }
</script>
</body>
</html>
