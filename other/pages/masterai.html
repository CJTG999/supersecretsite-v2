<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MasterAI Lite</title>
<style>
    body { background: #121212; color: #e0e0e0; font-family: sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
    .header { padding: 15px; background: #1e1e1e; border-bottom: 1px solid #333; font-weight: bold; color: #bb86fc; }
    #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .msg { padding: 10px 15px; border-radius: 8px; max-width: 800px; line-height: 1.5; }
    .user { align-self: flex-end; background: #3700b3; color: white; }
    .ai { align-self: flex-start; background: #1e1e1e; border: 1px solid #333; }
    .error { background: #cf6679; color: black; align-self: center; }
    img { max-width: 100%; border-radius: 8px; margin-top: 10px; }
    form { display: flex; padding: 15px; background: #1e1e1e; gap: 10px; border-top: 1px solid #333; }
    input { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #333; background: #2c2c2c; color: white; }
    button { padding: 10px 20px; background: #bb86fc; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.5; }
</style>
</head>
<body>

<div class="header">MASTER AI <span style="font-size:0.8em; color:#888;">LITE</span></div>
<div id="chat"></div>
<form id="form">
    <input id="input" placeholder="Type a message..." autocomplete="off">
    <button id="btn">SEND</button>
</form>

<script type="module">
    import { marked } from "https://esm.run/marked";

    // ✅ FIXED MODEL & KEY
    const KEY = "AIzaSyCzpkJytXuVCNanzTM6opB9zTaV-DFpBgo";
    const MODEL = "gemini-1.5-flash"; 

    const chat = document.getElementById("chat");
    const input = document.getElementById("input");
    const btn = document.getElementById("btn");

    document.getElementById("form").onsubmit = async (e) => {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;

        addMsg(text, "user");
        input.value = "";
        btn.disabled = true;
        btn.innerText = "...";

        try {
            // IMAGE GENERATION CHECK
            if (text.toLowerCase().startsWith("draw") || text.toLowerCase().startsWith("generate")) {
                const imgUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(text)}?nologo=true`;
                const img = new Image();
                img.src = imgUrl;
                await new Promise(r => img.onload = r); // Wait for load
                const div = addMsg("Generated Image:", "ai");
                div.appendChild(img);
            } 
            // TEXT GENERATION (GEMINI)
            else {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${KEY}`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ contents: [{ parts: [{ text }] }] })
                });

                const data = await response.json();
                
                if (data.error) throw new Error(data.error.message);
                const aiText = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response.";
                
                const msgDiv = addMsg("", "ai");
                msgDiv.innerHTML = marked.parse(aiText);
            }
        } catch (err) {
            addMsg("Error: " + err.message, "error");
        }

        btn.disabled = false;
        btn.innerText = "SEND";
        chat.scrollTop = chat.scrollHeight;
    };

    function addMsg(html, role) {
        const div = document.createElement("div");
        div.className = `msg ${role}`;
        div.innerHTML = html; // Warning: InnerHTML used for simplicity
        chat.appendChild(div);
        chat.scrollTop = chat.scrollHeight;
        return div;
    }
</script>

</body>
</html>
