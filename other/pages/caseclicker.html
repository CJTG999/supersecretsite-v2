<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Caseoh Clicker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bangers&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: #1a1a1a url('https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQF2oc8GCaSIfnY2Oy2Eq12kV0BxS7pNPTIbw&s');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        .bangers-font {
            font-family: 'Bangers', cursive;
        }
        .unselectable {
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        .floating-text {
            position: absolute;
            animation: float-up 1s ease-out forwards;
            pointer-events: none;
            font-size: 2rem;
            font-weight: bold;
            color: white;
            text-shadow: 2px 2px 4px black;
        }
        @keyframes float-up {
            from {
                opacity: 1;
                transform: translateY(0);
            }
            to {
                opacity: 0;
                transform: translateY(-80px);
            }
        }
        .upgrade-button:disabled {
            cursor: not-allowed;
            filter: grayscale(80%);
        }
        #caseoh-image {
             transition: transform 0.1s ease;
        }
        #caseoh-image:active {
            transform: scale(0.95);
        }
        .clue-highlight {
            color: #facc15; /* Tailwind's yellow-400 */
            font-weight: 600;
        }
    </style>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen p-4 unselectable">

    <div class="w-full max-w-4xl mx-auto grid grid-cols-1 lg:grid-cols-3 gap-8">

        <!-- Left Column: The Clicker -->
        <div class="lg:col-span-2 bg-gray-800/50 backdrop-blur-sm rounded-2xl shadow-2xl p-6 md:p-8 flex flex-col items-center justify-center border-4 border-yellow-500 relative">
            <div id="message-display" class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 bg-green-500 text-white p-4 rounded-lg shadow-lg text-2xl font-bold opacity-0 transition-opacity duration-500 pointer-events-none z-50"></div>
            <h1 class="bangers-font text-5xl md:text-7xl text-yellow-400 text-center tracking-wider" style="text-shadow: 4px 4px 0 #000;">CASEOH CLICKER</h1>
            <p id="clue-display" class="text-gray-300 mb-4 text-center italic"></p>

            <div class="my-6 text-center">
                <h2 id="burgers-display" class="bangers-font text-6xl md:text-8xl tracking-wider">0</h2>
                <p class="text-gray-400 font-semibold">Burgers</p>
                <p id="bps-display" class="text-yellow-400 mt-2">0 burgers per second</p>
            </div>
            
            <div id="click-area" class="relative flex items-center justify-center h-64 w-64">
                <img id="caseoh-image" src="https://encrypted-tbn1.gstatic.com/images?q=tbn:ANd9GcSdjymjJGSwNlSmhri0rZ3r4RQxkp4Fg_R7ZDjRmKKVmFhQBAyEFqiLj0qsm8fcxqQ07Y7-SbJgQfLtqBF0SDhadoxqHiUAj68-4seKgha0UQ" alt="Click Caseoh!" class="cursor-pointer rounded-full w-48 h-48 md:w-64 md:h-64 object-cover border-8 border-yellow-500 shadow-lg hover:animate-pulse">
            </div>
        </div>

        <!-- Right Column: Upgrades & Rebirth -->
        <div class="bg-gray-800/50 backdrop-blur-sm rounded-2xl shadow-2xl p-6 md:p-8 border-4 border-gray-700">
            <h3 class="bangers-font text-4xl text-center mb-6 text-yellow-400 tracking-wider" style="text-shadow: 2px 2px 0 #000;">Upgrades</h3>
            <div id="upgrades-container" class="space-y-3 overflow-y-auto max-h-[55vh] pr-2">
                <!-- Upgrades will be dynamically inserted here -->
            </div>
             <!-- Rebirth Section -->
            <div id="rebirth-section" class="mt-6 text-center border-t-2 border-gray-700 pt-4">
                <!-- Rebirth info will be injected here -->
            </div>
        </div>
    </div>

     <!-- Cheat Code Modal -->
    <div id="cheat-modal" class="hidden fixed inset-0 bg-black bg-opacity-75 flex items-center justify-center z-50">
        <div class="bg-gray-800 p-8 rounded-lg shadow-xl border-2 border-yellow-500 w-full max-w-sm">
            <h3 class="bangers-font text-3xl text-yellow-400 mb-4 text-center">Enter Cheat Code</h3>
            <input id="cheat-input" type="text" class="w-full bg-gray-900 text-white p-2 rounded mb-4 border border-gray-600 focus:outline-none focus:ring-2 focus:ring-yellow-500" placeholder="Code...">
            <div class="flex justify-end space-x-2">
                 <button id="cheat-cancel" class="px-4 py-2 bg-gray-600 rounded hover:bg-gray-500 font-semibold">Cancel</button>
                <button id="cheat-submit" class="px-4 py-2 bg-yellow-500 text-black rounded hover:bg-yellow-400 font-semibold">Submit</button>
            </div>
        </div>
    </div>
    
    <!-- Free Rebirth Claim Button -->
    <button id="free-rebirth-claim-button" class="hidden fixed bottom-5 right-5 bg-gradient-to-br from-purple-600 to-blue-500 text-white font-bold py-3 px-6 rounded-full shadow-lg transform hover:scale-105 transition-transform duration-300 z-50">
        ✨ Claim Free Rebirth ✨
    </button>

    <!-- Save/Load Buttons -->
    <div class="fixed bottom-5 left-5 flex space-x-2 z-50">
        <button id="export-save-button" class="bg-blue-600 text-white font-bold py-2 px-4 rounded-lg shadow-lg hover:bg-blue-500 transition-colors">Export Save</button>
        <button id="import-save-button" class="bg-green-600 text-white font-bold py-2 px-4 rounded-lg shadow-lg hover:bg-green-500 transition-colors">Import Save</button>
    </div>


    <script>
        const burgersDisplay = document.getElementById('burgers-display');
        const bpsDisplay = document.getElementById('bps-display');
        const caseohImage = document.getElementById('caseoh-image');
        const upgradesContainer = document.getElementById('upgrades-container');
        const rebirthSection = document.getElementById('rebirth-section');
        const messageDisplay = document.getElementById('message-display');
        const clueDisplay = document.getElementById('clue-display');
        
        const cheatModal = document.getElementById('cheat-modal');
        const cheatInput = document.getElementById('cheat-input');
        const cheatSubmit = document.getElementById('cheat-submit');
        const cheatCancel = document.getElementById('cheat-cancel');
        const freeRebirthClaimButton = document.getElementById('free-rebirth-claim-button');
        const exportSaveButton = document.getElementById('export-save-button');
        const importSaveButton = document.getElementById('import-save-button');


        let burgers = 0;
        let burgersPerClick = 1;
        let burgersPerSecond = 0;
        let rebirths = 0;
        let rebirthMultiplier = 1;
        const rebirthCost = 1000000;
        
        const usedCheats = new Set();
        let freeRebirthAwarded = false;
        let currentClueIndex = 0;

        const cheatCodes = [
            { 
                clue: `"They say I'm built like a <span class='clue-highlight'>1x1 lego piece</span>."`, 
                code: "1x1 lego piece",
                reward: () => {
                    burgersPerSecond *= 2;
                    showTemporaryMessage("BPS Doubled!");
                }
            },
            {
                clue: `"My favorite place to eat is the <span class='clue-highlight'>Waffle House</span>."`,
                code: "waffle house",
                reward: () => {
                    burgers += 15000;
                    showTemporaryMessage("+15K Burgers!");
                }
            },
            {
                clue: `"A sweet treat from the <span class='clue-highlight'>Cheesecake Factory</span>."`,
                code: "cheesecake factory",
                reward: () => {
                    burgersPerClick *= 2;
                    showTemporaryMessage("BPC Doubled!");
                }
            },
            {
                clue: `"My favorite anime is <span class='clue-highlight'>Jujutsu Kaisen</span>."`,
                code: "jujutsu kaisen",
                reward: () => {
                    burgers += burgersPerSecond > 0 ? burgersPerSecond * 30 : 10000;
                    showTemporaryMessage("Domain Expansion!");
                }
            },
            {
                clue: `"What I say when I take your food... <span class='clue-highlight'>SQOYIA</span>!"`,
                code: "sqoyia",
                reward: () => {
                    burgers += 1000;
                    showTemporaryMessage("+1K Burgers!");
                }
            },
            {
                clue: `"What happens if you're not careful in chat... <span class='clue-highlight'>BANNED</span>!"`,
                code: "banned",
                reward: () => {
                    burgersPerClick += 10;
                    showTemporaryMessage("+10 BPC!");
                }
            },
            {
                clue: `"Sometimes chat says I look like a <span class='clue-highlight'>galaxy</span>."`,
                code: "galaxy",
                reward: () => {
                    burgers += 50000;
                    showTemporaryMessage("+50K Burgers!");
                }
            },
            {
                clue: `"My arms are kinda short, like a <span class='clue-highlight'>T-Rex</span>."`,
                code: "t-rex",
                reward: () => {
                    burgersPerClick = Math.ceil(burgersPerClick * 1.5);
                    showTemporaryMessage("BPC Boost!");
                }
            },
            {
                clue: `"You need to be a <span class='clue-highlight'>certified forklift driver</span> to move me."`,
                code: "certified forklift driver",
                reward: () => {
                    burgersPerSecond = Math.ceil(burgersPerSecond * 1.25);
                    showTemporaryMessage("BPS Boost!");
                }
            },
            {
                clue: `"What majestic bird do I resemble? A <span class='clue-highlight'>bald eagle</span>."`,
                code: "bald eagle",
                reward: () => {
                    burgers += 25000;
                    showTemporaryMessage("+25K Burgers!");
                }
            },
            {
                clue: `"I have a strong opinion about <span class='clue-highlight'>e-daters</span> in my chat."`,
                code: "e-daters",
                reward: () => {
                    burgersPerSecond += 100;
                    showTemporaryMessage("+100 BPS!");
                }
            },
            {
                clue: `"My family-friendly catchphrase is <span class='clue-highlight'>what the flip</span>!"`,
                code: "what the flip",
                reward: () => {
                    burgersPerClick += 25;
                    showTemporaryMessage("+25 BPC!");
                }
            },
            {
                clue: `"My brother's name is <span class='clue-highlight'>Dean</span>."`,
                code: "dean",
                reward: () => {
                    burgers += 5000;
                    showTemporaryMessage("+5K Burgers!");
                }
            },
            {
                code: "devcode",
                reward: () => {
                    // Apply every other cheat code's effect only once
                    cheatCodes.forEach(cheat => {
                        if (cheat.code !== 'devcode' && !usedCheats.has(cheat.code)) {
                            cheat.reward(); // Apply the reward directly
                            usedCheats.add(cheat.code);
                        }
                    });

                    // Award the free rebirth if it hasn't been already
                    if (!freeRebirthAwarded) {
                        freeRebirthAwarded = true;
                        freeRebirthClaimButton.classList.remove('hidden');
                    }
                    
                    showTemporaryMessage("DEV MODE ACTIVATED!");
                    updateDisplay();
                }
            }
        ];

        // Filter out hidden codes for the clue display
        const visibleClues = cheatCodes.filter(c => c.clue);

        let upgrades = [
            { id: 0, name: "Jujutsu-Sized Soda", cost: 15, bps: 0, bpc: 1, count: 0, baseCost: 15 },
            { id: 1, name: "1x1 Lego Piece", cost: 100, bps: 1, bpc: 0, count: 0, baseCost: 100 },
            { id: 2, name: "Bigger Plate", cost: 550, bps: 5, bpc: 0, count: 0, baseCost: 550 },
            { id: 3, name: "Industrial Deep Fryer", cost: 3000, bps: 25, bpc: 0, count: 0, baseCost: 3000 },
            { id: 4, name: "Waffle House Franchise", cost: 15000, bps: 120, bpc: 0, count: 0, baseCost: 15000 },
            { id: 5, name: "Cheesecake Factory Deed", cost: 100000, bps: 800, bpc: 0, count: 0, baseCost: 100000 },
            { id: 6, name: "Gravitational Anomaly", cost: 1000000, bps: 5000, bpc: 0, count: 0, baseCost: 1000000 },
            { id: 7, name: "Certified Forklift Fleet", cost: 8500000, bps: 30000, bpc: 0, count: 0, baseCost: 8500000 },
            { id: 8, name: "Global Burger Conglomerate", cost: 50000000, bps: 180000, bpc: 0, count: 0, baseCost: 50000000 },
            { id: 9, name: "Burger Asteroid Belt", cost: 320000000, bps: 1000000, bpc: 0, count: 0, baseCost: 320000000 },
            { id: 10, name: "Snack Hole Singularity", cost: 2500000000, bps: 7500000, bpc: 0, count: 0, baseCost: 2500000000 },
        ];
        
        function formatNumber(num) {
            if (num < 1000) return num.toFixed(0);
            if (num < 1000000) return (num / 1000).toFixed(1) + 'K';
            if (num < 1000000000) return (num / 1000000).toFixed(1) + 'M';
            if (num < 1000000000000) return (num / 1000000000).toFixed(1) + 'B';
            return (num / 1000000000000).toFixed(1) + 'T';
        }

        function clickCaseoh(event) {
            burgers += burgersPerClick;
            updateDisplay();
            createFloatingText(event.clientX, event.clientY);
        }

        function createFloatingText(x, y) {
            const text = document.createElement('div');
            text.textContent = `+${formatNumber(burgersPerClick)}`;
            text.className = 'floating-text unselectable';
            text.style.left = `${x - text.clientWidth / 2}px`;
            text.style.top = `${y - text.clientHeight / 2}px`;
            document.body.appendChild(text);
            setTimeout(() => text.remove(), 1000);
        }

        function buyUpgrade(upgradeId) {
            const upgrade = upgrades.find(u => u.id === upgradeId);
            if (burgers >= upgrade.cost) {
                burgers -= upgrade.cost;
                upgrade.count++;
                burgersPerSecond += (upgrade.bps * rebirthMultiplier);
                burgersPerClick += (upgrade.bpc * rebirthMultiplier);
                upgrade.cost = Math.ceil(upgrade.baseCost * Math.pow(1.15, upgrade.count));
                updateDisplay();
                renderUpgrades();
            }
        }

        function performRebirth() {
            if (burgers >= rebirthCost) {
                burgers = 0;
                burgersPerClick = 1;
                burgersPerSecond = 0;
                rebirths++;
                rebirthMultiplier = Math.pow(2, rebirths);
                upgrades.forEach(u => {
                    u.count = 0;
                    u.cost = u.baseCost;
                });
                updateDisplay();
                renderUpgrades();
                renderRebirthInfo();
            }
        }
        
        function handleCheatCode() {
            const enteredCode = cheatInput.value.trim().toLowerCase();
            const cheat = cheatCodes.find(c => c.code === enteredCode);

            if (cheat && !usedCheats.has(cheat.code)) {
                cheat.reward();
                // We only add non-dev codes to the "used" set for the purpose of unlocking the free rebirth
                if (cheat.code !== 'devcode') {
                    usedCheats.add(cheat.code);
                }

                // Check for free rebirth reward after a normal cheat is used
                const allNormalCheatsUsed = visibleClues.every(c => usedCheats.has(c.code));
                if (allNormalCheatsUsed && !freeRebirthAwarded) {
                    freeRebirthAwarded = true; // Mark it as awarded so this doesn't trigger again
                    freeRebirthClaimButton.classList.remove('hidden');
                    showTemporaryMessage("FREE REBIRTH UNLOCKED!");
                }

                updateDisplay();
            } else if (usedCheats.has(enteredCode)) {
                showTemporaryMessage("Cheat already used!", true);
            } else {
                showTemporaryMessage("Invalid Code", true);
            }
            cheatInput.value = '';
            cheatModal.classList.add('hidden');
        }

        function claimFreeRebirth() {
            rebirths++;
            rebirthMultiplier = Math.pow(2, rebirths);
            
            // Recalculate BPS and BPC with the new multiplier
            let baseBps = 0;
            let baseBpc = 1; // Start with the base click of 1
            upgrades.forEach(u => {
                baseBps += u.bps * u.count;
                baseBpc += u.bpc * u.count;
            });
            burgersPerSecond = baseBps * rebirthMultiplier;
            burgersPerClick = baseBpc * rebirthMultiplier;

            freeRebirthClaimButton.classList.add('hidden');
            showTemporaryMessage("Free Rebirth Claimed!");
            renderRebirthInfo();
            updateDisplay();
            renderUpgrades(); // Re-render upgrades to show new BPS/BPC values
        }
        
        function showTemporaryMessage(message, isError = false) {
            messageDisplay.textContent = message;
            messageDisplay.classList.remove('bg-green-500', 'bg-red-500', 'opacity-0');
            messageDisplay.classList.add(isError ? 'bg-red-500' : 'bg-green-500');
            setTimeout(() => messageDisplay.classList.add('opacity-0'), 2500);
        }

        function updateDisplay() {
            burgersDisplay.textContent = formatNumber(burgers);
            bpsDisplay.textContent = `${formatNumber(burgersPerSecond)} burgers per second`;
        }
        
        function renderUpgrades() {
            upgradesContainer.innerHTML = '';
            upgrades.forEach(upgrade => {
                const button = document.createElement('button');
                button.className = `upgrade-button w-full text-left p-3 rounded-lg border-2 transition-all duration-200 ${burgers >= upgrade.cost ? 'bg-yellow-500 border-yellow-400 text-gray-900 hover:bg-yellow-400' : 'bg-gray-700 border-gray-600 text-gray-400'}`;
                button.onclick = () => buyUpgrade(upgrade.id);
                button.disabled = burgers < upgrade.cost;

                let dynamicDescription = "+0";
                if (upgrade.bpc > 0) {
                    dynamicDescription = `+${formatNumber(upgrade.bpc * rebirthMultiplier)} Burger Per Click`;
                } else if (upgrade.bps > 0) {
                    dynamicDescription = `+${formatNumber(upgrade.bps * rebirthMultiplier)} BPS`;
                }

                button.innerHTML = `
                    <div class="flex justify-between items-center">
                        <div>
                            <p class="font-bold text-md">${upgrade.name} <span class="text-sm font-normal opacity-80">(${upgrade.count})</span></p>
                            <p class="text-xs opacity-90">${dynamicDescription}</p>
                        </div>
                        <p class="font-semibold text-lg">${formatNumber(upgrade.cost)}</p>
                    </div>
                `;
                upgradesContainer.appendChild(button);
            });
        }

        function renderRebirthInfo() {
            rebirthSection.innerHTML = ''; 
            const infoText = document.createElement('p');
            infoText.className = 'text-sm text-gray-400 mb-2';
            infoText.innerHTML = `Rebirths: <span class="font-bold text-yellow-400">${rebirths}</span><br>Burger Multiplier: <span class="font-bold text-yellow-400">${formatNumber(rebirthMultiplier)}x</span>`;
            rebirthSection.appendChild(infoText);

            const button = document.createElement('button');
            button.id = 'rebirth-button';
            button.className = `w-full p-3 rounded-lg border-2 transition-all duration-200 font-bold`;
            button.onclick = performRebirth;
            
            if (burgers >= rebirthCost) {
                button.disabled = false;
                button.className += ' bg-red-600 border-red-500 text-white hover:bg-red-500';
                button.innerHTML = `Rebirth!`;
            } else {
                button.disabled = true;
                button.className += ' bg-gray-700 border-gray-600 text-gray-400 cursor-not-allowed';
                button.innerHTML = `Reach ${formatNumber(rebirthCost)} burgers`;
            }
            rebirthSection.appendChild(button);
        }
        
        function setClue() {
            clueDisplay.innerHTML = visibleClues[currentClueIndex].clue;
        }

        function cycleClues() {
            currentClueIndex = (currentClueIndex + 1) % visibleClues.length;
            setClue();
        }

        function getSaveState() {
             return {
                burgers: burgers,
                rebirths: rebirths,
                upgrades: upgrades.map(u => ({ id: u.id, count: u.count})),
                usedCheats: Array.from(usedCheats),
                freeRebirthAwarded: freeRebirthAwarded,
            };
        }

        function exportSave() {
            const saveData = getSaveState();
            const saveString = JSON.stringify(saveData);
            const encodedSave = btoa(saveString);
            prompt("Here's your save code! Copy it to your clipboard:", encodedSave);
        }
        
        function calculateAllStats(data) {
            let bpc = 1;
            let bps = 0;
            const mult = Math.pow(2, data.rebirths);

            data.upgrades.forEach(savedUpgrade => {
                const gameUpgrade = upgrades.find(u => u.id === savedUpgrade.id);
                if(gameUpgrade) {
                    bpc += gameUpgrade.bpc * savedUpgrade.count;
                    bps += gameUpgrade.bps * savedUpgrade.count;
                }
            });
            
            bpc *= mult;
            bps *= mult;

            return { bpc, bps, mult};
        }

        function loadGameState(data) {
            burgers = data.burgers;
            rebirths = data.rebirths;
            freeRebirthAwarded = data.freeRebirthAwarded;
            
            upgrades.forEach(gameUpgrade => {
                const saved = data.upgrades.find(u => u.id === gameUpgrade.id);
                if (saved) {
                    gameUpgrade.count = saved.count;
                    gameUpgrade.cost = Math.ceil(gameUpgrade.baseCost * Math.pow(1.15, saved.count));
                } else {
                    gameUpgrade.count = 0;
                    gameUpgrade.cost = gameUpgrade.baseCost;
                }
            });

            usedCheats.clear();
            if(data.usedCheats) {
                data.usedCheats.forEach(cheat => usedCheats.add(cheat));
            }
            
            const stats = calculateAllStats(data);
            burgersPerClick = stats.bpc;
            burgersPerSecond = stats.bps;
            rebirthMultiplier = stats.mult;

            if (freeRebirthAwarded) {
                freeRebirthClaimButton.classList.remove('hidden');
            } else {
                freeRebirthClaimButton.classList.add('hidden');
            }

            updateDisplay();
            renderUpgrades();
            renderRebirthInfo();
        }


        function importSave() {
            const encodedSave = prompt("Please paste your save code here:");
            if (!encodedSave) return; 

            try {
                const saveString = atob(encodedSave);
                const saveData = JSON.parse(saveString);

                if (typeof saveData.burgers !== 'number' || !Array.isArray(saveData.upgrades) || typeof saveData.rebirths !== 'number') {
                    throw new Error("Invalid save data format.");
                }

                loadGameState(saveData);
                showTemporaryMessage("Save imported successfully!");

            } catch (error) {
                console.error("Failed to import save:", error);
                showTemporaryMessage("Invalid or corrupt save code!", true);
            }
        }


        function gameLoop() {
            burgers += burgersPerSecond / 10;
            updateDisplay();
            let needsRender = false;
            upgrades.forEach(upgrade => {
                const button = upgradesContainer.querySelector(`button:nth-child(${upgrade.id + 1})`);
                if (button) {
                     if((burgers >= upgrade.cost) !== !button.disabled) needsRender = true;
                }
            });
            if (needsRender) renderUpgrades();

            const rebirthButton = document.getElementById('rebirth-button');
            if (rebirthButton) {
                if ((burgers >= rebirthCost) !== !rebirthButton.disabled) renderRebirthInfo();
            }
        }
        
        // Event Listeners
        caseohImage.addEventListener('click', clickCaseoh);

        document.addEventListener('keydown', function(e) {
            if (!cheatModal.classList.contains('hidden')) return;
            if (e.code === 'Space') {
                e.preventDefault();
                const rect = caseohImage.getBoundingClientRect();
                const fakeEvent = { clientX: rect.left + (rect.width / 2), clientY: rect.top + (rect.height / 2) };
                clickCaseoh(fakeEvent);
                caseohImage.style.transform = 'scale(0.95)';
                setTimeout(() => { caseohImage.style.transform = 'scale(1)'; }, 100);
            }
        });
        
        document.addEventListener('keyup', function(e) {
             if (e.key.toLowerCase() === 'c' && document.activeElement.tagName.toLowerCase() !== 'input') {
                e.preventDefault();
                cheatModal.classList.remove('hidden');
                cheatInput.focus();
             }
        });
        
        cheatSubmit.addEventListener('click', handleCheatCode);
        cheatCancel.addEventListener('click', () => cheatModal.classList.add('hidden'));
        cheatInput.addEventListener('keyup', e => { if (e.key === 'Enter') handleCheatCode(); });
        freeRebirthClaimButton.addEventListener('click', claimFreeRebirth);
        exportSaveButton.addEventListener('click', exportSave);
        importSaveButton.addEventListener('click', importSave);
        
        // Initialize Game
        setClue();
        renderUpgrades();
        renderRebirthInfo();
        setInterval(gameLoop, 100);
        setInterval(cycleClues, 10000); // Change clue every 10 seconds

    </script>

</body>
</html>
