<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Website Page Snooper</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-beautify/1.14.7/beautify-html.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

    <style>
        body { font-family: 'Inter', sans-serif; }
        pre::-webkit-scrollbar { width: 8px; height: 8px; }
        pre::-webkit-scrollbar-track { background: #1f2937; }
        pre::-webkit-scrollbar-thumb { background: #4b5563; border-radius: 4px; }
        .loader {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3b82f6;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            display: none;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-gray-900 text-gray-200 min-h-screen p-4 md:p-8">

    <div class="max-w-6xl mx-auto">
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-4xl font-bold text-white mb-2">Website Page Snooper</h1>
            <p class="text-gray-400">Fetch, Beautify, and Inspect the HTML source code of any public website.</p>
        </header>

        <div class="flex flex-col gap-3 my-4">
            <div class="flex flex-col sm:flex-row gap-3">
                <input type="url" id="urlInput" 
                       class="flex-grow p-3 bg-gray-800 border border-gray-700 rounded-lg text-white focus:ring-2 focus:ring-blue-500 outline-none" 
                       placeholder="Enter a website URL (e.g., https://example.com)"
                       value="">
                
                <button id="snoopButton" 
                        class="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-8 rounded-lg transition-all flex items-center justify-center gap-2">
                    <span id="btnText">Snoop Page</span>
                    <div id="loader" class="loader"></div>
                </button>
            </div>
            <div class="flex gap-2 text-xs text-gray-500">
                <span>Tip: Copy and paste any full URL to see its formatted source code.</span>
            </div>
        </div>

        <div id="status-container" class="mb-4 text-sm font-medium">
            <span id="status-message" class="text-gray-500">Ready to snoop.</span>
        </div>

        <div class="relative">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-xl font-semibold text-white">Formatted Source</h2>
                <button id="copyButton" disabled
                        class="bg-gray-700 hover:bg-gray-600 disabled:opacity-50 text-white py-1.5 px-4 rounded transition-all text-sm">
                    Copy Code
                </button>
            </div>
            <div class="bg-gray-800 rounded-lg border border-gray-700 overflow-hidden min-h-[100px] flex flex-col">
                <pre id="code-container" class="overflow-auto max-h-[65vh] text-xs md:text-sm flex-grow"><code id="code-output" class="language-html"></code></pre>
            </div>
        </div>
    </div>

    <script>
        const urlInput = document.getElementById('urlInput');
        const snoopButton = document.getElementById('snoopButton');
        const statusMessage = document.getElementById('status-message');
        const codeOutput = document.getElementById('code-output');
        const loader = document.getElementById('loader');
        const copyButton = document.getElementById('copyButton');
        const btnText = document.getElementById('btnText');

        const updateStatus = (msg, type) => {
            statusMessage.textContent = msg;
            const colors = {
                loading: 'text-blue-400',
                success: 'text-green-400',
                error: 'text-red-400',
                ready: 'text-gray-500'
            };
            statusMessage.className = colors[type] || colors.ready;
        };

        const snoopUrl = async () => {
            let url = urlInput.value.trim();
            if (!url) return updateStatus('Please enter a URL first!', 'error');
            
            if (!url.startsWith('http')) url = 'https://' + url;

            loader.style.display = 'block';
            btnText.textContent = 'Snooping...';
            snoopButton.disabled = true;
            codeOutput.textContent = ''; 
            updateStatus('Requesting page content...', 'loading');
            
            try {
                // Using the AllOrigins raw proxy for compatibility
                const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(url)}`;
                
                const response = await fetch(proxyUrl);
                
                if (!response.ok) throw new Error('Proxy failed to respond.');
                
                const htmlContent = await response.text();
                
                if (!htmlContent || htmlContent.trim().length === 0) {
                    throw new Error('No content returned.');
                }

                updateStatus('Beautifying code...', 'loading');
                
                const beautifiedHtml = html_beautify(htmlContent, {
                    indent_size: 2,
                    wrap_line_length: 80,
                    preserve_newlines: true
                });

                codeOutput.textContent = beautifiedHtml;
                
                delete codeOutput.dataset.highlighted;
                hljs.highlightElement(codeOutput);

                updateStatus(`Successfully snooped!`, 'success');
                copyButton.disabled = false;
            } catch (err) {
                console.error('Fetch Error:', err);
                updateStatus('Error: Could not retrieve content. The site may be blocking access.', 'error');
                copyButton.disabled = true;
            } finally {
                loader.style.display = 'none';
                btnText.textContent = 'Snoop Page';
                snoopButton.disabled = false;
            }
        };

        const copyCode = () => {
            const text = codeOutput.textContent;
            if (!text) return;
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            try {
                document.execCommand('copy');
                const originalText = copyButton.textContent;
                copyButton.textContent = 'Copied!';
                setTimeout(() => copyButton.textContent = originalText, 2000);
            } catch (err) {}
            document.body.removeChild(textArea);
        };

        snoopButton.addEventListener('click', snoopUrl);
        copyButton.addEventListener('click', copyCode);
        urlInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') snoopUrl();
        });
    </script>
</body>
</html>
