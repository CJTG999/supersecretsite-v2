<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Epstien File Viewer</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; justify-content: center; padding: 50px; background-color: #eceff1; }
        .container { background: white; padding: 2.5rem; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 450px; text-align: center; }
        h2 { color: #2c3e50; margin-bottom: 1rem; }
        p { color: #7f8c8d; font-size: 0.9rem; margin-bottom: 1.5rem; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 2px solid #dfe6e9; border-radius: 6px; box-sizing: border-box; font-size: 1rem; outline: none; transition: border-color 0.3s; }
        input:focus { border-color: #3498db; }
        button { width: 100%; padding: 12px; background-color: #2980b9; color: white; border: none; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: bold; }
        button:hover { background-color: #3498db; }
    </style>
</head>
<body>

<div class="container">
    <h2>Epsiten Files</h2>
    <p>Enter the file number (1-2731812) to automatically locate the PDF.</p>
    
    <input type="number" id="file" placeholder="Enter File Number (e.g. 500)">
    <button onclick="goToDocument()">Open Document</button>
</div>

<script>
    function goToDocument() {
        const fileInput = document.getElementById('file').value.trim();
        if (!fileInput) {
            alert("Please enter a file number.");
            return;
        }

        const fileNumInt = parseInt(fileInput);
        let datasetNum = 1;

        // Dataset Mapping Logic
        // Based on the DOJ structure (adjust these ranges if needed)
        if (fileNumInt >= 1 && fileNumInt <= 1184) {
            datasetNum = 1;
        } else if (fileNumInt >= 1185 && fileNumInt <= 2361) {
            datasetNum = 2;
        } else if (fileNumInt >= 2362 && fileNumInt <= 3527) {
            datasetNum = 3;
        } else if (fileNumInt >= 3528) {
            datasetNum = 4;
        }

        // Pad to 8 digits
        const fileNumPadded = fileInput.padStart(8, '0');

        // Construct URL
        const url = `https://www.justice.gov/epstein/files/DataSet%20${datasetNum}/EFTA${fileNumPadded}.pdf`;

        // Open in a new tab
        window.open(url, '_blank');
    }
</script>

</body>
</html>
