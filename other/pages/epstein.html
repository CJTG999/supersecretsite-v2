<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" type="image/png" href="~/other/pages/images/epstein.png">
    <title>Epstien File Viewer</title>
    <style>
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0;
            background-color: #f4f4f9;
        }
        .container {
            text-align: center;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        input { 
            padding: 12px; 
            width: 120px; 
            font-size: 16px; 
            border: 2px solid #ddd;
            border-radius: 6px;
            outline: none;
        }
        input:focus { border-color: #007BFF; }
        button { 
            padding: 12px 24px; 
            font-size: 16px;
            cursor: pointer; 
            background: #007BFF; 
            color: white; 
            border: none; 
            border-radius: 6px;
            transition: background 0.2s;
        }
        button:hover { background: #0056b3; }
        p { color: #666; font-size: 0.9em; margin-top: 15px; }
    </style>
</head>
<body>

    <div class="container">
        <h2>Open Epstein File</h2>
        <input type="number" id="fileNumber" min="1" max="3158" placeholder="1-3158" autofocus>
        <button onclick="goToPDF()">Open File</button>
        <p>Enter a number to go directly to the file.</p>
    </div>

    <script>
        function goToPDF() {
            const input = document.getElementById('fileNumber');
            const num = input.value;
            
            if (num < 1 || num > 3158 || num === "") {
                alert("Please enter a number between 1 and 3158.");
                return;
            }

            // Pad the number to 8 digits
            const paddedNum = num.toString().padStart(8, '0');
            
            // Redirect the current window to the file
            window.location.href = `https://www.justice.gov/epstein/files/DataSet%201/EFTA${paddedNum}.pdf`;
        }

        // Allow pressing "Enter" to trigger the button
        document.getElementById('fileNumber').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') {
                goToPDF();
            }
        });
    </script>

</body>
</html>
