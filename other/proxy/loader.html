<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zip Loader with Progress</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f4f4f9; }
        
        #loader-container {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 300px; text-align: center;
        }

        .progress-bg { background: #e0e0e0; border-radius: 10px; height: 10px; width: 100%; overflow: hidden; margin-top: 10px; }
        #progress-fill { background: #4a90e2; height: 100%; width: 0%; transition: width 0.2s ease; }
        
        #status { font-size: 14px; color: #555; }
        iframe { width: 100%; height: 100%; border: none; display: none; }
    </style>
</head>
<body>

    <div id="loader-container">
        <div id="status">Initializing...</div>
        <div class="progress-bg">
            <div id="progress-fill"></div>
        </div>
    </div>

    <iframe id="viewer"></iframe>

    <script>
        const ZIP_URL = "https://codehs.com/uploads/82bb6befef1493b73572efb0b59ce4cd";
        // Using AllOrigins Proxy
        const PROXY_URL = `https://api.allorigins.win/raw?url=${encodeURIComponent(ZIP_URL)}`;

        async function loadZipContent() {
            const status = document.getElementById('status');
            const fill = document.getElementById('progress-fill');
            const iframe = document.getElementById('viewer');
            const loader = document.getElementById('loader-container');

            try {
                status.innerText = "Downloading assets...";
                
                const response = await fetch(PROXY_URL);
                if (!response.ok) throw new Error("Network response was not ok");

                // Tracking download progress
                const reader = response.body.getReader();
                const contentLength = +response.headers.get('Content-Length');
                
                let receivedLength = 0;
                let chunks = []; 
                
                while(true) {
                    const {done, value} = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    receivedLength += value.length;
                    
                    if (contentLength) {
                        let percent = Math.round((receivedLength / contentLength) * 100);
                        fill.style.width = percent + "%";
                    }
                }

                status.innerText = "Extracting files...";
                let blob = new Blob(chunks);
                const arrayBuffer = await blob.arrayBuffer();

                const zip = await JSZip.loadAsync(arrayBuffer);
                const htmlFile = zip.file("index.html");

                if (!htmlFile) throw new Error("index.html not found in zip");

                const htmlContent = await htmlFile.async("string");
                
                // Finalizing
                const pageBlob = new Blob([htmlContent], { type: 'text/html' });
                iframe.src = URL.createObjectURL(pageBlob);
                
                loader.style.display = 'none';
                iframe.style.display = 'block';

            } catch (error) {
                status.innerText = "Error: " + error.message;
                fill.style.background = "#ff4d4d";
                console.error(error);
            }
        }

        loadZipContent();
    </script>
</body>
</html>
