<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zip Web Loader</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: sans-serif; }
        #status { padding: 20px; text-align: center; }
        iframe { width: 100%; height: 100%; border: none; display: none; }
    </style>
</head>
<body>

    <div id="status">Downloading and extracting zip file...</div>
    <iframe id="viewer"></iframe>

    <script>
        const ZIP_URL = "https://codehs.com/uploads/82bb6befef1493b73572efb0b59ce4cd";
        // Using a proxy to bypass potential CORS restrictions
        const PROXY_URL = "https://corsproxy.io/?" + encodeURIComponent(ZIP_URL);

        async function loadZipContent() {
            const status = document.getElementById('status');
            const iframe = document.getElementById('viewer');

            try {
                // 1. Fetch the zip file
                const response = await fetch(PROXY_URL);
                if (!response.ok) throw new Error("Could not fetch the zip file.");
                
                const arrayBuffer = await response.arrayBuffer();

                // 2. Load the zip with JSZip
                const zip = await JSZip.loadAsync(arrayBuffer);
                
                // 3. Find the index.html file
                const htmlFile = zip.file("index.html");
                if (!htmlFile) throw new Error("index.html not found inside the zip.");

                // 4. Extract index.html as a string
                const htmlContent = await htmlFile.async("string");

                // 5. Handle relative assets (Optional but recommended)
                // Note: This simple version works if the HTML is self-contained. 
                // If it needs CSS/JS from the zip, they must be converted to Blobs too.
                
                // 6. Display the content in the iframe
                const blob = new Blob([htmlContent], { type: 'text/html' });
                iframe.src = URL.createObjectURL(blob);
                
                // Hide status, show iframe
                status.style.display = 'none';
                iframe.style.display = 'block';

            } catch (error) {
                status.innerHTML = "Error: " + error.message;
                console.error(error);
            }
        }

        loadZipContent();
    </script>
</body>
</html>
