<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Proxy</title>
    <style>
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #0b0e14;
            color: #e2e8f0;
        }
        .card {
            background: #161b22;
            padding: 2.5rem;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 450px;
            border: 1px solid #30363d;
            text-align: center;
        }
        h2 { margin-bottom: 0.5rem; color: #f0f6fc; }
        p { color: #8b949e; font-size: 0.9rem; margin-bottom: 1.5rem; }
        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 1rem;
            border-radius: 8px;
            border: 1px solid #30363d;
            background: #0d1117;
            color: white;
            box-sizing: border-box;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus { border-color: #58a6ff; }
        button {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: none;
            background-color: #238636;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover { background-color: #2ea043; }
    </style>
</head>
<body>

<div class="card">
    <h2>Secure Gateway</h2>
    <p>Enter a URL or search using DuckDuckGo</p>
    <input type="text" id="userInput" placeholder="Search or type a URL..." autofocus>
    <button onclick="navigate()">Launch</button>
</div>

<script>
    // Standard XOR 2 Encoding logic
    function xorEncode(str) {
        if (!str) return "";
        return str.split('').map((char, i) => {
            // Apply XOR 2 to every odd-indexed character
            return i % 2 ? String.fromCharCode(char.charCodeAt(0) ^ 2) : char;
        }).join('');
    }

    function navigate() {
        let input = document.getElementById('userInput').value.trim();
        if (!input) return;

        let targetUrl = input;

        // Check if the input is a URL. 
        // We look for common patterns like http://, https://, or a TLD like .com
        const isUrl = /^(https?:\/\/)?([\w\d-]+\.)+[\w-]+(\/.*)?$/i.test(input);

        if (!isUrl) {
            // If not a URL, format as a DuckDuckGo search
            targetUrl = "https://duckduckgo.com/?q=" + encodeURIComponent(input);
        } else if (!input.startsWith('http')) {
            // If it looks like a domain but lacks the protocol, add it
            targetUrl = "https://" + input;
        }

        const encoded = xorEncode(targetUrl);
        const finalDestination = `https://securedweb.xyz/s/internet/${encoded}`;

        window.location.href = finalDestination;
    }

    // Listen for the Enter key
    document.getElementById('userInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') navigate();
    });
</script>

</body>
</html>
