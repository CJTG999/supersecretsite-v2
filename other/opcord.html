<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OPCord</title>
<link id="dynamic-favicon" rel="icon" href="download-removebg-preview.png">

<style>
:root {
  --bg-main:#36393f;
  --bg-dark:#2f3136;
  --bg-darker:#202225;
  --accent:#5865f2;
  --text:#dcddde;
  --muted:#72767d;
  --input:#40444b;
}

* {
  box-sizing: border-box;
  font-family: "Segoe UI", sans-serif;
}

body {
  margin:0;
  height:100vh;
  display:flex;
  background:var(--bg-main);
  color:var(--text);
}

.sidebar {
  width:240px;
  background:var(--bg-darker);
  padding:12px;
}

.server {
  background:var(--accent);
  color:white;
  padding:10px;
  border-radius:8px;
  text-align:center;
  font-weight:bold;
}

.chat {
  flex:1;
  display:flex;
  flex-direction:column;
}

.header {
  background:var(--bg-dark);
  padding:12px;
  border-bottom:1px solid #000;
}

.messages {
  flex:1;
  padding:16px;
  overflow-y:auto;
}

.message {
  margin-bottom:10px;
}

.username {
  color:var(--accent);
  font-weight:bold;
  margin-right:6px;
}

.input-area {
  background:var(--bg-dark);
  padding:12px;
}

input {
  width:100%;
  padding:10px;
  background:var(--input);
  border:none;
  border-radius:5px;
  color:var(--text);
  outline:none;
}

.progress {
  height:4px;
  background:#111;
  margin-top:6px;
  border-radius:2px;
  overflow:hidden;
}

.bar {
  height:100%;
  width:0%;
  background:var(--accent);
  transition:width .15s;
}
</style>
</head>

<body>

<div class="sidebar">
  <div class="server">OPCord</div>
  <input id="room" placeholder="Room Code" />
</div>

<div class="chat">
  <div class="header"># general</div>
  <div class="messages" id="messages"></div>

  <div class="input-area">
    <input id="input" placeholder="Message #general" />
    <div class="progress"><div class="bar" id="bar"></div></div>
  </div>
</div>

<script>
const username = "User" + Math.floor(Math.random()*9999);
const messages = document.getElementById("messages");
const input = document.getElementById("input");
const roomInput = document.getElementById("room");
const bar = document.getElementById("bar");

let pc, dc, signal;

function log(user,text){
  const div=document.createElement("div");
  div.className="message";
  div.innerHTML=`<span class="username">${user}</span>${text}`;
  messages.appendChild(div);
  messages.scrollTop=messages.scrollHeight;
}

function setup(room){
  signal = new BroadcastChannel("opcord-"+room);

  pc = new RTCPeerConnection();
  dc = pc.createDataChannel("chat");

  dc.onmessage = e => log("Peer", e.data);

  pc.onicecandidate = e=>{
    if(e.candidate) signal.postMessage({candidate:e.candidate});
  };

  signal.onmessage = async e=>{
    if(e.data.offer){
      await pc.setRemoteDescription(e.data.offer);
      const ans = await pc.createAnswer();
      await pc.setLocalDescription(ans);
      signal.postMessage({answer:ans});
    }
    if(e.data.answer){
      await pc.setRemoteDescription(e.data.answer);
    }
    if(e.data.candidate){
      pc.addIceCandidate(e.data.candidate);
    }
  };

  pc.createOffer().then(o=>{
    pc.setLocalDescription(o);
    signal.postMessage({offer:o});
  });
}

roomInput.addEventListener("change",()=>{
  setup(roomInput.value.trim());
});

input.addEventListener("keydown",e=>{
  if(e.key==="Enter" && input.value && dc?.readyState==="open"){
    let p=0;
    bar.style.width="0%";
    const fake = setInterval(()=>{
      p+=20;
      bar.style.width=p+"%";
      if(p>=100){
        clearInterval(fake);
        dc.send(input.value);
        log(username,input.value);
        input.value="";
        setTimeout(()=>bar.style.width="0%",300);
      }
    },50);
  }
});
</script>

</body>
</html>
