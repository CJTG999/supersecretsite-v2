<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OPCord</title>

<link id="dynamic-favicon" rel="icon" href="download-removebg-preview.png">

<style>
:root {
  --bg-main:#36393f;
  --bg-dark:#2f3136;
  --bg-darker:#202225;
  --accent:#5865f2;
  --text:#dcddde;
  --muted:#72767d;
  --input:#40444b;
}

* {
  box-sizing:border-box;
  font-family:"Segoe UI",sans-serif;
}

body {
  margin:0;
  height:100vh;
  display:flex;
  background:var(--bg-main);
  color:var(--text);
}

.sidebar {
  width:260px;
  background:var(--bg-darker);
  padding:12px;
}

.server {
  background:var(--accent);
  color:white;
  padding:10px;
  border-radius:8px;
  text-align:center;
  font-weight:bold;
  margin-bottom:12px;
}

button, input {
  width:100%;
  margin-top:6px;
  padding:8px;
  background:var(--input);
  border:none;
  border-radius:5px;
  color:var(--text);
}

button {
  cursor:pointer;
  background:var(--accent);
}

.chat {
  flex:1;
  display:flex;
  flex-direction:column;
}

.header {
  background:var(--bg-dark);
  padding:12px;
  border-bottom:1px solid #000;
}

.messages {
  flex:1;
  padding:16px;
  overflow-y:auto;
}

.message {
  margin-bottom:10px;
}

.username {
  color:var(--accent);
  font-weight:bold;
  margin-right:6px;
}

.input-area {
  background:var(--bg-dark);
  padding:12px;
}

.progress {
  height:4px;
  background:#111;
  margin-top:6px;
  border-radius:2px;
  overflow:hidden;
}

.bar {
  height:100%;
  width:0%;
  background:var(--accent);
  transition:width .15s;
}
</style>
</head>

<body>

<div class="sidebar">
  <div class="server">OPCord</div>

  <button id="hostBtn">Host Room</button>
  <input id="roomInput" placeholder="Enter Room Code">
  <button id="joinBtn">Join Room</button>

  <div id="roomDisplay" style="margin-top:10px;color:var(--muted)"></div>
</div>

<div class="chat">
  <div class="header"># general</div>
  <div class="messages" id="messages"></div>

  <div class="input-area">
    <input id="input" placeholder="Message #general">
    <div class="progress"><div class="bar" id="bar"></div></div>
  </div>
</div>

<script>
const username = "User" + Math.floor(Math.random()*9999);
const messages = document.getElementById("messages");
const input = document.getElementById("input");
const bar = document.getElementById("bar");
const roomDisplay = document.getElementById("roomDisplay");

let pc, dc, signal, isHost=false;

function log(user,text){
  const div=document.createElement("div");
  div.className="message";
  div.innerHTML=`<span class="username">${user}</span>${text}`;
  messages.appendChild(div);
  messages.scrollTop=messages.scrollHeight;
}

function createRoomCode(){
  return Math.random().toString(36).substring(2,8).toUpperCase();
}

async function setup(room){
  signal = new BroadcastChannel("opcord-"+room);
  pc = new RTCPeerConnection();

  pc.onicecandidate = e=>{
    if(e.candidate) signal.postMessage({candidate:e.candidate});
  };

  pc.ondatachannel = e=>{
    dc = e.channel;
    dc.onmessage = ev => log("Peer", ev.data);
  };

  signal.onmessage = async e=>{
    if(e.data.offer && !isHost){
      await pc.setRemoteDescription(e.data.offer);
      const ans = await pc.createAnswer();
      await pc.setLocalDescription(ans);
      signal.postMessage({answer:ans});
    }
    if(e.data.answer && isHost){
      await pc.setRemoteDescription(e.data.answer);
    }
    if(e.data.candidate){
      pc.addIceCandidate(e.data.candidate);
    }
  };

  if(isHost){
    dc = pc.createDataChannel("chat");
    dc.onmessage = ev => log("Peer", ev.data);
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    signal.postMessage({offer});
  }
}

document.getElementById("hostBtn").onclick = async ()=>{
  isHost=true;
  const room=createRoomCode();
  roomDisplay.textContent="Hosting room: "+room;
  await setup(room);
};

document.getElementById("joinBtn").onclick = async ()=>{
  const room=document.getElementById("roomInput").value.trim();
  if(!room) return;
  isHost=false;
  roomDisplay.textContent="Joined room: "+room;
  await setup(room);
};

input.addEventListener("keydown",e=>{
  if(e.key==="Enter" && input.value && dc?.readyState==="open"){
    let p=0;
    bar.style.width="0%";
    const anim=setInterval(()=>{
      p+=25;
      bar.style.width=p+"%";
      if(p>=100){
        clearInterval(anim);
        dc.send(input.value);
        log(username,input.value);
        input.value="";
        setTimeout(()=>bar.style.width="0%",300);
      }
    },40);
  }
});
</script>

</body>
</html>
