<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>OPCord</title>

<link id="dynamic-favicon" rel="icon" href="download-removebg-preview.png">

<style>
:root {
  --bg-main:#36393f;
  --bg-dark:#2f3136;
  --bg-darker:#202225;
  --accent:#5865f2;
  --text:#dcddde;
  --muted:#72767d;
  --input:#40444b;
}

* {
  box-sizing:border-box;
  font-family:"Segoe UI",sans-serif;
}

body {
  margin:0;
  height:100vh;
  display:flex;
  background:var(--bg-main);
  color:var(--text);
}

.sidebar {
  width:280px;
  background:var(--bg-darker);
  padding:12px;
}

.server {
  background:var(--accent);
  color:white;
  padding:10px;
  border-radius:8px;
  text-align:center;
  font-weight:bold;
  margin-bottom:12px;
}

input, button {
  width:100%;
  margin-top:6px;
  padding:8px;
  background:var(--input);
  border:none;
  border-radius:5px;
  color:var(--text);
}

button {
  background:var(--accent);
  cursor:pointer;
}

.status {
  margin-top:10px;
  font-size:12px;
  color:var(--muted);
}

.chat {
  flex:1;
  display:flex;
  flex-direction:column;
}

.header {
  background:var(--bg-dark);
  padding:12px;
  border-bottom:1px solid #000;
}

.messages {
  flex:1;
  padding:16px;
  overflow-y:auto;
}

.message {
  margin-bottom:10px;
}

.username {
  color:var(--accent);
  font-weight:bold;
  margin-right:6px;
}

.input-area {
  background:var(--bg-dark);
  padding:12px;
}

.progress {
  height:4px;
  background:#111;
  margin-top:6px;
  border-radius:2px;
  overflow:hidden;
}

.bar {
  height:100%;
  width:0%;
  background:var(--accent);
  transition:width .15s;
}
</style>
</head>

<body>

<div class="sidebar">
  <div class="server">OPCord</div>

  <input id="usernameInput" placeholder="Username">
  <input id="roomInput" placeholder="Room Code (join only)">

  <button id="hostBtn">Host Room</button>
  <button id="joinBtn">Join Room</button>

  <div class="status" id="status">Not connected</div>
</div>

<div class="chat">
  <div class="header"># general</div>
  <div class="messages" id="messages"></div>

  <div class="input-area">
    <input id="chatInput" placeholder="Message #general" disabled>
    <div class="progress"><div class="bar" id="bar"></div></div>
  </div>
</div>

<script>
let pc, dc, signal;
let username = "";
let isHost = false;
let roomCode = "";

const messages = document.getElementById("messages");
const chatInput = document.getElementById("chatInput");
const bar = document.getElementById("bar");
const status = document.getElementById("status");

function log(user, text) {
  const div = document.createElement("div");
  div.className = "message";
  div.innerHTML = `<span class="username">${user}</span>${text}`;
  messages.appendChild(div);
  messages.scrollTop = messages.scrollHeight;
}

function setStatus(text) {
  status.textContent = text;
}

function generateRoomCode() {
  return Math.random().toString(36).substring(2, 8).toUpperCase();
}

async function setupConnection(room) {
  signal = new BroadcastChannel("opcord-" + room);
  pc = new RTCPeerConnection();

  pc.onicecandidate = e => {
    if (e.candidate) signal.postMessage({ candidate: e.candidate });
  };

  pc.ondatachannel = e => {
    dc = e.channel;
    dc.onopen = () => {
      chatInput.disabled = false;
      setStatus("Connected");
    };
    dc.onmessage = ev => {
      const data = JSON.parse(ev.data);
      log(data.user, data.text);
    };
  };

  signal.onmessage = async e => {
    if (e.data.offer && !isHost) {
      await pc.setRemoteDescription(e.data.offer);
      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      signal.postMessage({ answer });
    }
    if (e.data.answer && isHost) {
      await pc.setRemoteDescription(e.data.answer);
    }
    if (e.data.candidate) {
      pc.addIceCandidate(e.data.candidate);
    }
  };

  if (isHost) {
    dc = pc.createDataChannel("chat");
    dc.onopen = () => {
      chatInput.disabled = false;
      setStatus("Connected (Host)");
    };
    dc.onmessage = ev => {
      const data = JSON.parse(ev.data);
      log(data.user, data.text);
    };

    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    signal.postMessage({ offer });
  }

  setStatus("Connecting…");
}

document.getElementById("hostBtn").onclick = async () => {
  username = usernameInput.value.trim();
  if (!username) return alert("Username required");

  isHost = true;
  roomCode = generateRoomCode();
  setStatus("Hosting room: " + roomCode);

  await setupConnection(roomCode);
};

document.getElementById("joinBtn").onclick = async () => {
  username = usernameInput.value.trim();
  roomCode = roomInput.value.trim();

  if (!username || !roomCode) return alert("Username and room code required");

  isHost = false;
  setStatus("Joining room: " + roomCode);

  await setupConnection(roomCode);
};

chatInput.addEventListener("keydown", e => {
  if (e.key === "Enter" && chatInput.value && dc?.readyState === "open") {
    let p = 0;
    bar.style.width = "0%";

    const sendAnim = setInterval(() => {
      p += 25;
      bar.style.width = p + "%";

      if (p >= 100) {
        clearInterval(sendAnim);
        const msg = { user: username, text: chatInput.value };
        dc.send(JSON.stringify(msg));
        log(username, chatInput.value);
        chatInput.value = "";
        setTimeout(() => bar.style.width = "0%", 300);
      }
    }, 40);
  }
});
</script>

</body>
</html>
