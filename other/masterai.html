<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MasterAI | Puter Edition</title>

<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@400;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>

<!-- PUTER SDK -->
<script src="https://js.puter.com/v2/"></script>

<style>
:root {
    --bg:#0d1117; --panel:#161b22; --border:#30363d;
    --accent:#238636; --text:#c9d1d9;
}
*{box-sizing:border-box}
body{
    margin:0;background:var(--bg);color:var(--text);
    font-family:'Ubuntu',sans-serif;height:100vh;
    display:flex;flex-direction:column;overflow:hidden;
}
#loader{
    position:fixed;inset:0;background:var(--bg);z-index:999;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
}
.bar-container{width:300px;height:6px;background:var(--border);border-radius:3px;margin-top:15px}
.bar{height:100%;width:100%;background:var(--accent)}
.header{
    padding:15px;background:var(--panel);border-bottom:1px solid var(--border);
    font-weight:bold;display:flex;justify-content:space-between;
}
.chat-area{
    flex:1;overflow-y:auto;padding:20px;display:flex;
    flex-direction:column;gap:15px;
}
.input-area{
    padding:20px;background:var(--panel);border-top:1px solid var(--border);
    display:flex;gap:10px;
}
.msg{
    padding:12px 16px;border-radius:12px;font-size:15px;
    line-height:1.5;max-width:800px;
}
.user{align-self:flex-end;background:#1f6feb;color:white}
.ai{align-self:flex-start;background:#21262d;border:1px solid var(--border)}
input{
    flex:1;background:var(--bg);border:1px solid var(--border);
    color:white;padding:12px 15px;border-radius:25px;outline:none;
}
button{
    background:var(--accent);color:white;border:none;
    padding:10px 25px;border-radius:25px;font-weight:bold;cursor:pointer;
}
pre{
    margin:10px 0;border-radius:6px;overflow-x:auto;
    background:#0d1117;padding:10px;border:1px solid var(--border);
}
code{font-family:Consolas,monospace;font-size:13px}
</style>
</head>
<body>

<div id="loader">
    <div style="font-size:24px;font-weight:bold">MASTERAI</div>
    <div class="bar-container"><div class="bar"></div></div>
    <div style="margin-top:10px;font-size:13px;color:#8b949e">
        Connecting to Puter AI…
    </div>
</div>

<div class="header">
    <span>MASTERAI <span style="font-size:11px;opacity:.6;border:1px solid var(--border);
        padding:2px 6px;border-radius:4px;margin-left:8px;">PUTER CLOUD</span></span>
    <span style="font-size:12px;color:#238636">● Online</span>
</div>

<div class="chat-area" id="chat">
    <div class="msg ai">
        <b>System Ready.</b><br>
        Running on Puter AI with streaming responses.
    </div>
</div>

<div class="input-area">
    <input id="userInput" placeholder="Type a message…" autocomplete="off">
    <button id="sendBtn">Send</button>
</div>

<script>
const loader = document.getElementById('loader');
const chatBox = document.getElementById('chat');
const input = document.getElementById('userInput');
const btn = document.getElementById('sendBtn');

const history = [
    { role: "system", content: "You are a helpful AI assistant." }
];

// INIT
(async () => {
    await puter.ready;
    loader.style.display = 'none';
})();

// SEND MESSAGE
btn.onclick = send;
input.addEventListener('keypress', e => {
    if (e.key === 'Enter') send();
});

async function send() {
    const text = input.value.trim();
    if (!text) return;

    addMsg(text, 'user');
    history.push({ role:'user', content:text });
    input.value = '';
    input.disabled = btn.disabled = true;

    const aiBubble = document.createElement('div');
    aiBubble.className = 'msg ai';
    aiBubble.textContent = 'Thinking…';
    chatBox.appendChild(aiBubble);
    chatBox.scrollTop = chatBox.scrollHeight;

    let full = '';

    try {
        const stream = await puter.ai.chat(history, { stream:true });

        for await (const part of stream) {
            full += part.text;
            aiBubble.innerHTML = marked.parse(full);
            hljs.highlightAll();
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        history.push({ role:'assistant', content:full });

    } catch (err) {
        aiBubble.innerHTML = `<i>Error: ${err.message}</i>`;
    }

    input.disabled = btn.disabled = false;
    input.focus();
}

function addMsg(text, role) {
    const div = document.createElement('div');
    div.className = `msg ${role}`;
    div.innerHTML = marked.parse(text);
    chatBox.appendChild(div);
    chatBox.scrollTop = chatBox.scrollHeight;
}
</script>

</body>
</html>
