<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterAI | GitLab Edition</title>
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
    <style>
        :root { --bg: #0d1117; --panel: #161b22; --accent: #58a6ff; --text: #c9d1d9; --border: #30363d; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; display: flex; flex-direction: column; height: 100vh; }
        
        header { padding: 15px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; background: var(--panel); }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 15px; border: 1px solid transparent; }
        .user { align-self: flex-end; background: rgba(88, 166, 255, 0.1); border-color: var(--accent); color: #fff; }
        .ai { align-self: flex-start; background: var(--panel); border-color: var(--border); }

        .footer { padding: 20px; background: var(--bg); border-top: 1px solid var(--border); display: flex; gap: 10px; }
        input { flex: 1; background: var(--panel); border: 1px solid var(--border); color: white; padding: 12px 18px; border-radius: 25px; outline: none; }
        button { background: var(--accent); color: #fff; border: none; padding: 10px 25px; border-radius: 25px; cursor: pointer; font-weight: bold; }
        
        #status { font-size: 12px; color: #8b949e; }
    </style>
</head>
<body>

<header>
    <div style="font-weight: bold; letter-spacing: 1px;">MASTERAI</div>
    <div id="status">Connecting to Cloud...</div>
</header>

<div id="chat">
    <div class="msg ai">MasterAI initialized for GitLab. No terminal or API key required. How can I help you today?</div>
</div>

<div class="footer">
    <input type="text" id="userInput" placeholder="Message MasterAI...">
    <button onclick="askAI()">SEND</button>
</div>

<script>
    // Puter automatically handles the "API" part for you for free
    async function askAI() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        addMsg('user', text);
        input.value = '';
        document.getElementById('status').innerText = "MasterAI is thinking...";

        try {
            // This calls a high-end model (like GPT-4o-mini) via Puter's free tier
            const response = await puter.ai.chat(text);
            
            // Puter returns an object; we get the content string from it
            const reply = response.message.content;
            addMsg('ai', reply);
            document.getElementById('status').innerText = "Online";
        } catch (e) {
            console.error(e);
            addMsg('ai', "MasterAI Error: Could not reach the cloud. Please refresh.");
            document.getElementById('status').innerText = "Connection Failed";
        }
    }

    function addMsg(role, text) {
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.innerHTML = marked.parse(text);
        document.getElementById('chat').appendChild(div);
        document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
    }

    // Auto-status update
    window.onload = () => { document.getElementById('status').innerText = "Online"; };
    
    // Enter key support
    document.getElementById('userInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') askAI();
    });
</script>
</body>
</html>
