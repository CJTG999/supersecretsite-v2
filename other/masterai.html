<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterAI Workspace</title>
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #000000;
            --chat-bg: #000000;
            --user-blue: #007aff;
            --ai-gray: #262629;
            --accent: #8ab4f8;
            --text: #ffffff;
            --border: #333333;
            --canvas-bg: #111111;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; display: flex; height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg); color: var(--text); overflow: hidden;
        }

        /* --- Layout --- */
        #chat-section {
            flex: 1; min-width: 350px;
            display: flex; flex-direction: column;
            background: var(--chat-bg);
        }

        #resizer {
            width: 4px; cursor: col-resize;
            background: transparent; transition: background 0.3s;
            z-index: 100; flex-shrink: 0;
        }
        #resizer:hover, #resizer.active { background: #444; }

        #canvas-section {
            width: 0; display: none;
            flex-direction: column; background: var(--bg);
            padding: 20px; border-left: 1px solid var(--border);
        }

        /* --- iOS Chat Bubbles --- */
        header { padding: 15px 25px; font-size: 1.2rem; font-weight: 600; text-align: center; border-bottom: 1px solid var(--border); }
        
        #messages { 
            flex: 1; overflow-y: auto; 
            padding: 20px; display: flex; flex-direction: column; 
            gap: 4px; /* Tight iOS spacing */
        }

        .msg {
            max-width: 75%;
            padding: 8px 16px;
            font-size: 16px;
            line-height: 1.4;
            position: relative;
            width: fit-content;
            word-wrap: break-word;
        }

        /* User Message (Right / Blue) */
        .user-msg {
            align-self: flex-end;
            background: var(--user-blue);
            color: white;
            border-radius: 20px 20px 4px 20px;
            margin-bottom: 8px;
        }

        /* AI Message (Left / Gray) */
        .ai-msg {
            align-self: flex-start;
            background: var(--ai-gray);
            color: white;
            border-radius: 20px 20px 20px 4px;
            margin-bottom: 8px;
        }

        /* Formatting inside bubbles */
        .msg p { margin: 0; }
        .msg code { background: rgba(255,255,255,0.1); padding: 2px 4px; border-radius: 4px; font-size: 0.9em; }

        /* --- Input Area --- */
        .input-wrapper { padding: 10px 20px 30px; }
        .input-container {
            background: #1c1c1e; border-radius: 25px; padding: 5px 12px;
            border: 1px solid var(--border); display: flex; align-items: flex-end; gap: 8px;
        }
        textarea {
            flex: 1; background: transparent; border: none; color: white;
            padding: 10px 5px; outline: none; resize: none; font-size: 16px;
            max-height: 150px; font-family: inherit;
        }
        .icon-btn {
            background: none; border: none; cursor: pointer; padding: 6px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%;
        }
        .send-btn-active {
            background: var(--user-blue) !important;
            border-radius: 50%;
        }
        svg { fill: white; width: 20px; height: 20px; }

        /* --- Canvas UI --- */
        .canvas-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px;
        }
        #canvas-content {
            flex: 1; background: var(--canvas-bg); border-radius: 12px;
            padding: 20px; border: 1px solid var(--border);
            font-family: 'SF Mono', 'Fira Code', monospace; overflow-y: auto;
            white-space: pre-wrap; font-size: 14px; outline: none;
        }

        .btn {
            background: #2c2c2e; color: #007aff; border: none; padding: 6px 14px;
            border-radius: 15px; cursor: pointer; font-size: 14px; font-weight: 500;
        }
        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="chat-section">
        <header>MasterAI</header>
        <div id="messages">
            <div class="msg ai-msg">MasterAI is ready.</div>
        </div>
        
        <div class="input-wrapper">
            <div class="input-container">
                <button class="icon-btn" onclick="document.getElementById('file-in').click()">
                    <svg viewBox="0 0 24 24" style="fill:#8e8e93"><path d="M12 5v14M5 12h14" stroke="#8e8e93" stroke-width="2" stroke-linecap="round"/></svg>
                </button>
                <input type="file" id="file-in" class="hidden" onchange="uploadFile()">
                
                <textarea id="user-input" rows="1" placeholder="iMessage" oninput="autoGrow(this)"></textarea>
                
                <button id="send-btn" class="icon-btn send-btn-active" onclick="askMasterAI()" disabled style="opacity:0.3">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
            <div style="text-align: center; margin-top: 10px;">
                <button id="view-canvas-btn" class="btn hidden" onclick="toggleCanvas()">Open Workspace</button>
            </div>
        </div>
    </div>

    <div id="resizer" class="hidden"></div>

    <div id="canvas-section">
        <div class="canvas-header">
            <span style="font-size: 13px; font-weight: 600; color: #8e8e93;">WORKSPACE</span>
            <div style="display: flex; gap: 8px;">
                <button class="btn" onclick="downloadCanvas()">Save</button>
                <button class="btn" onclick="toggleCanvas()">Close</button>
            </div>
        </div>
        <div id="canvas-content" contenteditable="true"></div>
    </div>

<script>
    // Puter Readiness
    const sendBtn = document.getElementById('send-btn');
    const checkPuter = setInterval(() => {
        if (typeof puter !== 'undefined') {
            sendBtn.disabled = false;
            sendBtn.style.opacity = "1";
            clearInterval(checkPuter);
        }
    }, 500);

    const chatSection = document.getElementById('chat-section');
    const canvasSection = document.getElementById('canvas-section');
    const resizer = document.getElementById('resizer');
    const canvasBtn = document.getElementById('view-canvas-btn');

    // Resize Logic
    let isResizing = false;
    resizer.addEventListener('mousedown', () => isResizing = true);
    document.addEventListener('mousemove', (e) => {
        if (!isResizing) return;
        let leftWidth = e.clientX;
        if (leftWidth > 300 && (window.innerWidth - leftWidth) > 300) {
            chatSection.style.flex = `0 0 ${leftWidth}px`;
            canvasSection.style.display = 'flex';
            resizer.classList.remove('hidden');
        }
    });
    document.addEventListener('mouseup', () => isResizing = false);

    function toggleCanvas() {
        const isVisible = canvasSection.style.display === 'flex';
        canvasSection.style.display = isVisible ? 'none' : 'flex';
        resizer.classList.toggle('hidden', isVisible);
        if (!isVisible) chatSection.style.flex = "0 0 50%";
        else chatSection.style.flex = "1";
    }

    function autoGrow(element) {
        element.style.height = "auto";
        element.style.height = (element.scrollHeight) + "px";
    }

    async function askMasterAI() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        appendMsg('user', text);
        input.value = '';
        input.style.height = 'auto';

        try {
            const systemPrompt = `You are MasterAI. If the user wants code, an essay, or complex data, put it inside [CANVAS]...[/CANVAS] tags.`;
            const response = await puter.ai.chat(text, { model: 'gpt-4o', system_message: systemPrompt });
            const aiResponse = response.message.content;

            if (aiResponse.includes("[CANVAS]")) {
                const parts = aiResponse.split("[CANVAS]");
                appendMsg('ai', parts[0] + "\n\n*(Artifact in workspace)*");
                document.getElementById('canvas-content').innerText = parts[1].split("[/CANVAS]")[0].trim();
                canvasBtn.classList.remove('hidden');
                if (canvasSection.style.display !== 'flex') toggleCanvas();
            } else {
                appendMsg('ai', aiResponse);
            }
        } catch (err) {
            appendMsg('ai', "Error: " + err.message);
        }
    }

    function appendMsg(role, text) {
        const m = document.getElementById('messages');
        const d = document.createElement('div');
        d.className = `msg ${role}-msg`;
        d.innerHTML = marked.parse(text);
        m.appendChild(d);
        m.scrollTop = m.scrollHeight;
    }

    async function uploadFile() {
        const files = document.getElementById('file-in').files;
        if (!files.length) return;
        appendMsg('user', `Shared a file: ${files[0].name}`);
        try {
            await puter.fs.upload(files);
            appendMsg('ai', "File uploaded to cloud. How should I process it?");
        } catch (e) { appendMsg('ai', "Upload failed."); }
    }

    function downloadCanvas() {
        const content = document.getElementById('canvas-content').innerText;
        const blob = new Blob([content], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'masterai_file.txt';
        a.click();
    }
</script>
</body>
</html>
