<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterAI | Local Intelligence</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
    <style>
        :root { --bg: #050505; --accent: #007aff; --panel: #121212; --text: #e0e0e0; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; display: flex; height: 100vh; overflow: hidden; }
        
        /* Layout */
        #chat-side { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #222; }
        #canvas-side { width: 0; display: none; background: #000; padding: 20px; flex-direction: column; }
        
        /* Header & Status */
        header { padding: 15px 20px; border-bottom: 1px solid #222; display: flex; justify-content: space-between; align-items: center; }
        #status-pill { font-size: 11px; padding: 4px 10px; border-radius: 12px; background: #222; border: 1px solid #333; }
        .loading-bar { position: absolute; top: 0; left: 0; height: 3px; background: var(--accent); transition: width 0.3s; width: 0%; }

        /* Messages */
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 12px 16px; border-radius: 18px; line-height: 1.5; font-size: 15px; }
        .user { align-self: flex-end; background: var(--accent); color: white; border-bottom-right-radius: 4px; }
        .ai { align-self: flex-start; background: var(--panel); border: 1px solid #222; border-bottom-left-radius: 4px; }

        /* Input Area */
        .footer { padding: 20px; background: var(--bg); border-top: 1px solid #222; }
        .input-box { display: flex; background: var(--panel); border: 1px solid #333; border-radius: 24px; padding: 8px 16px; align-items: center; }
        input { flex: 1; background: transparent; border: none; color: white; padding: 10px; outline: none; font-size: 16px; }
        button { background: none; border: none; color: var(--accent); font-weight: bold; cursor: pointer; padding: 0 10px; }
        button:disabled { color: #555; cursor: not-allowed; }

        /* Canvas Workspace */
        #canvas-box { flex: 1; background: #0a0a0a; border: 1px solid #333; border-radius: 8px; padding: 20px; font-family: 'Courier New', monospace; white-space: pre-wrap; outline: none; overflow-y: auto; }
        
        .visible { display: flex !important; width: 50% !important; }
    </style>
</head>
<body>

<div class="loading-bar" id="progress-bar"></div>

<div id="chat-side">
    <header>
        <span style="font-weight: bold; letter-spacing: 1px;">MASTERAI</span>
        <div id="status-pill">Initializing Engine...</div>
    </header>

    <div id="messages">
        <div class="msg ai">Welcome. I am downloading the Llama-3 brain to your browser cache. This happens only once.</div>
    </div>

    <div class="footer">
        <div class="input-box">
            <input type="text" id="userInput" placeholder="Wait for engine to load..." disabled>
            <button id="sendBtn" onclick="runAI()" disabled>SEND</button>
        </div>
    </div>
</div>

<div id="canvas-side">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
        <span style="font-size:12px; color:#666;">WORKSPACE (EDITABLE)</span>
        <button onclick="toggleCanvas()" style="color:#666; font-size:12px;">CLOSE</button>
    </div>
    <div id="canvas-box" contenteditable="true"></div>
</div>

<script type="module">
    // MasterAI Logic: Uses WebLLM for Local Inference
    import * as webllm from "https://esm.run/@mlc-ai/web-llm";

    const statusPill = document.getElementById('status-pill');
    const progressBar = document.getElementById('progress-bar');
    const input = document.getElementById('userInput');
    const btn = document.getElementById('sendBtn');
    
    // Using a compact Llama-3 model that fits on most modern laptops
    const modelId = "Llama-3.1-8B-Instruct-q4f32_1-MLC";
    let engine;

    async function init() {
        try {
            engine = await webllm.CreateMLCEngine(modelId, {
                initProgressCallback: (report) => {
                    statusPill.innerText = report.text.split(']')[1] || "Downloading Brain...";
                    const progressMatch = report.text.match(/\[(\d+)\/(\d+)\]/);
                    if (progressMatch) {
                        const percent = (parseInt(progressMatch[1]) / parseInt(progressMatch[2])) * 100;
                        progressBar.style.width = percent + "%";
                    }
                }
            });
            statusPill.innerText = "MASTERAI ONLINE";
            statusPill.style.color = "#34c759";
            input.disabled = false;
            btn.disabled = false;
            input.placeholder = "Message MasterAI...";
            progressBar.style.display = 'none';
        } catch (e) {
            statusPill.innerText = "Hardware Not Supported";
            console.error(e);
        }
    }

    window.runAI = async function() {
        const text = input.value.trim();
        if (!text) return;

        addMsg('user', text);
        input.value = '';
        
        const aiMsgDiv = addMsg('ai', "...");
        let fullResponse = "";

        const chunks = await engine.chat.completions.create({
            messages: [{ role: "user", content: text }],
            temperature: 0.7,
            stream: true,
        });

        for await (const chunk of chunks) {
            const content = chunk.choices[0]?.delta?.content || "";
            fullResponse += content;
            aiMsgDiv.innerHTML = marked.parse(fullResponse);
            document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        }

        // Detect if AI wrote code or long text for the Workspace
        if (fullResponse.includes("```")) {
            const code = fullResponse.match(/```([\s\S]*?)```/)[1];
            document.getElementById('canvas-box').innerText = code.trim();
            if (!document.getElementById('canvas-side').classList.contains('visible')) {
                toggleCanvas();
            }
        }
    };

    function addMsg(role, text) {
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.innerHTML = marked.parse(text);
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
        return div;
    }

    window.toggleCanvas = function() {
        document.getElementById('canvas-side').classList.toggle('visible');
    }

    init();
</script>
</body>
</html>
