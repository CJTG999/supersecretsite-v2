<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterAI Workspace</title>
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #131314;
            --side: #1e1f20;
            --accent: #8ab4f8;
            --text: #e3e3e3;
            --border: #444746;
            --panel-bg: #000000;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; display: flex; height: 100vh;
            font-family: 'Google Sans', Roboto, Arial, sans-serif;
            background: var(--bg); color: var(--text); overflow: hidden;
        }

        /* --- Layout --- */
        #chat-section {
            flex: 1 1 0; min-width: 300px;
            display: flex; flex-direction: column;
            background: var(--bg); position: relative;
        }

        /* Resizer bar */
        #resizer {
            width: 8px; cursor: col-resize;
            background: transparent; transition: background 0.2s;
            z-index: 10;
        }
        #resizer:hover { background: var(--accent); }

        #canvas-section {
            width: 0; /* Hidden by default */
            display: none; /* Hidden by default */
            flex-direction: column;
            background: var(--bg); padding: 20px;
            border-left: 1px solid var(--border);
        }

        /* --- Chat UI --- */
        header { padding: 20px; font-size: 1.5rem; font-weight: 500; color: var(--accent); }
        #messages { flex: 1; overflow-y: auto; padding: 20px; }
        .msg { margin-bottom: 24px; max-width: 85%; line-height: 1.6; }
        .user-msg { margin-left: auto; color: #fff; background: #303132; padding: 12px 18px; border-radius: 18px; }
        
        .input-container {
            padding: 20px; max-width: 800px; margin: 0 auto; width: 100%;
        }
        .input-box {
            background: #1e1f20; border-radius: 28px; padding: 10px 20px;
            border: 1px solid var(--border); display: flex; align-items: center;
        }
        textarea {
            flex: 1; background: transparent; border: none; color: white;
            padding: 10px; outline: none; resize: none; font-size: 16px;
        }

        /* --- Canvas UI --- */
        #canvas-content {
            flex: 1; background: var(--panel-bg); border-radius: 16px;
            padding: 24px; border: 1px solid var(--border);
            font-family: 'Fira Code', monospace; overflow-y: auto;
            white-space: pre-wrap; font-size: 14px;
        }
        .canvas-tools { display: flex; justify-content: space-between; margin-bottom: 15px; }

        /* --- Buttons --- */
        .action-btn {
            background: transparent; border: 1px solid var(--border);
            color: var(--accent); padding: 8px 16px; border-radius: 20px;
            cursor: pointer; font-weight: 500;
        }
        .action-btn:hover { background: #3c4043; }
        .send-btn { color: var(--accent); font-size: 24px; cursor: pointer; border:none; background:none; }

        /* Utils */
        .hidden { display: none !important; }
        .visible { display: flex !important; }
    </style>
</head>
<body>

    <div id="chat-section">
        <header>MasterAI</header>
        <div id="messages"></div>
        
        <div class="input-container">
            <div class="input-box">
                <button class="action-btn" style="border:none" onclick="document.getElementById('file-in').click()">📎</button>
                <input type="file" id="file-in" class="hidden" onchange="uploadToMaster()">
                <textarea id="user-input" rows="1" placeholder="Type your prompt..." oninput="this.style.height='';this.style.height=this.scrollHeight+'px'"></textarea>
                <button class="send-btn" onclick="askMasterAI()">✦</button>
            </div>
            <div style="margin-top:10px; text-align:center;">
                <button id="toggle-canvas-btn" class="action-btn hidden" onclick="toggleCanvas()">View Workspace</button>
            </div>
        </div>
    </div>

    <div id="resizer" class="hidden"></div>

    <div id="canvas-section">
        <div class="canvas-tools">
            <span style="font-weight:bold">Master Workspace</span>
            <button class="action-btn" onclick="toggleCanvas()">Close</button>
        </div>
        <div id="canvas-content" contenteditable="true">Generated content appears here...</div>
    </div>

<script>
    // 1. Ensure Puter is ready
    window.onload = () => {
        if (typeof puter === 'undefined') {
            console.error("MasterAI Error: Puter.js failed to load. Check your internet connection.");
        }
    };

    const chatSection = document.getElementById('chat-section');
    const canvasSection = document.getElementById('canvas-section');
    const resizer = document.getElementById('resizer');
    const canvasBtn = document.getElementById('toggle-canvas-btn');

    // 2. Resizing Logic
    let isResizing = false;
    resizer.addEventListener('mousedown', (e) => {
        isResizing = true;
        document.body.style.cursor = 'col-resize';
    });

    document.addEventListener('mousemove', (e) => {
        if (!isResizing) return;
        let containerWidth = document.body.offsetWidth;
        let leftWidth = e.clientX;
        let rightWidth = containerWidth - leftWidth;
        
        if (leftWidth > 300 && rightWidth > 300) {
            chatSection.style.flex = `0 0 ${leftWidth}px`;
            canvasSection.style.width = `${rightWidth}px`;
        }
    });

    document.addEventListener('mouseup', () => {
        isResizing = false;
        document.body.style.cursor = 'default';
    });

    // 3. Toggle Canvas
    function toggleCanvas() {
        if (canvasSection.classList.contains('visible')) {
            canvasSection.classList.replace('visible', 'hidden');
            resizer.classList.add('hidden');
            chatSection.style.flex = "1";
        } else {
            canvasSection.classList.replace('hidden', 'visible');
            resizer.classList.remove('hidden');
            canvasSection.style.width = "50%";
            chatSection.style.flex = "0 0 50%";
        }
    }

    // 4. AI Logic
    async function askMasterAI() {
        const input = document.getElementById('user-input');
        const text = input.value.trim();
        if (!text) return;

        appendMsg('user', text);
        input.value = '';

        try {
            const prompt = `System: Rebrand yourself as MasterAI. If providing code, wrap it in [CANVAS]...[/CANVAS]. User: ${text}`;
            
            // Call Puter AI (ensure 'puter' exists)
            const response = await puter.ai.chat(prompt, { model: 'gpt-4o' });
            const aiText = response.message.content;

            if (aiText.includes("[CANVAS]")) {
                const parts = aiText.split("[CANVAS]");
                const chatText = parts[0];
                const canvasText = parts[1].split("[/CANVAS]")[0];

                appendMsg('ai', chatText + "\n\n*(Artifact updated in workspace)*");
                document.getElementById('canvas-content').innerText = canvasText.trim();
                
                // Show the canvas button if it was hidden
                canvasBtn.classList.remove('hidden');
                // Automatically open canvas on first generation
                if (!canvasSection.classList.contains('visible')) toggleCanvas();
            } else {
                appendMsg('ai', aiText);
            }
        } catch (err) {
            appendMsg('ai', "MasterAI Error: " + err.message);
        }
    }

    async function uploadToMaster() {
        const file = document.getElementById('file-in').files[0];
        appendMsg('user', `Uploading ${file.name}...`);
        try {
            const res = await puter.fs.upload(document.getElementById('file-in').files);
            appendMsg('ai', `I've received the file: ${res[0].name}. You can now ask me to analyze it.`);
        } catch (e) { appendMsg('ai', "Upload failed: " + e.message); }
    }

    function appendMsg(role, text) {
        const m = document.getElementById('messages');
        const d = document.createElement('div');
        d.className = `msg ${role}-msg`;
        d.innerHTML = marked.parse(text);
        m.appendChild(d);
        m.scrollTop = m.scrollHeight;
    }
</script>
</body>
</html>
