<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MasterAI | Secure Aggregator</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
    <style>
        :root { --bg: #0d1117; --panel: #161b22; --blue: #58a6ff; --text: #c9d1d9; --border: #30363d; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; display: flex; height: 100vh; }
        
        /* Sidebar for Controls */
        #sidebar { width: 260px; background: var(--panel); border-right: 1px solid var(--border); padding: 20px; display: flex; flex-direction: column; gap: 20px; }
        select, input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: white; padding: 10px; border-radius: 6px; outline: none; }
        
        /* Main Chat Area */
        #main { flex: 1; display: flex; flex-direction: column; position: relative; }
        #messages { flex: 1; overflow-y: auto; padding: 40px 15%; display: flex; flex-direction: column; gap: 20px; }
        .msg { padding: 15px; border-radius: 8px; line-height: 1.6; border: 1px solid transparent; }
        .user { background: rgba(88, 166, 255, 0.1); border-color: var(--blue); align-self: flex-end; width: fit-content; max-width: 80%; }
        .ai { background: var(--panel); border-color: var(--border); }

        .input-area { padding: 20px 15%; border-top: 1px solid var(--border); background: var(--bg); }
        .input-box { display: flex; gap: 10px; background: var(--panel); padding: 10px; border-radius: 8px; border: 1px solid var(--border); }
        textarea { flex: 1; background: transparent; border: none; color: white; resize: none; outline: none; height: 24px; font-size: 16px; }
        
        .status-dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; margin-right: 5px; }
        .online { background: #238636; }
    </style>
</head>
<body>

<div id="sidebar">
    <h3>MasterAI</h3>
    <div>
        <label style="font-size: 12px; color: #8b949e;">CHOOSE BRAIN</label>
        <select id="model-select">
            <option value="openai/gpt-4o-mini">GPT-4o Mini (Fast)</option>
            <option value="anthropic/claude-3-sonnet">Claude 3.5 Sonnet</option>
            <option value="google/gemini-pro-1.5">Gemini 1.5 Pro</option>
            <option value="meta-llama/llama-3-70b-instruct">Llama 3 (Free-ish)</option>
        </select>
    </div>
    <div>
        <label style="font-size: 12px; color: #8b949e;">API KEY (OPENROUTER)</label>
        <input type="password" id="api-key" placeholder="sk-or-..." onchange="saveKey()">
    </div>
    <div style="margin-top: auto; font-size: 12px;">
        <span class="status-dot online"></span> Secure Connection Active
    </div>
</div>

<div id="main">
    <div id="messages"></div>
    <div class="input-area">
        <div class="input-box">
            <textarea id="prompt" placeholder="Ask MasterAI anything..." oninput="this.style.height='auto';this.style.height=this.scrollHeight+'px'"></textarea>
            <button onclick="askMasterAI()" style="background: var(--blue); border: none; color: white; border-radius: 5px; padding: 0 15px; cursor: pointer;">Ask</button>
        </div>
        <p style="font-size: 10px; text-align: center; color: #8b949e; margin-top: 10px;">MasterAI pulls from live web data and various AI models.</p>
    </div>
</div>

<script>
    function saveKey() { localStorage.setItem('masterai_key', document.getElementById('api-key').value); }
    window.onload = () => { document.getElementById('api-key').value = localStorage.getItem('masterai_key') || ''; };

    async function askMasterAI() {
        const promptInput = document.getElementById('prompt');
        const model = document.getElementById('model-select').value;
        const key = document.getElementById('api-key').value;
        const text = promptInput.value.trim();

        if (!text || !key) return alert("Enter a prompt and your OpenRouter API Key!");

        addMsg('user', text);
        promptInput.value = '';

        try {
            // MasterAI Logic: Connect to OpenRouter Aggregator
            const response = await fetch("https://openrouter.ai/api/v1/chat/completions", {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${key}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    "model": model,
                    "messages": [
                        {"role": "system", "content": "You are MasterAI. You have access to the internet and multiple models. Summarize information clearly."},
                        {"role": "user", "content": text}
                    ]
                })
            });

            const data = await response.json();
            const aiResponse = data.choices[0].message.content;
            addMsg('ai', aiResponse);

        } catch (e) {
            addMsg('ai', "MasterAI Error: Could not reach the selected brain. Check your API key.");
        }
    }

    function addMsg(role, text) {
        const div = document.createElement('div');
        div.className = `msg ${role === 'user' ? 'user' : 'ai'}`;
        div.innerHTML = marked.parse(text);
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    }
</script>
</body>
</html>
