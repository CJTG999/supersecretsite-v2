<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MasterAI | Universal Edition</title>
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
    <style>
        :root { --bg: #000; --accent: #007aff; --panel: #1a1a1a; --text: #eee; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; height: 100vh; }
        #chat { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #333; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 10px 15px; border-radius: 15px; line-height: 1.4; }
        .user { align-self: flex-end; background: var(--accent); }
        .ai { align-self: flex-start; background: var(--panel); }
        .footer { padding: 20px; display: flex; gap: 10px; background: #000; }
        input { flex: 1; background: var(--panel); border: 1px solid #333; color: #fff; padding: 12px; border-radius: 20px; outline: none; }
        button { background: var(--accent); border: none; color: #fff; padding: 10px 20px; border-radius: 20px; cursor: pointer; }
    </style>
</head>
<body>

<div id="chat">
    <header style="padding:15px; border-bottom:1px solid #333; font-weight:bold;">MASTERAI (Universal)</header>
    <div id="messages">
        <div class="msg ai">Hardware check bypassed. MasterAI is ready to assist.</div>
    </div>
    <div class="footer">
        <input type="text" id="userInput" placeholder="Ask anything...">
        <button onclick="ask()">Send</button>
    </div>
</div>

<script>
    async function ask() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        addMsg('user', text);
        input.value = '';

        try {
            // Official Puter.js call: This works without an API key or WebGPU
            const response = await puter.ai.chat(text, { model: 'gpt-4o-mini' });
            addMsg('ai', response.message.content);
        } catch (e) {
            addMsg('ai', "Error: Could not reach the AI. Try refreshing the page.");
        }
    }

    function addMsg(role, text) {
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.innerHTML = marked.parse(text);
        document.getElementById('messages').appendChild(div);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    }

    document.getElementById('userInput').addEventListener('keypress', (e) => { if(e.key === 'Enter') ask(); });
</script>
</body>
</html>
