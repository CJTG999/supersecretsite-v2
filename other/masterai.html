<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MasterAI - Free API Edition</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/9.1.2/marked.min.js"></script>
    <style>
        :root { --bg: #000; --blue: #007aff; --ai: #1c1c1e; --text: #fff; }
        body { margin: 0; background: var(--bg); color: var(--text); font-family: -apple-system, sans-serif; overflow: hidden; }
        #container { display: flex; height: 100vh; }
        #chat-side { flex: 1; display: flex; flex-direction: column; border-right: 1px solid #333; }
        header { padding: 15px; border-bottom: 1px solid #333; text-align: center; font-weight: bold; }
        #messages { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 85%; padding: 10px 15px; border-radius: 18px; line-height: 1.4; word-wrap: break-word; }
        .user { align-self: flex-end; background: var(--blue); border-bottom-right-radius: 4px; }
        .bot { align-self: flex-start; background: var(--ai); border-bottom-left-radius: 4px; }
        .footer { padding: 20px; display: flex; gap: 10px; background: #000; }
        input { flex: 1; background: #1c1c1e; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 20px; outline: none; }
        button { background: var(--blue); border: none; color: #fff; padding: 10px 20px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        #canvas { width: 0; display: none; padding: 20px; flex-direction: column; }
        #canvas-content { flex: 1; background: #111; border: 1px solid #333; border-radius: 10px; padding: 15px; font-family: monospace; overflow-y: auto; color: #ccc; }
        .hidden { display: none !important; }
    </style>
</head>
<body>

<div id="container">
    <div id="chat-side">
        <header>MasterAI (Free API Proxy)</header>
        <div id="messages"></div>
        <div class="footer">
            <input type="text" id="userInput" placeholder="Ask anything...">
            <button onclick="send()">Send</button>
        </div>
    </div>
    
    <div id="canvas">
        <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
            <span>WORKSPACE</span>
            <button onclick="toggleWS()" style="background:#333; font-size:12px; padding:5px 10px;">Close</button>
        </div>
        <div id="canvas-content" contenteditable="true"></div>
    </div>
</div>

<script>
    async function send() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text) return;

        addMsg('user', text);
        input.value = '';

        try {
            // Using the endpoint from ayaka14732/ChatGPTAPIFree
            const response = await fetch("https://chatgpt-api.shn.hk/v1/", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    model: "gpt-3.5-turbo",
                    messages: [{ role: "user", content: text }]
                })
            });

            const data = await response.json();
            const aiText = data.choices[0].message.content;

            // Simple "Canvas" detection
            if (aiText.includes("```")) {
                const code = aiText.match(/```([\s\S]*?)```/)[1];
                document.getElementById('canvas-content').innerText = code;
                if (document.getElementById('canvas').style.display !== 'flex') toggleWS();
                addMsg('bot', aiText.split("```")[0] + "\n\n*(Code sent to Workspace)*");
            } else {
                addMsg('bot', aiText);
            }
        } catch (e) {
            addMsg('bot', "Error: The free proxy might be down or rate-limited. Error: " + e.message);
        }
    }

    function addMsg(role, text) {
        const msgDiv = document.createElement('div');
        msgDiv.className = `msg ${role}`;
        msgDiv.innerHTML = marked.parse(text);
        document.getElementById('messages').appendChild(msgDiv);
        document.getElementById('messages').scrollTop = document.getElementById('messages').scrollHeight;
    }

    function toggleWS() {
        const cv = document.getElementById('canvas');
        const isVisible = cv.style.display === 'flex';
        cv.style.display = isVisible ? 'none' : 'flex';
        document.getElementById('chat-side').style.flex = isVisible ? "1" : "0 0 50%";
    }

    document.getElementById('userInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') send();
    });
</script>
</body>
</html>
