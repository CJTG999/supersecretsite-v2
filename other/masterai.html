<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MasterAI - Official Setup</title>
    <script id="puter-script" src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root { --bg: #000; --text: #fff; --blue: #007aff; --card: #1c1c1e; }
        body { margin: 0; font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); }
        #app { display: flex; flex-direction: column; height: 100vh; }
        header { padding: 15px; border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center; }
        #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 10px; }
        .msg { max-width: 80%; padding: 12px; border-radius: 15px; line-height: 1.4; }
        .user { align-self: flex-end; background: var(--blue); }
        .ai { align-self: flex-start; background: var(--card); }
        .footer { padding: 20px; background: #000; }
        .input-wrap { display: flex; background: var(--card); border-radius: 25px; padding: 5px 15px; border: 1px solid #333; }
        input { flex: 1; background: none; border: none; color: #fff; padding: 10px; outline: none; font-size: 16px; }
        button { background: none; border: none; color: var(--blue); font-weight: 600; cursor: pointer; }
        #status-bar { height: 3px; width: 0%; background: var(--blue); transition: 0.3s; }
    </style>
</head>
<body>

<div id="status-bar"></div>
<div id="app">
    <header>
        <span id="conn-text">Connecting...</span>
        <button onclick="location.reload()">Reload</button>
    </header>
    <div id="chat"></div>
    <div class="footer">
        <div class="input-wrap">
            <input type="text" id="prompt" placeholder="Ask MasterAI..." disabled>
            <button id="send-btn" onclick="ask()" disabled>Send</button>
        </div>
    </div>
</div>

<script>
    const status = document.getElementById('status-bar');
    const connText = document.getElementById('conn-text');
    const input = document.getElementById('prompt');
    const sendBtn = document.getElementById('send-btn');

    // --- Official Check for Puter Object ---
    let checkCount = 0;
    const checkPuter = setInterval(() => {
        checkCount++;
        status.style.width = (checkCount * 5) + "%";

        if (typeof puter !== 'undefined') {
            clearInterval(checkPuter);
            status.style.width = "100%";
            connText.innerText = "MasterAI Online";
            input.disabled = false;
            sendBtn.disabled = false;
            input.placeholder = "Type a message...";
        }

        // If it gets stuck at 80% (approx 16 checks), try the CORS Proxy
        if (checkCount === 16) {
            console.log("Direct connection failed. Attempting CORS Proxy...");
            connText.innerText = "Attempting Proxy...";
            const proxyScript = document.createElement('script');
            // Using a standard JS proxy to re-fetch the library
            proxyScript.src = "https://corsproxy.io/?https://js.puter.com/v2/";
            document.head.appendChild(proxyScript);
        }
        
        if (checkCount > 50) {
            clearInterval(checkPuter);
            connText.innerText = "Connection Failed. Please check internet/CORS.";
        }
    }, 200);

    async function ask() {
        const text = input.value;
        if (!text) return;
        
        appendMsg('user', text);
        input.value = '';

        try {
            // Official puter.ai.chat() usage from docs
            const response = await puter.ai.chat(text, {
                model: 'gpt-4o', // Default model in docs is gpt-5-nano, but gpt-4o is more stable
                system_message: "You are MasterAI. Be helpful and concise."
            });
            
            appendMsg('ai', response.message.content);
        } catch (err) {
            appendMsg('ai', "Error: " + err.message);
        }
    }

    function appendMsg(role, text) {
        const div = document.createElement('div');
        div.className = `msg ${role}`;
        div.innerHTML = marked.parse(text);
        document.getElementById('chat').appendChild(div);
        document.getElementById('chat').scrollTop = document.getElementById('chat').scrollHeight;
    }
</script>
</body>
</html>
