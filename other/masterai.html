<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MasterAI Workspace</title>
    <script src="https://js.puter.com/v2/"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        :root {
            --bg: #000000;
            --chat-bg: #000000;
            --user-blue: #007aff;
            --ai-gray: #262629;
            --accent: #8ab4f8;
            --text: #ffffff;
            --border: #333333;
            --canvas-bg: #111111;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; display: flex; height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg); color: var(--text); overflow: hidden;
        }

        /* --- Layout --- */
        #chat-section {
            flex: 1; min-width: 350px;
            display: flex; flex-direction: column;
            background: var(--chat-bg);
        }

        #resizer {
            width: 4px; cursor: col-resize;
            background: transparent; transition: background 0.3s;
            z-index: 100; flex-shrink: 0;
        }
        #resizer:hover, #resizer.active { background: #444; }

        #canvas-section {
            width: 0; display: none;
            flex-direction: column; background: var(--bg);
            padding: 20px; border-left: 1px solid var(--border);
        }

        /* --- Header --- */
        header { 
            padding: 15px 25px; font-size: 1.1rem; font-weight: 600; 
            text-align: center; border-bottom: 1px solid var(--border);
            color: #efeff4;
        }
        
        /* --- iOS Chat Bubbles --- */
        #messages { 
            flex: 1; overflow-y: auto; 
            padding: 20px; display: flex; flex-direction: column; 
            gap: 6px;
        }

        .msg {
            max-width: 75%;
            padding: 10px 16px;
            font-size: 16px;
            line-height: 1.4;
            width: fit-content;
            word-wrap: break-word;
        }

        .user-msg {
            align-self: flex-end;
            background: var(--user-blue);
            color: white;
            border-radius: 20px 20px 4px 20px;
        }

        .ai-msg {
            align-self: flex-start;
            background: var(--ai-gray);
            color: white;
            border-radius: 20px 20px 20px 4px;
        }

        /* --- Input Area --- */
        .input-wrapper { 
            padding: 15px 20px 35px; 
            display: flex; flex-direction: column; align-items: center; 
        }

        .input-container {
            background: #1c1c1e; border-radius: 25px; padding: 5px 12px;
            border: 1px solid var(--border); display: flex; align-items: flex-end; 
            gap: 8px; width: 100%; max-width: 700px;
        }

        textarea {
            flex: 1; background: transparent; border: none; color: white;
            padding: 10px 5px; outline: none; resize: none; font-size: 16px;
            max-height: 150px; font-family: inherit;
        }

        .icon-btn {
            background: none; border: none; cursor: pointer; padding: 6px;
            display: flex; align-items: center; justify-content: center;
            border-radius: 50%; width: 32px; height: 32px;
            transition: 0.2s;
        }

        #send-btn {
            background: #333; /* Darker when disabled */
        }

        #send-btn.ready {
            background: var(--user-blue);
        }

        svg { fill: white; width: 18px; height: 18px; }

        /* --- Buttons Styling --- */
        .center-btn-container {
            width: 100%; display: flex; justify-content: center; margin-top: 12px;
        }

        .btn {
            background: #2c2c2e; color: #007aff; border: none; padding: 8px 18px;
            border-radius: 20px; cursor: pointer; font-size: 14px; font-weight: 600;
            transition: 0.2s;
        }
        .btn:hover { background: #3a3a3c; }

        /* --- Canvas UI --- */
        .canvas-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 15px;
        }
        #canvas-content {
            flex: 1; background: var(--canvas-bg); border-radius: 12px;
            padding: 20px; border: 1px solid var(--border);
            font-family: 'SF Mono', 'Consolas', monospace; overflow-y: auto;
            white-space: pre-wrap; font-size: 14px; outline: none; color: #d1d1d6;
        }

        .hidden { display: none !important; }
    </style>
</head>
<body>

    <div id="chat-section">
        <header>MasterAI</header>
        <div id="messages">
            <div class="msg ai-msg">MasterAI is ready. How can I help you today?</div>
        </div>
        
        <div class="input-wrapper">
            <div class="input-container">
                <button class="icon-btn" onclick="document.getElementById('file-in').click()">
                    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
                </button>
                <input type="file" id="file-in" class="hidden" onchange="uploadFile()">
                
                <textarea id="user-input" rows="1" placeholder="iMessage" oninput="autoGrow(this)"></textarea>
                
                <button id="send-btn" class="icon-btn" onclick="askMasterAI()">
                    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
                </button>
            </div>
            
            <div class="center-btn-container">
                <button id="view-canvas-btn" class="btn hidden" onclick="toggleCanvas()">Open Workspace</button>
            </div>
        </div>
    </div>

    <div id="resizer" class="hidden"></div>

    <div id="canvas-section">
        <div class="canvas-header">
            <span style="font-size: 12px; font-weight: 700; color: #8e8e93; letter-spacing: 0.5px;">WORKSPACE</span>
            <div style="display: flex; gap: 8px;">
                <button class="btn" onclick="downloadCanvas()">Save</button>
                <button class="btn" style="color: #ff3b30;" onclick="toggleCanvas()">Close</button>
            </div>
        </div>
        <div id="canvas-content" contenteditable="true"></div>
    </div>

<script>
    const sendBtn = document.getElementById('send-btn');
    const userInput = document.getElementById('user-input');

    // Enable button immediately but check Puter status
    function checkPuterStatus() {
        if (typeof puter !== 'undefined') {
            sendBtn.classList.add('ready');
            return true;
        }
        return false;
    }
    setInterval(checkPuterStatus, 500);

    const chatSection = document.getElementById('chat-section');
    const canvasSection = document.getElementById('canvas-section');
    const resizer = document.getElementById('resizer');
    const canvasBtn = document.getElementById('view-canvas-btn');

    // Resize Logic
    let isResizing = false;
    resizer.addEventListener('mousedown', () => { isResizing = true; resizer.classList.add('active'); });
    document.addEventListener('mousemove', (e) => {
        if (!isResizing) return;
        let leftWidth = e.clientX;
        if (leftWidth > 300 && (window.innerWidth - leftWidth) > 300) {
            chatSection.style.flex = `0 0 ${leftWidth}px`;
            canvasSection.style.display = 'flex';
            resizer.classList.remove('hidden');
        }
    });
    document.addEventListener('mouseup', () => { isResizing = false; resizer.classList.remove('active'); });

    function toggleCanvas() {
        const isVisible = canvasSection.style.display === 'flex';
        if (isVisible) {
            canvasSection.style.display = 'none';
            resizer.classList.add('hidden');
            chatSection.style.flex = "1";
        } else {
            canvasSection.style.display = 'flex';
            resizer.classList.remove('hidden');
            chatSection.style.flex = "0 0 50%";
        }
    }

    function autoGrow(element) {
        element.style.height = "auto";
        element.style.height = (element.scrollHeight) + "px";
    }

    async function askMasterAI() {
        const text = userInput.value.trim();
        if (!text) return;
        
        if (typeof puter === 'undefined') {
            alert("MasterAI is still connecting to the cloud. Please try again in a moment.");
            return;
        }

        appendMsg('user', text);
        userInput.value = '';
        userInput.style.height = 'auto';

        try {
            const systemPrompt = `You are MasterAI. Always wrap code, scripts, or long documents in [CANVAS]...[/CANVAS] tags.`;
            const response = await puter.ai.chat(text, { model: 'gpt-4o', system_message: systemPrompt });
            const aiResponse = response.message.content;

            if (aiResponse.includes("[CANVAS]")) {
                const parts = aiResponse.split("[CANVAS]");
                appendMsg('ai', parts[0] + "\n\n*(Artifact available in workspace)*");
                document.getElementById('canvas-content').innerText = parts[1].split("[/CANVAS]")[0].trim();
                canvasBtn.classList.remove('hidden');
                if (canvasSection.style.display !== 'flex') toggleCanvas();
            } else {
                appendMsg('ai', aiResponse);
            }
        } catch (err) {
            appendMsg('ai', "Service Error: " + err.message);
        }
    }

    // Trigger send on Enter (but allow Shift+Enter for new lines)
    userInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            askMasterAI();
        }
    });

    function appendMsg(role, text) {
        const m = document.getElementById('messages');
        const d = document.createElement('div');
        d.className = `msg ${role}-msg`;
        d.innerHTML = marked.parse(text);
        m.appendChild(d);
        m.scrollTop = m.scrollHeight;
    }

    async function uploadFile() {
        const files = document.getElementById('file-in').files;
        if (!files.length) return;
        appendMsg('user', `Uploaded file: ${files[0].name}`);
        try {
            await puter.fs.upload(files);
            appendMsg('ai', "File received. How should MasterAI process it?");
        } catch (e) { appendMsg('ai', "Upload failed."); }
    }

    function downloadCanvas() {
        const content = document.getElementById('canvas-content').innerText;
        const blob = new Blob([content], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'masterai_output.txt';
        a.click();
    }
</script>
</body>
</html>
