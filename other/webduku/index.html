<title>WebDuku</title>
<style>
/* ---------- THEMES (one cohesive block color per theme) ---------- */
:root{
  --bg:#f3f3f6; --text:#1d2330; --muted:#7b8294;
  --board-bg:#c4c8d3; --grid-line:#c4c8d3;
  --zoneA:#e3e5ec; --zoneB:#f4f5f8;          /* alternating 3x3 zones */
  --block-rgb:47,59,82; --block:rgb(var(--block-rgb));
  --btn:#e3e5ec; --card:#ffffff;
  --board:min(94vw, calc(100vh - 340px), 540px);
  --board:min(94vw, calc(100dvh - 340px), 540px);
  --cell:calc((var(--board) - 32px) / 9);     /* 12px pad + 2*4px box gaps + 6*2px cell gaps */
  --tcell:calc(var(--cell) * .56);
}
:root[data-theme="dark"]{
  --bg:#101216; --text:#e8ebf3; --muted:#7f8798;
  --board-bg:#050608; --grid-line:#050608;
  --zoneA:#1a1d25; --zoneB:#252932;
  --block-rgb:223,227,238;
  --btn:#1d2027; --card:#1a1d25;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
body{position:fixed;inset:0;touch-action:manipulation}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}

#app{height:100vh;height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;
  padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left))}

/* ---------- HUD ---------- */
#hud{width:var(--board);display:grid;grid-template-columns:1fr auto 1fr;align-items:center}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat .lbl{font-size:11px;letter-spacing:.12em;color:var(--muted);font-weight:600}
.stat span:last-child{font-variant-numeric:tabular-nums;font-weight:700;font-size:20px}
.stat.main{align-items:center}
.stat.main span:last-child{font-size:38px}
.ctrls{display:flex;gap:6px;justify-content:flex-end}
.ctrls button,.ctrls a{width:34px;height:34px;border-radius:50%;background:var(--btn);display:grid;place-items:center;color:inherit;text-decoration:none}
.ctrls svg{width:18px;height:18px}
#btnSound .mute{display:none}
#btnSound.off .waves{display:none}
#btnSound.off .mute{display:block}
#milestone{width:var(--board);font-size:11px;color:var(--muted)}
.mtext{display:flex;justify-content:space-between;margin-bottom:4px;letter-spacing:.04em}
.mtext b{color:var(--text);font-variant-numeric:tabular-nums}
.mbar{height:4px;border-radius:2px;background:var(--btn);overflow:hidden}
.mbar i{display:block;height:100%;width:0;background:var(--block);border-radius:2px;transition:width .35s ease}

/* ---------- BOARD ---------- */
#boardWrap{position:relative}
#board{width:var(--board);height:var(--board);background:var(--board-bg);border-radius:14px;padding:6px;
  display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:4px}
.box{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:2px;background:var(--grid-line);border-radius:6px;overflow:hidden}
.box.zA{--zone:var(--zoneA)} .box.zB{--zone:var(--zoneB)}
.cell{background:var(--zone);border-radius:3px}
.cell.f,.pc{background:var(--block);box-shadow:inset 0 2px 0 rgba(255,255,255,.18),inset 0 -2px 0 rgba(0,0,0,.18)}
.cell.ghost{background:rgba(var(--block-rgb),.42);box-shadow:none}
.cell.pre{animation:pulse .5s ease-in-out infinite alternate}

#popLayer{position:absolute;inset:0;pointer-events:none;display:grid;place-items:center}
.pop{grid-area:1/1;text-align:center;animation:rise 1s ease-out forwards;text-shadow:0 2px 12px var(--bg),0 0 4px var(--bg)}
.pop b{display:block;font-size:34px;font-weight:800}
.pop span{display:block;font-size:14px;font-weight:700;letter-spacing:.1em;color:var(--muted)}
@keyframes rise{0%{transform:translateY(10px) scale(.8);opacity:0}15%{transform:translateY(0) scale(1.05);opacity:1}70%{opacity:1}100%{transform:translateY(-40px);opacity:0}}

/* ---------- TRAY ---------- */
#tray{width:var(--board);display:flex;gap:8px}
.slot{flex:1;height:calc(var(--tcell) * 5 + 24px);display:flex;align-items:center;justify-content:center;touch-action:none;border-radius:12px}
.piece{display:grid;pointer-events:none}
.pc{border-radius:22%}
.pc.off{visibility:hidden}
.piece.lifted{opacity:.2}
.piece.dead{opacity:.3}
.piece.drag{position:fixed;left:0;top:0;z-index:50;transform-origin:center;filter:drop-shadow(0 10px 10px rgba(0,0,0,.3))}

/* ---------- OVERLAY ---------- */
#overlay{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px)}
#overlay.hidden{display:none}
.card{background:var(--card);border-radius:22px;padding:28px 26px 22px;width:min(84vw,320px);text-align:center;box-shadow:0 20px 60px rgba(0,0,0,.35);animation:pop .25s ease-out}
.card h2{margin:0 0 6px;font-size:26px}
.card p{margin:0 0 6px;color:var(--muted);font-size:15px;line-height:1.4}
.card .big{font-size:44px;font-weight:800;color:var(--text);font-variant-numeric:tabular-nums;margin:4px 0}
.card .btn{display:block;width:100%;padding:14px;border-radius:14px;font-weight:700;font-size:16px;margin-top:12px;background:var(--block);color:var(--bg)}
.card .btn.alt{background:var(--btn);color:var(--text)}
.card .btn[hidden]{display:none}
#historyPanel[hidden]{display:none}
#historyPanel{margin-top:14px;text-align:left}
#historyStats{font-size:13px;color:var(--muted);line-height:1.5;margin-bottom:10px;text-align:center}
#historyList{max-height:min(42vh,340px);overflow:auto;display:flex;flex-direction:column;gap:7px;padding-right:2px}
.history-row{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 12px;border-radius:11px;background:var(--btn);font-size:13px}
.history-row strong{font-size:16px;font-variant-numeric:tabular-nums}
.history-row small{display:block;color:var(--muted);margin-top:2px}
#historyPanel .btn{margin-top:12px}

/* ---------- iOS install hint ---------- */
#a2hs{position:fixed;left:0;right:0;margin:0 auto;bottom:max(14px,env(safe-area-inset-bottom));width:min(92vw,380px);z-index:60;
  display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:16px;background:var(--card);color:var(--text);
  font-size:14px;line-height:1.35;box-shadow:0 8px 30px rgba(0,0,0,.28);animation:pop .25s ease-out}
#a2hs.hidden{display:none}
#a2hs svg{width:18px;height:18px;vertical-align:-4px}
#a2hs button{margin-left:auto;flex:none;width:28px;height:28px;border-radius:50%;background:var(--btn);display:grid;place-items:center;font-size:13px}
</style>
</head>

  <div id="standardOverlay">

<script>
'use strict';
/* =====================================================================
   TUNING CONSTANTS  — edit these to change feel, difficulty and pacing
   ===================================================================== */

/* Scoring: deliberately low-inflation. Placing blocks is nearly worthless;
   points come from clears.  score(clear) = units * perUnitCleared * multi * combo
     multi = min(multiCap, 1 + multiStep * (units - 1))      // several lines/boxes at once
     combo = min(comboCap, 1 + comboStep * (comboCount - 1)) // consecutive clearing turns      */
const SCORE_CONFIG = {
  perBlockPlaced : 1,      // points per block cell placed
  perUnitCleared : 30,     // points per cleared row / column / 3x3 box (25-40 recommended)
  multiStep      : 0.25,   // +25% per extra unit cleared by the same piece
  multiCap       : 3.0,
  comboStep      : 0.10,   // +10% per consecutive clearing placement
  comboCap       : 1.5,
  comboWindow    : 3,      // combo breaks after this many placements in a row WITHOUT a clear
  milestones     : [250, 500, 1000, 2500, 5000, 7500, 10000],  // then every +5000
};

/* Smart spawner: how helpful / how forgiving the tray dealer is. */
const SPAWN_CONFIG = {
  assist             : 0.60,  // 0 = pure random ... 1 = every slot (up to maxHelpers) tries to help
  maxHelpers         : 2,     // at most this many "completing" pieces per tray (keeps some variety)
  nearEmptyMax       : 3,     // a row/col/box with 1..N empty cells counts as an "opportunity"
  heatPower          : 2,     // emphasis on the most-complete units (higher = more focused)
  completeBonus      : 12,    // weight per unit a piece would actually complete
  heatBonus          : 1.5,   // weight per "heat" a piece would fill in near-complete units
  crowdStart         : 0.35,  // board fill fraction where small pieces start being favored...
  crowdEnd           : 0.75,  // ...reaching full effect here
  crowdSizePenalty   : 1.6,   // how strongly big pieces are discouraged on a crowded board
  unfitPenalty       : 0.12,  // weight multiplier for pieces with no legal placement
  familyRepeatPenalty: 0.35,  // weight multiplier for repeating a shape family in one tray
  frustrationMinEmpty: 0.30,  // if >= this fraction of board is empty, require a solvable tray
  solveAttempts      : 5,     // keep tray generation responsive
  solveBudget        : 700,   // bounded DFS node cap (if hit, tray is assumed fine)
};

/* Touch / drag feel. */
const MOBILE_POINTER = window.matchMedia('(pointer: coarse)').matches;
const UI_CONFIG = {
  liftMinPx  : MOBILE_POINTER ? 48 : 40,
  liftCells  : MOBILE_POINTER ? 1.15 : 1.3,
  snapRadius : MOBILE_POINTER ? 2 : 1,
  snapMaxDist: MOBILE_POINTER ? 1.7 : 1.0,
};

/* =====================================================================
   PIECE LIBRARY  ('#' = block). rot:true generates all unique rotations.
   ===================================================================== */
const DEFAULT_FAMILIES = [
  { name:'dot',   w:2,   rot:false, shape:'#' },
  { name:'domino',w:5,   rot:true,  shape:'##' },
  { name:'I3',    w:5,   rot:true,  shape:'###' },
  { name:'L3',    w:6,   rot:true,  shape:'#./##' },          // small corner (4 orientations)
  { name:'I4',    w:4,   rot:true,  shape:'####' },
  { name:'O4',    w:4,   rot:false, shape:'##/##' },
  { name:'L4',    w:4,   rot:true,  shape:'#./#./##' },
  { name:'J4',    w:4,   rot:true,  shape:'.#/.#/##' },
  { name:'T4',    w:4,   rot:true,  shape:'###/.#.' },
  { name:'S4',    w:3,   rot:true,  shape:'.##/##.' },
  { name:'Z4',    w:3,   rot:true,  shape:'##./.##' },
  { name:'I5',    w:2.5, rot:true,  shape:'#####' },
  { name:'plus',  w:2,   rot:false, shape:'.#./###/.#.' },
  { name:'V5',    w:2,   rot:true,  shape:'#../#../###' },    // big corner
  { name:'U5',    w:2,   rot:true,  shape:'#.#/###' },
  { name:'T5',    w:1.5, rot:true,  shape:'###/.#./.#.' },
  { name:'W5',    w:1.5, rot:true,  shape:'#../##./.##' },    // step
  { name:'R6',    w:2,   rot:true,  shape:'###/###' },
  { name:'O9',    w:1,   rot:false, shape:'###/###/###' },
];
function loadBlockFamilies() {
  try {
    const saved = JSON.parse(localStorage.getItem('wd_custom_families') || 'null');
    if (!Array.isArray(saved) || !saved.length) return DEFAULT_FAMILIES;
    const valid = saved.filter(f =>
      f && typeof f.name === 'string' && /^[a-z0-9_-]{1,24}$/i.test(f.name) &&
      Number.isFinite(+f.w) && +f.w > 0 && +f.w <= 100 &&
      typeof f.shape === 'string' && f.shape.length <= 100 &&
      f.shape.split('/').length <= 9 &&
      f.shape.split('/').every(row => row.length > 0 && row.length <= 9 && /^[#.]+$/.test(row)) &&
      f.shape.split('/').every(row => row.length === f.shape.split('/')[0].length) &&
      f.shape.includes('#')
    ).map(f => ({ name:f.name, w:+f.w, rot:!!f.rot, shape:f.shape }));
    const names = new Set();
    const unique = valid.filter(f => !names.has(f.name) && names.add(f.name));
    return unique.length ? unique : DEFAULT_FAMILIES;
  } catch (error) { return DEFAULT_FAMILIES; }
}
const FAMILIES = loadBlockFamilies();
const parseShape = s => s.split('/').map(r => [...r].map(ch => ch === '#' ? 1 : 0));
const rotateM = m => { const h=m.length, w=m[0].length, o=Array.from({length:w},()=>Array(h).fill(0));
  for (let r=0;r<h;r++) for (let c=0;c<w;c++) o[c][h-1-r]=m[r][c]; return o; };
const matKey = m => m.map(r => r.join('')).join('/');
const PIECES = [];
for (const fam of FAMILIES) {
  let m = parseShape(fam.shape); const seen = new Set(), list = [];
  for (let i = 0; i < (fam.rot ? 4 : 1); i++) { const k = matKey(m); if (!seen.has(k)) { seen.add(k); list.push(m); } m = rotateM(m); }

/* =====================================================================

const UNITS = (() => {                 // 0-8 rows, 9-17 columns, 18-26 3x3 boxes
  const u = [];
  for (let r=0;r<9;r++) u.push(Array.from({length:9},(_,c)=>r*9+c));
  for (let c=0;c<9;c++) u.push(Array.from({length:9},(_,r)=>r*9+c));

/* ---- smart spawner ---- */

/* ---------- game flow ---------- */
function newGame() {

  tray = generateSmartTray(board); ov.classList.add('hidden');
  renderBoard(); renderTray(); updateHUD(); save();
}
function loadGame() {

    const t = s.tray.map(k => k ? PIECE_BY_KEY[k] : null); if (t.some((p, i) => s.tray[i] && !p)) return false;
    board = s.board.map(v => v ? 1 : 0); tray = t; score = +s.score || 0; combo = +s.combo || 0; sinceClear = +s.sinceClear || 0;
    if (tray.every(p => !p)) tray = generateSmartTray(board);
    over = false; busy = false; bestAtStart = best; renderBoard(); renderTray(); updateHUD(); checkGameOver(); return true;
  } catch (e) { return false; }
}

  // Update the board in one pass. No cell scaling, fading, or delayed tile cleanup.

    combo++;

const desktopResetShortcut = window.matchMedia('(hover: hover) and (pointer: fine)').matches &&
  !/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent);
if (desktopResetShortcut) {
  document.addEventListener('keydown', e => {
    if (!e.shiftKey || e.ctrlKey || e.altKey || e.metaKey || e.key.toLowerCase() !== 'r') return;
    const target = e.target;
    if (target && (target.isContentEditable || /^(INPUT|TEXTAREA|SELECT)$/.test(target.tagName))) return;
    e.preventDefault();
    if (!busy && !drag) showOverlay('confirm');
  });
}
$('historyClose').onclick = () => ov.classList.add('hidden');
async function resetGame() {
  const resetButton = $('ovPrimary');
  resetButton.disabled = true;
  resetButton.textContent = 'Resetting…';

  // The game itself is saved in localStorage. Clear only the current board;
  // keep the best score and completed-game history.
  store.del('wd_state');

  // Remove leftovers from older WebDuku versions that used a service worker.
  await removeLegacyOfflineFiles();

  // A unique URL makes the browser request a fresh HTML document.
  const url = new URL(location.href);
  url.searchParams.set('wd-refresh', Date.now().toString());
  location.replace(url.href);
}

async function removeLegacyOfflineFiles() {
  try {
    if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      const registrations = await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations
        .filter(registration => {
          const scope = new URL(registration.scope);
          return scope.origin === location.origin &&
                 scope.pathname.startsWith(location.pathname.replace(/[^/]*$/, ''));
        })
        .map(registration => registration.unregister()));
    }
  } catch (error) {}

  // One-time cleanup of Cache API entries created by previous releases.
  try {
    if ('caches' in window) {
      const names = await caches.keys();
      await Promise.all(names
        .filter(name => name.startsWith('webduku-'))
        .map(name => caches.delete(name)));
    }
  } catch (error) {}
}

// Remove old service-worker/offline caching automatically. New versions use
// ordinary browser loading; localStorage remains responsible for game saves.
removeLegacyOfflineFiles();
syncSound();
document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
document.addEventListener('visibilitychange', () => { if (document.hidden && board && !over) save(); });

if (!loadGame()) newGame();

/* ---------- iOS "Add to Home Screen" hint ---------- */
/* Service-worker registration intentionally removed: WebDuku uses normal
   browser loading and localStorage for its persistent game data. */
(function () {
  const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  const standalone = navigator.standalone === true || (window.matchMedia && matchMedia('(display-mode: standalone)').matches);
  if (!isIOS || standalone || store.get('wd_a2hs', '0') === '1') return;
  const el = $('a2hs');
  $('a2hsClose').onclick = () => { el.classList.add('hidden'); store.set('wd_a2hs', '1'); };
  setTimeout(() => el.classList.remove('hidden'), 2500);
  setTimeout(() => el.classList.add('hidden'), 16000);
})();
</script>
