<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Poxel-style FPS (P2P)</title>
<style>
  body { margin: 0; overflow: hidden; font-family: sans-serif; }
  #ui {
    position: fixed;
    top: 10px;
    left: 10px;
    background: rgba(0,0,0,0.6);
    color: white;
    padding: 10px;
    width: 320px;
  }
  textarea { width: 100%; height: 80px; }
  button { width: 100%; margin-top: 4px; }
</style>
</head>
<body>
<div id="ui">
  <b>P2P Connect</b><br>
  <button id="hostBtn">Host</button>
  <button id="joinBtn">Join</button>
  <textarea id="signal"></textarea>
  <small>Copy / paste offers & answers</small>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.158/build/three.min.js"></script>

<script>
/* ------------------ THREE.JS FPS ------------------ */
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x87ceeb);

const camera = new THREE.PerspectiveCamera(75, innerWidth/innerHeight, 0.1, 1000);
camera.position.y = 1.6;

const renderer = new THREE.WebGLRenderer();
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const light = new THREE.HemisphereLight(0xffffff, 0x444444);
scene.add(light);

// Ground (voxely)
const groundGeo = new THREE.BoxGeometry(50, 1, 50);
const groundMat = new THREE.MeshStandardMaterial({ color: 0x55aa55 });
const ground = new THREE.Mesh(groundGeo, groundMat);
ground.position.y = -0.5;
scene.add(ground);

// Player
let yaw = 0, pitch = 0;
const speed = 0.08;
const keys = {};

document.body.addEventListener("click", () => {
  document.body.requestPointerLock();
});

document.addEventListener("mousemove", e => {
  if (document.pointerLockElement) {
    yaw -= e.movementX * 0.002;
    pitch -= e.movementY * 0.002;
    pitch = Math.max(-1.5, Math.min(1.5, pitch));
  }
});

document.addEventListener("keydown", e => keys[e.code] = true);
document.addEventListener("keyup", e => keys[e.code] = false);

const raycaster = new THREE.Raycaster();

/* ------------------ SHOOTING ------------------ */
document.addEventListener("mousedown", () => {
  raycaster.setFromCamera(new THREE.Vector2(0,0), camera);
  const hits = raycaster.intersectObjects(scene.children);
  if (hits.length) console.log("Hit", hits[0].object.uuid);
});

/* ------------------ REMOTE PLAYER ------------------ */
const remote = new THREE.Mesh(
  new THREE.BoxGeometry(1,1.6,1),
  new THREE.MeshStandardMaterial({ color: 0xff4444 })
);
scene.add(remote);

/* ------------------ WEBRTC ------------------ */
let pc, channel;

const config = {
  iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
};

function createPC() {
  pc = new RTCPeerConnection(config);

  pc.onicecandidate = e => {
    if (e.candidate) return;
    signal.value = JSON.stringify(pc.localDescription);
  };

  pc.ondatachannel = e => setupChannel(e.channel);
}

function setupChannel(ch) {
  channel = ch;
  channel.onmessage = e => {
    const data = JSON.parse(e.data);
    remote.position.set(data.x, data.y, data.z);
    remote.rotation.y = data.r;
  };
}

/* HOST */
hostBtn.onclick = async () => {
  createPC();
  setupChannel(pc.createDataChannel("game"));

  const offer = await pc.createOffer();
  await pc.setLocalDescription(offer);
};

/* JOIN */
joinBtn.onclick = async () => {
  createPC();
  const offer = JSON.parse(signal.value);
  await pc.setRemoteDescription(offer);

  const answer = await pc.createAnswer();
  await pc.setLocalDescription(answer);
};

/* APPLY ANSWER */
signal.addEventListener("change", async () => {
  if (!pc || pc.remoteDescription) return;
  try {
    const answer = JSON.parse(signal.value);
    await pc.setRemoteDescription(answer);
  } catch {}
});

/* ------------------ GAME LOOP ------------------ */
function animate() {
  requestAnimationFrame(animate);

  camera.rotation.set(pitch, yaw, 0);

  const dir = new THREE.Vector3(
    Math.sin(yaw), 0, Math.cos(yaw)
  );

  if (keys["KeyW"]) camera.position.addScaledVector(dir, -speed);
  if (keys["KeyS"]) camera.position.addScaledVector(dir, speed);
  if (keys["KeyA"]) camera.position.x -= speed;
  if (keys["KeyD"]) camera.position.x += speed;

  if (channel?.readyState === "open") {
    channel.send(JSON.stringify({
      x: camera.position.x,
      y: camera.position.y,
      z: camera.position.z,
      r: yaw
    }));
  }

  renderer.render(scene, camera);
}
animate();

window.addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
