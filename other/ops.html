<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Poxel-style FPS (Pure P2P)</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: sans-serif; }
    #ui {
      position: fixed;
      top: 10px;
      left: 10px;
      background: rgba(0, 0, 0, 0.65);
      color: white;
      padding: 10px;
      width: 320px;
      z-index: 10;
    }
    textarea { width: 100%; height: 90px; }
    button { width: 100%; margin-top: 4px; }
    #loadingBar {
      width: 100%;
      height: 5px;
      background-color: #444;
      margin-top: 10px;
      display: none;
    }
    #progress { height: 100%; background-color: #0c9; width: 0%; }
  </style>
</head>
<body>
  <div id="ui">
    <b>P2P Multiplayer</b><br>
    <button id="hostBtn">Host</button>
    <button id="joinBtn">Join</button>
    <textarea id="signal" placeholder="Copy and paste offer/answer"></textarea>
    <small>Manual copy-paste. No server.</small>
    <div id="loadingBar">
      <div id="progress"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.158/build/three.min.js"></script>

  <script>
    /* ================= THREE.JS SETUP ================= */
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 1000);
    camera.position.set(0, 1.6, 5);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444));

    const ground = new THREE.Mesh(
      new THREE.BoxGeometry(50, 1, 50),
      new THREE.MeshStandardMaterial({ color: 0x55aa55 })
    );
    ground.position.y = -0.5;
    scene.add(ground);

    /* ================= PLAYER CONTROLS ================= */
    let yaw = 0, pitch = 0;
    const speed = 0.08;
    const keys = {};

    document.body.addEventListener("click", () => {
      document.body.requestPointerLock();
    });

    document.addEventListener("mousemove", e => {
      if (document.pointerLockElement) {
        yaw -= e.movementX * 0.002;
        pitch -= e.movementY * 0.002;
        pitch = Math.max(-1.5, Math.min(1.5, pitch));
      }
    });

    document.addEventListener("keydown", e => keys[e.code] = true);
    document.addEventListener("keyup", e => keys[e.code] = false);

    /* ================= REMOTE PLAYER ================= */
    const remote = new THREE.Mesh(
      new THREE.BoxGeometry(1, 1.6, 1),
      new THREE.MeshStandardMaterial({ color: 0xff4444 })
    );
    scene.add(remote);

    /* ================= WEBRTC (FIXED) ================= */
    let pc, channel;

    const signal = document.getElementById("signal");
    const hostBtn = document.getElementById("hostBtn");
    const joinBtn = document.getElementById("joinBtn");
    const loadingBar = document.getElementById("loadingBar");
    const progress = document.getElementById("progress");

    const config = {
      iceServers: [{ urls: "stun:stun.l.google.com:19302" }]
    };

    function createPC() {
      pc = new RTCPeerConnection(config);

      pc.onicecandidate = e => {
        if (!e.candidate) {
          console.log("ICE gathering complete");
          signal.value = JSON.stringify(pc.localDescription, null, 2);  // Show offer in textarea
          console.log("Offer set in textarea. Copy and paste it!");
          progress.style.width = "100%";  // Full progress when the ICE gathering is done
          setTimeout(() => { loadingBar.style.display = "none"; }, 500); // Hide bar after a moment
        } else {
          updateProgress(50);  // Midway through ICE gathering
        }
      };

      pc.ondatachannel = e => setupChannel(e.channel);
    }

    function setupChannel(ch) {
      channel = ch;

      channel.onopen = () => {
        console.log("DataChannel open");
        progress.style.width = "100%";  // Full progress when DataChannel is open
        setTimeout(() => { loadingBar.style.display = "none"; }, 500); // Hide bar after a moment
      };

      channel.onmessage = e => {
        const data = JSON.parse(e.data);
        remote.position.set(data.x, data.y, data.z);
        remote.rotation.y = data.r;
      };
    }

    /* Update Progress Bar */
    function updateProgress(percent) {
      progress.style.width = `${percent}%`;
      loadingBar.style.display = "block"; // Show the loading bar
    }

    /* HOST */
    hostBtn.onclick = async () => {
      console.log("Hosting...");
      loadingBar.style.display = "block";  // Show loading bar when starting
      updateProgress(10);  // Starting the process

      createPC();

      channel = pc.createDataChannel("game");
      setupChannel(channel);

      const offer = await pc.createOffer();
      await pc.setLocalDescription(offer);
      updateProgress(30);  // Update progress after creating the offer
    };

    /* JOIN */
    joinBtn.onclick = async () => {
      console.log("Joining...");
      loadingBar.style.display = "block";  // Show loading bar when starting
      updateProgress(10);  // Starting the process

      createPC();

      const offer = JSON.parse(signal.value);
      await pc.setRemoteDescription(offer);
      updateProgress(50);  // Progress after receiving offer

      const answer = await pc.createAnswer();
      await pc.setLocalDescription(answer);
      updateProgress(70);  // Progress after creating answer
    };

    /* APPLY ANSWER BACK TO HOST */
    signal.addEventListener("input", async () => {
      if (!pc || pc.remoteDescription) return;

      try {
        const desc = JSON.parse(signal.value);
        if (desc.type === "answer") {
          await pc.setRemoteDescription(desc);
          console.log("Answer applied");
          updateProgress(100);  // Full progress once answer is applied
        }
      } catch {}
    });

    /* ================= GAME LOOP ================= */
    function animate() {
      requestAnimationFrame(animate);

      camera.rotation.set(pitch, yaw, 0);

      const forward = new THREE.Vector3(Math.sin(yaw), 0, Math.cos(yaw));

      if (keys["KeyW"]) camera.position.addScaledVector(forward, -speed);
      if (keys["KeyS"]) camera.position.addScaledVector(forward, speed);
      if (keys["KeyA"]) camera.position.x -= speed;
      if (keys["KeyD"]) camera.position.x += speed;

      if (channel?.readyState === "open") {
        channel.send(JSON.stringify({
          x: camera.position.x,
          y: camera.position.y,
          z: camera.position.z,
          r: yaw
        }));
      }

      renderer.render(scene, camera);
    }
    animate();

    window.addEventListener("resize", () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
