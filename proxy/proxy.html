    <title>Redirecting...</title>
    
    <style>
        /* --- CUSTOM CURSOR FIX --- */

        /* 1. Apply to the root and body */
        html, body {
            cursor: url('https://codehs.com/uploads/471381c796bfff3712cd05b64b44142a'), auto !important;
            min-height: 100vh;
        }

        /* 2. Apply to all interactive elements */
        /* We include 'a' tags, buttons, and tailwind-style pointer classes */
        a, 
        button, 
        input, 
        select, 
        textarea, 
        .cursor-pointer, 
        #keystroke-tester-container div,
        [role="button"] {
            cursor: url('https://codehs.com/uploads/83f80767e459872bcd2a56d8cc903e59'), pointer !important;
        }

        /* 3. Special fix for iframes/modals */
        #gameModal, .bg-gray-900-transparent {
            cursor: url('https://codehs.com/uploads/471381c796bfff3712cd05b64b44142a'), auto !important;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            background-color: #f9f9f9;
            color: #333;
        }

        /* The Spinner */
        .loader {
            border: 5px solid #f3f3f3;
            border-top: 5px solid #3498db;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .message {
            text-align: center;
        }

        a {
            color: #3498db;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="loader"></div>

    <div class="message">
        <h2>Hold on, we're moving!</h2>
        <p>You will be redirected in 5 seconds...</p>
        <p><small>Not working? reload.</a></small></p>
    </div>

</body>
