<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>sss - home</title>
<link rel="icon" href="https://codehs.com/uploads/c69638d51ac51123c4b70ad422b59760">
<style>
    /* --- CUSTOM CURSOR (kept from the original) --- */
    html, body {
        cursor: url('https://codehs.com/uploads/471381c796bfff3712cd05b64b44142a'), auto !important;
    }
    a, button, input, select, textarea, .row, .arrow, .btn-hint, [role="button"] {
        cursor: url('https://codehs.com/uploads/83f80767e459872bcd2a56d8cc903e59'), pointer !important;
    }

    :root {
        --green: #7ac143;
        --lime: #9bf00b;
        --deep: #031003;
        --dim: #8fae8b;
        --step: 76px;
        --rowh: 68px;
        --orb: clamp(220px, 30vw, 380px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }
    body:focus { outline: none; }
    body {
        font-family: 'Segoe UI', 'Trebuchet MS', Tahoma, Verdana, sans-serif;
        color: #fff;
        background: #010601;
        -webkit-tap-highlight-color: transparent;
    }

    /* ---------- BACKGROUND ---------- */
    #bg { position: fixed; inset: 0; z-index: 0; overflow: hidden;
        background:
            radial-gradient(ellipse 60% 70% at 24% 50%, rgba(60,150,40,.55) 0%, rgba(15,60,15,.35) 40%, rgba(0,0,0,0) 75%),
            radial-gradient(ellipse 90% 90% at 80% 60%, rgba(20,70,20,.35) 0%, rgba(0,0,0,0) 70%),
            linear-gradient(160deg, #041304 0%, #010501 60%, #000 100%);
    }
    #bg::after { /* fine dot grid, like the dashboard's mesh */
        content: ''; position: absolute; inset: 0; opacity: .5;
        background-image: radial-gradient(rgba(155,240,11,.22) 1px, transparent 1.4px);
        background-size: 26px 26px;
        -webkit-mask-image: radial-gradient(ellipse 80% 80% at 35% 50%, #000 0%, transparent 85%);
                mask-image: radial-gradient(ellipse 80% 80% at 35% 50%, #000 0%, transparent 85%);
    }
    .beam {
        position: absolute; top: -30%; width: 38vw; height: 160%;
        background: linear-gradient(90deg, transparent, rgba(140,255,80,.07), transparent);
        transform-origin: top center; filter: blur(8px);
        animation: sway 18s ease-in-out infinite alternate;
    }
    .beam.b1 { left: 4%;  transform: rotate(18deg); }
    .beam.b2 { left: 28%; transform: rotate(-12deg); animation-duration: 25s; animation-delay: -6s; opacity: .8; }
    .beam.b3 { left: 52%; transform: rotate(26deg);  animation-duration: 31s; animation-delay: -12s; opacity: .55; }
    @keyframes sway { from { translate: -4vw 0; } to { translate: 6vw 0; } }
    #fx { position: absolute; inset: 0; width: 100%; height: 100%; }
    #flash { position: fixed; inset: 0; z-index: 50; background: radial-gradient(circle at 30% 50%, #eaffcf, #7ac143 60%, #0b2a0b);
        opacity: 0; pointer-events: none; transition: opacity .22s ease-in; }
    #flash.on { opacity: .9; }

    /* ---------- LAYOUT ---------- */
    #app { position: relative; z-index: 1; height: 100%; display: grid; grid-template-columns: 42% 58%; }

    /* ---------- LEFT: ORB + TITLE ---------- */
    .left { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px 20px; text-align: center; }
    .orb-wrap { position: relative; width: var(--orb); height: var(--orb); margin-bottom: clamp(18px, 4vh, 40px); animation: orbIn 1.1s cubic-bezier(.2,.9,.2,1) both; }
    @keyframes orbIn { from { transform: scale(.55); opacity: 0; filter: blur(14px); } to { transform: none; opacity: 1; filter: none; } }
    .halo { position: absolute; inset: -22%; border-radius: 50%;
        background: radial-gradient(circle, rgba(130,255,60,.38) 0%, rgba(130,255,60,.12) 40%, transparent 68%);
        animation: pulse 4.5s ease-in-out infinite; }
    @keyframes pulse { 0%,100% { transform: scale(.94); opacity: .7; } 50% { transform: scale(1.06); opacity: 1; } }
    .orb { position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
        background:
            radial-gradient(circle at 30% 24%, rgba(255,255,255,.55) 0, rgba(255,255,255,0) 17%),
            radial-gradient(circle at 50% 50%, #74e63c 0%, #2f9a22 44%, #0c3f0c 76%, #021402 100%);
        box-shadow: 0 0 70px 8px rgba(110,230,58,.38), inset -22px -34px 70px rgba(0,0,0,.65), inset 12px 12px 44px rgba(200,255,150,.35);
    }
    .swirl { position: absolute; inset: 4%; border-radius: 50%; filter: blur(7px); mix-blend-mode: screen;
        background: conic-gradient(from 0deg, transparent 0, rgba(255,255,255,.28) 10%, transparent 28%, rgba(0,0,0,.35) 52%, transparent 68%, rgba(190,255,130,.3) 84%, transparent 100%);
        animation: spin 14s linear infinite; }
    .swirl.s2 { inset: 14%; opacity: .7; animation-duration: 22s; animation-direction: reverse; }
    .shine { position: absolute; inset: 0; border-radius: 50%;
        background: radial-gradient(ellipse 60% 30% at 38% 14%, rgba(255,255,255,.35), transparent 70%); }
    .ring { position: absolute; border-radius: 50%; border: 2px solid rgba(155,240,11,.45); }
    .ring.r1 { inset: -7%; border-color: rgba(155,240,11,.5) transparent rgba(155,240,11,.15) transparent; animation: spin 9s linear infinite; }
    .ring.r2 { inset: -15%; border: 1px dashed rgba(155,240,11,.28); animation: spin 26s linear infinite reverse; }
    .ring.r3 { inset: -24%; border-color: rgba(155,240,11,.18) transparent transparent rgba(155,240,11,.18); animation: spin 38s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .logo { position: absolute; left: 50%; top: 50%; width: 44%; height: 44%; translate: -50% -50%;
        border-radius: 50%; object-fit: cover; border: 3px solid rgba(255,255,255,.85); background: #101810;
        box-shadow: 0 0 30px rgba(0,0,0,.55), 0 0 22px rgba(155,240,11,.5);
        animation: bob 6s ease-in-out infinite; }
    @keyframes bob { 0%,100% { translate: -50% -52%; } 50% { translate: -50% -48%; } }

    .title-block { animation: fadeUp .9s .35s both; }
    @keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    h1 { font-weight: 300; font-size: clamp(26px, 3.2vw, 44px); letter-spacing: .16em; text-transform: uppercase;
        text-shadow: 0 0 22px rgba(155,240,11,.55), 0 2px 0 rgba(0,0,0,.6); }
    h1 b { font-weight: 700; color: var(--lime); }
    .handle { display: block; margin-top: 8px; color: var(--lime); font-family: Consolas, monospace; font-weight: bold; letter-spacing: .08em; font-size: 15px; opacity: .9; }
    .about { max-width: 360px; margin: 18px auto 0; font-size: 13px; line-height: 1.55; color: var(--dim); }
    .about a { color: var(--lime); text-decoration: none; border-bottom: 1px dotted rgba(155,240,11,.5); word-break: break-all; }
    .about a:hover { color: #fff; }
    .foot { position: fixed; left: 0; bottom: 14px; width: 42%; text-align: center; font-family: monospace; font-size: 11px; color: #3f5a3b; }

    /* ---------- RIGHT: MENU ---------- */
    .pane { position: relative; display: flex; flex-direction: column; padding: 28px 5vw 18px 0; min-height: 0; }
    .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; min-height: 92px; }
    .crumbs { font-family: Consolas, monospace; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--dim); }
    .crumbs span { color: var(--lime); }
    #where { font-weight: 200; font-size: clamp(28px, 3.4vw, 46px); letter-spacing: .22em; text-transform: uppercase; margin-top: 6px;
        text-shadow: 0 0 18px rgba(155,240,11,.45); transition: opacity .2s; }
    #count { font-family: Consolas, monospace; font-size: 12px; letter-spacing: .15em; color: var(--dim); margin-top: 4px; }
    .tools { display: flex; align-items: center; gap: 14px; font-family: Consolas, monospace; font-size: 13px; color: var(--dim); letter-spacing: .1em; }
    #mute { background: none; border: 1px solid rgba(155,240,11,.35); color: var(--lime); border-radius: 50%; width: 32px; height: 32px; font-size: 14px; }
    #mute:hover { background: rgba(155,240,11,.15); }
    #searchbar { display: none; margin-top: 12px; width: min(440px, 100%); }
    #searchbar.on { display: block; }
    #gameSearch { width: 100%; padding: 11px 18px; font-size: 16px; color: #fff; outline: none; border-radius: 4px;
        background: rgba(0,10,0,.65); border: 1px solid rgba(155,240,11,.45); box-shadow: 0 0 18px rgba(155,240,11,.12) inset; }
    #gameSearch:focus { border-color: var(--lime); box-shadow: 0 0 18px rgba(155,240,11,.35); }

    .listwrap { position: relative; flex: 1; min-height: 0; width: min(560px, 100%); }
    .listwrap { overflow: hidden; }
    #list { position: absolute; inset: 0; transition: opacity .18s ease, transform .18s ease;
        -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 14%, #000 86%, transparent 100%);
                mask-image: linear-gradient(to bottom, transparent 0, #000 14%, #000 86%, transparent 100%); }
    #list.out-f { opacity: 0; transform: translateX(-46px); }
    #list.out-b { opacity: 0; transform: translateX(46px); }
    #list.in-f  { opacity: 0; transform: translateX(70px); transition: none; }
    #list.in-b  { opacity: 0; transform: translateX(-70px); transition: none; }

    .row { position: absolute; left: 0; right: 52px; top: 50%; height: var(--rowh); margin-top: calc(var(--rowh) / -2);
        display: flex; align-items: center; gap: 16px; padding: 0 22px 0 20px; border-radius: 6px; color: #8fae8b;
        transform-origin: left center; user-select: none; -webkit-user-select: none;
        transition: transform .4s cubic-bezier(.2,.85,.25,1), opacity .4s ease, color .2s, background .2s, box-shadow .2s; will-change: transform, opacity; }
    .row.sel { color: #fff;
        background: linear-gradient(90deg, rgba(122,193,67,.42), rgba(122,193,67,.1) 65%, rgba(122,193,67,0));
        box-shadow: inset 3px 0 0 var(--lime), 0 0 30px rgba(155,240,11,.12);
        text-shadow: 0 0 14px rgba(155,240,11,.7); }
    .row.empty { pointer-events: none; }
    .ico { flex: none; width: 42px; height: 42px; border-radius: 9px; background: rgba(255,255,255,.07); display: grid; place-items: center; overflow: hidden; border: 1px solid rgba(255,255,255,.08); }
    .row.sel .ico { border-color: rgba(155,240,11,.7); background: rgba(255,255,255,.14); }
    .ico img { width: 80%; height: 80%; object-fit: contain; }
    .txt { flex: 1; min-width: 0; }
    .name { font-size: 19px; font-weight: 600; letter-spacing: .03em; line-height: 1.18; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .meta { margin-top: 3px; font-size: 11px; letter-spacing: .2em; text-transform: uppercase; color: rgba(143,174,139,.8); }
    .row.sel .meta { color: var(--lime); text-shadow: none; }
    .chev { flex: none; font-size: 22px; opacity: 0; transition: opacity .2s, transform .3s; }
    .row.sel .chev { opacity: .9; transform: translateX(4px); animation: nudge 1.4s ease-in-out infinite; }
    @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(6px); } }

    .arrow { position: absolute; left: 50%; width: 0; height: 0; z-index: 2; opacity: 0; transition: opacity .25s;
        border-left: 11px solid transparent; border-right: 11px solid transparent; padding: 10px; box-sizing: content-box; translate: -50% 0; }
    .arrow.up { top: 0; border-bottom: 13px solid var(--lime); }
    .arrow.down { bottom: 0; border-top: 13px solid var(--lime); }
    .arrow.show { opacity: .8; }
    .arrow.show:hover { opacity: 1; }

    .hints { display: flex; align-items: center; gap: 22px; flex-wrap: wrap; font-family: Consolas, monospace; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--dim); padding-top: 12px; }
    .btn-hint { display: inline-flex; align-items: center; gap: 8px; background: none; border: 0; color: inherit; font: inherit; letter-spacing: inherit; text-transform: inherit; }
    .btn-hint:hover { color: #fff; }
    .btn-hint i { font-style: normal; font-weight: 800; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #021; font-family: 'Segoe UI', sans-serif;
        box-shadow: inset 0 -3px 5px rgba(0,0,0,.35), inset 0 2px 3px rgba(255,255,255,.45), 0 0 10px rgba(0,0,0,.4); }
    .btn-hint .a { background: #7ac143; }
    .btn-hint .b { background: #e0453a; color: #fff; }
    .keys { opacity: .75; }

    @keyframes bump { 0%,100% { translate: 0 0; } 40% { translate: 0 -6px; } }
    #list.bump-up { animation: bump .22s; }
    #list.bump-dn { animation: bump .22s reverse; }

    /* ---------- MOBILE / NARROW ---------- */
    @media (max-width: 820px) {
        :root { --step: 62px; --rowh: 56px; --orb: 104px; }
        #app { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
        .left { flex-direction: row; justify-content: flex-start; gap: 18px; padding: 16px 18px 6px; text-align: left; }
        .orb-wrap { margin-bottom: 0; flex: none; }
        .about, .foot, .keys { display: none; }
        h1 { font-size: 22px; letter-spacing: .1em; }
        .handle { font-size: 13px; margin-top: 4px; }
        .pane { padding: 6px 18px 12px; }
        .head { min-height: 74px; }
        .name { font-size: 16px; }
        .ico { width: 36px; height: 36px; }
        #where { font-size: 24px; }
        #clock { display: none; }
        .crumbs { font-size: 11px; letter-spacing: .1em; }
    }
    @media (max-height: 560px) and (min-width: 821px) { :root { --step: 62px; --rowh: 56px; } .about { display: none; } }
    @media (prefers-reduced-motion: reduce) { .beam, .swirl, .ring, .halo, .logo, .chev { animation: none !important; } }
</style>
</head>
<body>
<div id="bg">
    <div class="beam b1"></div><div class="beam b2"></div><div class="beam b3"></div>
    <canvas id="fx"></canvas>
</div>
<div id="flash"></div>

<div id="app">
    <section class="left">
        <div class="orb-wrap">
            <div class="halo"></div>
            <div class="ring r3"></div><div class="ring r2"></div><div class="ring r1"></div>
            <div class="orb"><div class="swirl"></div><div class="swirl s2"></div><div class="shine"></div></div>
            <img class="logo" src="https://codehs.com/uploads/c69638d51ac51123c4b70ad422b59760" alt="Master Programmer Logo">
        </div>
        <div class="title-block">
            <h1>Super<b>Secret</b>Site</h1>
            <span class="handle">&lt;cjtg999/&gt;</span>
            <p class="about">Hello world! I'm a beginning developer turning ideas into clean code.<br>
                Check out this site's code here:<br>
                <a href="https://github.com/CJTG999/supersecretsite-v2/" target="_blank" rel="noopener">github.com/CJTG999/supersecretsite-v2</a></p>
        </div>
    </section>

    <section class="pane" id="pane">
        <header class="head">
            <div>
                <div class="crumbs" id="crumbs"></div>
                <div id="where">Main</div>
                <div id="count"></div>
                <div id="searchbar"><input type="text" id="gameSearch" placeholder="Search games & projects..." autocomplete="off" spellcheck="false"></div>
            </div>
            <div class="tools"><span id="clock"></span><button id="mute" title="Sound on/off (M)" aria-label="Toggle sound">&#128266;</button></div>
        </header>
        <div class="listwrap">
            <div class="arrow up" id="arrUp" title="Scroll up"></div>
            <div id="list" role="menu"></div>
            <div class="arrow down" id="arrDown" title="Scroll down"></div>
        </div>
        <footer class="hints">
            <button class="btn-hint" id="btnA"><i class="a">A</i>Select</button>
            <button class="btn-hint" id="btnB"><i class="b">B</i>Back</button>
            <span class="keys">&uarr;&darr; / scroll wheel &middot; M sound &middot; / search</span>
        </footer>
    </section>
</div>
<div class="foot">&copy; 2026 CJ Shaffer</div>

        L('All My Projects', 'https://codehs.com/sandbox/cjthegmr999', CH + '169d0f00f17bb5126db76e431b033ce4'),
        L('The Epstein Files', 'other/epstein.html', 'other/images/epstein.png'),
        L('Changelog/Updates', 'changelog.html', ICON_CHANGE)
    ];
    const SOCIALS = [
        L('YouTube', 'https://www.youtube.com/@Theguywiththeheadsetdent', CH + '48e067131fa7db9a230f215de314d198', 'Open'),
        L('GitHub - Site Code', 'https://github.com/CJTG999/supersecretsite-v2/', CH + '944391ed870d330381540ffbc985b287', 'Open'),
        L('Xbox', 'https://xboxgamertag.com/search/ElArCJTheGmr', CH + '7c5020b432c2b3e4fd67b19a5aed5a26', 'Open'),
        L('CodeHS', 'https://codehs.com/sandbox/poyoversedevs', CH + '169d0f00f17bb5126db76e431b033ce4', 'Open'),
        L('Scratch', 'https://scratch.mit.edu/users/CJTheGamer999/', CH + '3348b5e08204a4e6364b60be411585c9', 'Open')
    ];
    const CONTACT = [ L('Contact Me', 'mailto:cjthegamer999@gmail.com', CH + '743db9803f44a08a3ad0ab659602dc79', 'Email') ];

    const cat = (title, icon, items) => ({ title, icon, items, meta: items.length + (items.length === 1 ? ' item' : ' items') });
    const ALL = [].concat(GAMES, TOOLS, PROJECTS, SOCIALS, CONTACT);
    const TAGGED = [
        [GAMES, 'Games'], [TOOLS, 'Tools'], [PROJECTS, 'Projects'], [SOCIALS, 'Socials'], [CONTACT, 'Contact']
    ];
    const catOf = (it) => { for (const [arr, name] of TAGGED) if (arr.indexOf(it) > -1) return name; return ''; };

    const SEARCH_CAT = { title: 'Search', icon: ICON_SEARCH, special: 'search', meta: 'Find anything' };
    const MAIN = [
        cat('Games', CH + '01e12206660fe765a10dbed8dd1411d1', GAMES),
        cat('Apps & Tools', 'https://github.com/CJTG999/webPod/blob/main/assets/favicon.png?raw=true', TOOLS),
        cat('Projects', CH + '169d0f00f17bb5126db76e431b033ce4', PROJECTS),
        cat('Socials', CH + '48e067131fa7db9a230f215de314d198', SOCIALS),
        cat('Contact', CH + '743db9803f44a08a3ad0ab659602dc79', CONTACT),
        SEARCH_CAT
    ];

    /* ================= STATE ================= */
    const $ = (id) => document.getElementById(id);
    const listEl = $('list'), whereEl = $('where'), countEl = $('count'), crumbsEl = $('crumbs');
    const searchBar = $('searchbar'), searchInput = $('gameSearch');
    const arrUp = $('arrUp'), arrDown = $('arrDown');

    let cur = { items: MAIN, title: 'Main' };
    let stack = [];           // previous levels: {items,title,index}
    let rows = [];
    let index = 0;
    let busy = false;
    let searchMode = false;

    /* ================= SOUND ================= */
    let actx = null, muted = false;
    try { muted = localStorage.getItem('sss-muted') === '1'; } catch (e) {}
    function unlock() {
        if (!actx) { try { actx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
        if (actx && actx.state === 'suspended') actx.resume();
    }
    function beep(f1, f2, dur, type, vol) {
        if (muted || !actx) return;
        const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
        o.type = type || 'sine';
        o.frequency.setValueAtTime(f1, t);
        if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + dur);
        g.gain.setValueAtTime(vol || .06, t);
        g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        o.connect(g); g.connect(actx.destination);
        o.start(t); o.stop(t + dur + .02);
    }
    const sTick   = () => beep(1240, 900, .06, 'triangle', .05);
    const sSelect = () => { beep(520, 780, .12, 'sine', .07); setTimeout(() => beep(780, 1170, .16, 'sine', .06), 70); };
    const sBack   = () => beep(700, 380, .15, 'sine', .06);
    const sBump   = () => beep(180, 140, .09, 'square', .03);
    function refreshMute() { $('mute').innerHTML = muted ? '&#128263;' : '&#128266;'; }
    function toggleMute() {
        muted = !muted; refreshMute();
        try { localStorage.setItem('sss-muted', muted ? '1' : '0'); } catch (e) {}
        unlock(); if (!muted) sTick();
    }
    refreshMute();

    /* ================= RENDER ================= */
    function makeRow(it, i, showCat) {
        const r = document.createElement('div');
        r.className = 'row' + (it.empty ? ' empty' : '');
        r.setAttribute('role', 'menuitem');
        const ico = document.createElement('div'); ico.className = 'ico';
        if (it.icon) {
            const im = document.createElement('img'); im.src = it.icon; im.alt = '';
            im.onerror = function () { this.style.display = 'none'; };
            ico.appendChild(im);
        }
        const txt = document.createElement('div'); txt.className = 'txt';
        const nm = document.createElement('div'); nm.className = 'name'; nm.textContent = it.title; nm.title = it.title;
        txt.appendChild(nm);
        const metaText = it.empty ? '' : (showCat && !it.items ? catOf(it) + ' · ' + it.meta : it.meta);
        if (metaText) { const m = document.createElement('div'); m.className = 'meta'; m.textContent = metaText; txt.appendChild(m); }
        const ch = document.createElement('div'); ch.className = 'chev'; ch.textContent = '›';
        if (!it.empty) { r.appendChild(ico); }
        r.appendChild(txt); r.appendChild(ch);
        r.addEventListener('click', () => {
            unlock();
            if (busy || it.empty) return;
            if (i !== index) { index = i; layout(); sTick(); } else { activate(); }
        });
        return r;
    }

    function build(items, startIndex, showCat) {
        listEl.textContent = '';
        rows = items.map((it, i) => { const r = makeRow(it, i, showCat); listEl.appendChild(r); return r; });
        index = Math.max(0, Math.min(startIndex || 0, items.length - 1));
        layout(true);
    }

    function layout() {
        const step = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--step')) || 76;
        rows.forEach((r, i) => {
            const off = i - index, a = Math.abs(off);
            if (a > 5) {
                r.style.opacity = 0; r.style.pointerEvents = 'none';
                r.style.transform = 'translate(' + (a * a * 12) + 'px,' + (off * step) + 'px) scale(.6)';
                r.classList.remove('sel'); return;
            }
            const x = off === 0 ? 14 : a * a * 11;
            const s = off === 0 ? 1.05 : Math.max(.72, 1 - a * .08);
            const o = off === 0 ? 1 : Math.max(.1, .74 - a * .15);
            r.style.transform = 'translate(' + x + 'px,' + (off * step) + 'px) scale(' + s + ')';
            r.style.opacity = o;
            r.style.pointerEvents = '';
            r.classList.toggle('sel', off === 0);
        });
        const n = cur.items.length, empty = n === 1 && cur.items[0].empty;
        countEl.textContent = (empty || cur.items === MAIN) ? (cur.items === MAIN ? n + ' sections' : '') : (index + 1) + ' / ' + n;
        arrUp.classList.toggle('show', index > 0);
        arrDown.classList.toggle('show', index < n - 1);
    }

    function setHeader() {
        whereEl.textContent = cur.title;
        const trail = stack.map((s) => s.title).concat(cur.title);
        crumbsEl.innerHTML = '';
        const base = document.createElement('span'); base.textContent = 'SuperSecretSite';
        crumbsEl.appendChild(base);
        trail.forEach((t) => crumbsEl.appendChild(document.createTextNode(' › ' + t)));
    }

    function swap(dir, after) {
        busy = true;
        listEl.classList.add(dir === 'f' ? 'out-f' : 'out-b');
        setTimeout(() => {
            after();
            listEl.classList.remove('out-f', 'out-b');
            listEl.classList.add(dir === 'f' ? 'in-f' : 'in-b');
            void listEl.offsetWidth;
            listEl.classList.remove('in-f', 'in-b');
            setTimeout(() => { busy = false; }, 120);
        }, 170);
    }

    /* ================= NAVIGATION ================= */
    function move(d) {
        if (busy) return;
        const n = cur.items.length;
        if (n === 1 && cur.items[0].empty) return;
        const ni = Math.max(0, Math.min(n - 1, index + d));
        if (ni === index) {
            listEl.classList.remove('bump-up', 'bump-dn'); void listEl.offsetWidth;
            listEl.classList.add(d < 0 ? 'bump-up' : 'bump-dn'); sBump(); return;
        }
        index = ni; layout(); sTick();
    }
    function jump(i) { if (busy) return; const ni = Math.max(0, Math.min(cur.items.length - 1, i)); if (ni !== index) { index = ni; layout(); sTick(); } }

    function enterLevel(items, title, special) {
        stack.push({ items: cur.items, title: cur.title, index: index });
        swap('f', () => {
            cur = { items: items, title: title };
            setHeader();
            if (special === 'search') startSearch(); else build(items, 0, false);
        });
    }

    function back() {
        if (busy) return;
        if (!stack.length) { sBump(); return; }
        sBack();
        const prev = stack.pop();
        swap('b', () => {
            if (searchMode) stopSearch();
            cur = { items: prev.items, title: prev.title };
            setHeader();
            build(prev.items, prev.index, false);
        });
    }

    function activate() {
        if (busy) return;
        const it = cur.items[index];
        if (!it || it.empty) return;
        unlock(); sSelect();
        if (it.special === 'search') { enterLevel(ALL, 'Search', 'search'); return; }
        if (it.items) { enterLevel(it.items, it.title, null); return; }
        if (it.href) launch(it);
    }

    function launch(it) {
        const href = it.href;
        const external = /^https?:\/\//i.test(href);
        if (external) { window.open(href, '_blank', 'noopener'); return; }
        busy = true;
        $('flash').classList.add('on');
        setTimeout(() => { location.href = href; }, 230);
        setTimeout(() => { $('flash').classList.remove('on'); busy = false; }, 1500); // if user navigates back (bfcache)
    }

    /* ================= SEARCH ================= */
    function startSearch() {
        searchMode = true;
        searchBar.classList.add('on');
        searchInput.value = '';
        runSearch();
        setTimeout(() => searchInput.focus({ preventScroll: true }), 60);
    }
    function stopSearch() {
        searchMode = false;
        searchBar.classList.remove('on');
        searchInput.value = '';
        searchInput.blur();
    }
    function runSearch() {
        const q = searchInput.value.trim().toLowerCase();
        const hits = ALL.filter((it) => !q || it.title.toLowerCase().indexOf(q) > -1 || catOf(it).toLowerCase().indexOf(q) > -1);
        cur.items = hits.length ? hits : [{ title: 'No results for "' + searchInput.value.trim() + '"', empty: true }];
        build(cur.items, 0, true);
    }
    searchInput.addEventListener('input', runSearch);

    function goSearch() {
        if (busy) return;
        if (searchMode) { searchInput.focus(); return; }
        unlock(); sSelect();
        stack = [];
        const root = { items: MAIN, title: 'Main', index: MAIN.indexOf(SEARCH_CAT) };
        stack.push(root);
        swap('f', () => { cur = { items: ALL, title: 'Search' }; setHeader(); startSearch(); });
    }

    /* ================= INPUT ================= */
    const KEYCODES = { 38: 'ArrowUp', 40: 'ArrowDown', 37: 'ArrowLeft', 39: 'ArrowRight', 13: 'Enter', 27: 'Escape',
        8: 'Backspace', 32: ' ', 33: 'PageUp', 34: 'PageDown', 36: 'Home', 35: 'End' };
    const KEYALIAS = { Up: 'ArrowUp', Down: 'ArrowDown', Left: 'ArrowLeft', Right: 'ArrowRight', Esc: 'Escape', Spacebar: ' ' };
    function keyName(e) {
        if (e.key && e.key !== 'Unidentified' && e.key !== 'Process') return KEYALIAS[e.key] || e.key;
        return KEYCODES[e.keyCode] || '';
    }

    function onKey(e) {
        const key = keyName(e);
        if (e.ctrlKey && e.shiftKey && (key === 'p' || key === 'P')) {   // secret redirect (kept)
            e.preventDefault(); window.location.href = 'other/nexusproxy/public/index.html'; return;
        }
        if (e.ctrlKey || e.altKey || e.metaKey) return;
        unlock();
        const typing = document.activeElement === searchInput;
        switch (key) {
            case 'ArrowDown': e.preventDefault(); move(1); return;
            case 'ArrowUp': e.preventDefault(); move(-1); return;
            case 'PageDown': e.preventDefault(); move(5); return;
            case 'PageUp': e.preventDefault(); move(-5); return;
            case 'Enter': e.preventDefault(); activate(); return;
            case 'Escape': e.preventDefault(); back(); return;
        }
        if (typing) return;
        switch (key) {
            case 'Home': e.preventDefault(); jump(0); return;
            case 'End': e.preventDefault(); jump(cur.items.length - 1); return;
            case 's': case 'S': move(1); return;
            case 'w': case 'W': move(-1); return;
            case ' ': case 'ArrowRight': e.preventDefault(); activate(); return;
            case 'Backspace': case 'ArrowLeft': e.preventDefault(); back(); return;
            case 'm': case 'M': toggleMute(); return;
            case '/': e.preventDefault(); goSearch(); return;
        }
    }
    // Capture on window so keys work even if a button/other element has focus.
    window.addEventListener('keydown', onKey, true);

    // Keep keyboard focus on the page (important when embedded in an iframe like CodeHS).
    document.body.setAttribute('tabindex', '-1');
    function grabFocus() {
        if (document.activeElement === searchInput) return;
        try { window.focus(); document.body.focus({ preventScroll: true }); } catch (err) {}
    }
    grabFocus();
    window.addEventListener('load', grabFocus);
    window.addEventListener('pointerdown', (e) => { unlock(); if (e.target !== searchInput) grabFocus(); }, true);
    // Clicking a hint button shouldn't leave it focused (Enter would then double-fire).
    document.addEventListener('pointerup', () => {
        const a = document.activeElement;
        if (a && a.tagName === 'BUTTON') a.blur();
        grabFocus();
    }, true);

    let wheelAt = 0;
    $('pane').addEventListener('wheel', (e) => {
        e.preventDefault();
        const now = performance.now();
        if (now - wheelAt < 110 || Math.abs(e.deltaY) < 2) return;
        wheelAt = now; unlock(); move(e.deltaY > 0 ? 1 : -1);
    }, { passive: false });

    let tx = 0, ty = 0, tt = 0;
    $('pane').addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; ty = e.touches[0].clientY; tt = Date.now(); }, { passive: true });
    $('pane').addEventListener('touchend', (e) => {
        const dx = e.changedTouches[0].clientX - tx, dy = e.changedTouches[0].clientY - ty;
        if (Date.now() - tt > 700) return;
        unlock();
        if (Math.abs(dy) > 38 && Math.abs(dy) > Math.abs(dx)) move(dy < 0 ? 1 : -1);
        else if (dx > 80 && Math.abs(dx) > Math.abs(dy) * 1.5) back();
    }, { passive: true });

    arrUp.addEventListener('click', () => { unlock(); move(-1); });
    arrDown.addEventListener('click', () => { unlock(); move(1); });
    $('btnA').addEventListener('click', () => { unlock(); activate(); });
    $('btnB').addEventListener('click', () => { unlock(); back(); });
    $('mute').addEventListener('click', toggleMute);

    /* Gamepad: d-pad / left stick, A = select, B = back */
    const padState = {};
    function padPress(name, down, now, fn, repeat) {
        const st = padState[name];
        if (down) {
            if (!st) { padState[name] = { t: now + 280 }; fn(); }
            else if (repeat && now > st.t) { st.t = now + 90; fn(); }
        } else padState[name] = null;
    }
    function pollPad() {
        let pads;
        try {
            pads = navigator.getGamepads ? navigator.getGamepads() : [];
        } catch (err) {
            return; // gamepad blocked by the embedding page's permissions policy: stop polling quietly
        }
        const now = performance.now();
        for (const p of pads) {
            if (!p) continue;
            const ax = p.axes[1] || 0, b = p.buttons;
            padPress('up', (b[12] && b[12].pressed) || ax < -.6, now, () => { unlock(); move(-1); }, true);
            padPress('dn', (b[13] && b[13].pressed) || ax > .6, now, () => { unlock(); move(1); }, true);
            padPress('a', b[0] && b[0].pressed, now, () => { unlock(); activate(); }, false);
            padPress('b', b[1] && b[1].pressed, now, () => { unlock(); back(); }, false);
        }
        requestAnimationFrame(pollPad);
    }
    requestAnimationFrame(pollPad);

    /* Clock */
    function tickClock() {
        const d = new Date();
        $('clock').textContent = d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    }
    tickClock(); setInterval(tickClock, 15000);

    /* ================= BACKGROUND PARTICLES ================= */
    (function particles() {
        const cv = $('fx'), cx = cv.getContext('2d');
        let W = 0, H = 0, dpr = 1, ps = [];
        const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        function size() {
            dpr = Math.min(window.devicePixelRatio || 1, 2);
            W = cv.clientWidth; H = cv.clientHeight;
            cv.width = W * dpr; cv.height = H * dpr; cx.setTransform(dpr, 0, 0, dpr, 0, 0);
            const n = Math.round(Math.min(90, (W * H) / 16000));
            ps = [];
            for (let i = 0; i < n; i++) ps.push(spawn(true));
        }
        function spawn(any) {
            return { x: Math.random() * W, y: any ? Math.random() * H : H + 10, r: .6 + Math.random() * 2.2,
                v: .12 + Math.random() * .45, d: (Math.random() - .5) * .25, a: .15 + Math.random() * .55, p: Math.random() * 6.28 };
        }
        function frame(t) {
            cx.clearRect(0, 0, W, H);
            cx.globalCompositeOperation = 'lighter';
            for (const p of ps) {
                p.y -= p.v; p.x += p.d + Math.sin(t / 1800 + p.p) * .15;
                if (p.y < -10) Object.assign(p, spawn(false));
                const tw = .6 + .4 * Math.sin(t / 700 + p.p);
                const g = cx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 5);
                g.addColorStop(0, 'rgba(170,255,100,' + (p.a * tw) + ')');
                g.addColorStop(1, 'rgba(170,255,100,0)');
                cx.fillStyle = g; cx.beginPath(); cx.arc(p.x, p.y, p.r * 5, 0, 6.283); cx.fill();
            }
            if (!reduce) requestAnimationFrame(frame);
        }
        size(); window.addEventListener('resize', size);
        requestAnimationFrame(frame);
    })();

    window.addEventListener('resize', layout);
    // bfcache: coming back from a launched page
    window.addEventListener('pageshow', () => { $('flash').classList.remove('on'); busy = false; });

    /* ================= BOOT ================= */
    setHeader();
    listEl.classList.add('in-f');
    build(MAIN, 0, false);
    setTimeout(() => { void listEl.offsetWidth; listEl.classList.remove('in-f'); }, 450);
})();
